<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Calendar & Data Divider</title>
    <style>
        /* 전체 배경 (차분하고 깊이감 있는 톤) */
        body {
            background-color: #0f111a;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 메인 컨테이너 */
        .wrapper {
            width: 380px;
            background: #161925;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* 1. 달력 영역 스타일 */
        .calendar-section {
            padding: 10px;
            text-align: center;
            color: #8b9bb4;
            font-size: 14px;
        }
        .calendar-placeholder {
            font-size: 18px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        /* 🌟 가장 공들인 멋진 경계선 (Gradient Divider) */
        .stylish-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
        }
        .stylish-divider::before,
        .stylish-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            /* 은은하게 사라지는 그라데이션 효과 */
            background: linear-gradient(to right, rgba(99, 102, 241, 0), rgba(99, 102, 241, 0.6), rgba(168, 85, 247, 0));
        }
        .divider-badge {
            background: rgba(99, 102, 241, 0.1);
            color: #a5b4fc;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
            margin: 0 10px;
            letter-spacing: 0.5px;
        }

        /* 2. 데이터 영역 스타일 (입체적인 카드 형태) */
        .data-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 18px;
            backdrop-filter: blur(10px);
        }
        .data-title {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .data-content {
            font-size: 15px;
            font-weight: 500;
            color: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- 달력 영역 -->
        <div class="calendar-section">
            <div class="calendar-placeholder">📅 2026년 7월 24일 (금)</div>
            <span>캘린더 뷰가 위치하는 공간입니다.</span>
        </div>

        <!-- 🌟 멋지게 구분된 경계선 -->
        <div class="stylish-divider">
            <span class="divider-badge">TODAY'S DATA</span>
        </div>

        <!-- 데이터 영역 -->
        <div class="data-section">
            <div class="data-title">실시간 데이터 / 일정 요약</div>
            <div class="data-content">✨ 프로젝트 마감일 조율 및 회의 예정</div>
        </div>
    </div>

</body>
</html>
