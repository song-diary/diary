    // V153: 4자 넘으면 2줄로 나누는 스마트 포맷
    function formatCalLabel(text) {
        if (!text) return '';
        const clean = String(text).trim();
        if (clean.length <= 4) return clean;
        // 5자 이상: 2~3자 + 나머지
        if (clean.length === 5) {
            return clean.slice(0,2) + '<br>' + clean.slice(2);
        }
        if (clean.length === 6) {
            return clean.slice(0,3) + '<br>' + clean.slice(3);
        }
        // 7자 이상: 3자 + 3자 + 나머지
        if (clean.length >= 7) {
            return clean.slice(0,3) + '<br>' + clean.slice(3,6);
        }
        return clean;
    }

    function renderCalendar() {
        const title = document.getElementById('cal-month-title');
        const grid = document.getElementById('cal-days-grid');
        if (!title || !grid) return;

        title.textContent = \`\${calYear}년 \${calMonth + 1}월\`;
        grid.innerHTML = '';

        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const lastDate = new Date(calYear, calMonth + 1, 0).getDate();
        const prevYear = calMonth === 0 ? calYear - 1 : calYear;
        const prevMonth = calMonth === 0 ? 11 : calMonth - 1;
        const prevLastDate = new Date(prevYear, prevMonth + 1, 0).getDate();
        const nextYear = calMonth === 11 ? calYear + 1 : calYear;
        const nextMonth = calMonth === 11 ? 0 : calMonth + 1;

        const holidays = getKoreanHolidays(calYear);
        const todayStr = getTodayStr();

        // v36:
        // 현재 달 앞쪽에는 전월 말일, 뒤쪽에는 다음 달 초 날짜를 희미하게 표시한다.
        // 7열 달력의 한 주 단위가 끊기지 않도록 마지막 행까지 채운다.
        const gap = 2;
        const gridWidth = grid.getBoundingClientRect().width || grid.parentElement.getBoundingClientRect().width;
        const cellSize = (gridWidth - gap * 6) / 7;
        const compactHeight = cellSize; // v59 정사각형 // v58 더 줄임

        const totalCells = firstDay + lastDate;
        const totalRows = Math.ceil(totalCells / 7);
        const totalVisibleCells = totalRows * 7;

        // v58 - 모든 행 완전 동일, 30,31 작아지는 버그 수정
        let maxExtra = 0; // v59 정사각형이므로 extra 무시
        for (let day = 1; day <= lastDate; day++) {
            const mStr = String(calMonth + 1).padStart(2, '0');
            const dStr = String(day).padStart(2, '0');
            const dateStr = \`\${calYear}-\${mStr}-\${dStr}\`;
            const specialInfo = getSpecialDayLabel(dateStr);
            const annivText = getAnniversaryForDate(dateStr);
            if (specialInfo || annivText) {
                maxExtra = Math.max(maxExtra, specialInfo && annivText ? 10 : 6);
            }
        }
        const rowExtra = new Array(totalRows).fill(maxExtra);
        const rowHeights = new Array(totalRows).fill(cellSize * 1.25); // V155 A안: 3줄 보이게 세로 25% 늘림
        const rowTops = [];
        let currentTop = 0;

        for (let r = 0; r < totalRows; r++) {
            rowTops[r] = currentTop;
            currentTop += rowHeights[r] + (r < totalRows - 1 ? gap : 0);
        }

        grid.style.height = \`\${currentTop}px\`;

        function placeCell(el, cellIndex, rowSpan = 1) {
            const col = cellIndex % 7;
            const row = Math.floor(cellIndex / 7);

            el.style.left = \`\${col * (cellSize + gap)}px\`;
            el.style.top = \`\${rowTops[row]}px\`;
            el.style.width = \`\${cellSize}px\`;

            let height = rowHeights[row];
            for (let r = 1; r < rowSpan && row + r < totalRows; r++) {
                height += gap + rowHeights[row + r];
            }
            el.style.height = \`\${height}px\`;
        }

        function makeAdjacentDateCell(dateStr, day, cellIndex) {
            const cell = document.createElement('div');
            cell.className = 'cal-cell adjacent-month';
            placeCell(cell, cellIndex, 1);
            const specialInfo = getSpecialDayLabel(dateStr);
            const annivText = getAnniversaryForDate(dateStr);
            let indicatorHTML = '';
            if (specialInfo) {
                indicatorHTML += \`<div class="cal-special-label cal-special-\${specialInfo.type}">\${formatCalLabel(specialInfo.label)}</div>\`;
            }
            if (annivText) {
                indicatorHTML += \`<div class="cal-anniv-label">\${formatCalLabel(annivText)}</div>\`;
            }
            cell.innerHTML = \`<div class="cal-cell-inner"><span>\${day}</span>\${indicatorHTML}</div>\`;
            cell.onclick = () => {
                const target = normalizeDateStr(dateStr);
                const targetObj = new Date(Number(target.slice(0, 4)), Number(target.slice(5, 7)) - 1, Number(target.slice(8, 10)));
                calYear = targetObj.getFullYear();
                calMonth = targetObj.getMonth();
                calEnlargedDate = null;
                selectedViewDate = target;
                renderCalendar();
                renderDiaryAroundToday();
                renderMoneyAroundToday();
                if (isDiarySearchFilterOpen) filterDiaryCustomList();
            };
            grid.appendChild(cell);
        }

        // 전월 말일 표시: 예) 8월 화면이면 7월 26~31일
        for (let i = 0; i < firstDay; i++) {
            const day = prevLastDate - firstDay + i + 1;
            const dateStr =
                \`\${prevYear}-\${String(prevMonth + 1).padStart(2, '0')}-\${String(day).padStart(2, '0')}\`;
            makeAdjacentDateCell(dateStr, day, i);
        }

        // 현재 달
        for (let day = 1; day <= lastDate; day++) {
            const mStr = String(calMonth + 1).padStart(2, '0');
            const dStr = String(day).padStart(2, '0');
            const dateStr = \`\${calYear}-\${mStr}-\${dStr}\`;

            const cell = document.createElement('div');
            cell.className = 'cal-cell';

            const dObj = new Date(calYear, calMonth, day);
            const dayOfWeek = dObj.getDay();

                        const cellIndex = firstDay + (day - 1);
            placeCell(cell, cellIndex, 1);

            if (dateStr === todayStr) cell.classList.add('today-date');
            if (selectedViewDate && dateStr === selectedViewDate) cell.classList.add('selected-date');
            // no enlarge

            if (dayOfWeek === 0 || holidays.has(dateStr)) cell.classList.add('sunday');
            else if (dayOfWeek === 6) cell.classList.add('saturday');

            const specialInfo = getSpecialDayLabel(dateStr);
            const annivText = getAnniversaryForDate(dateStr);
            let indicatorHTML = '';

            if (specialInfo) {
                indicatorHTML += \`<div class="cal-special-label cal-special-\${specialInfo.type}">\${formatCalLabel(specialInfo.label)}</div>\`;
            }
            if (annivText) {
                indicatorHTML += \`<div class="cal-anniv-label">\${formatCalLabel(annivText)}</div>\`;
            }

                                    // V200 - 세모 + 안전한 async 로드
            let photoListCount = 0;
            try {
                const allDiaries = getAllDiaries();
                photoListCount = allDiaries.filter(d => normalizeDateStr(d.date) === dateStr && d.photo).length;
            } catch(e){}
            const hasPhotoFlag = photoListCount > 0;
            if(hasPhotoFlag) cell.classList.add('has-photo');
            cell.innerHTML = \`<div class="cal-cell-inner"><span>\${day}</span>\${indicatorHTML}</div>\` + (hasPhotoFlag ? \`<div class="cal-photo-corner" data-date="\${dateStr}" data-count="\${photoListCount}"><span class="corner-count">\${photoListCount > 1 ? photoListCount : ''}</span></div>\` : '');
            cell.onclick = async (e) => {
                const target = e.target.closest('.cal-photo-corner');
                if(target){
                    e.stopPropagation();
                    const dStr = target.getAttribute('data-date');
                    await showPhotosForDate(dStr);
                    return;
                }
                selectDiaryDate(dateStr);
            };
            grid.appendChild(cell);
        }

        // 다음 달 초 표시: 예) 8월 화면이면 9월 1~5일
        const trailingCount = totalVisibleCells - totalCells;
        for (let i = 1; i <= trailingCount; i++) {
            const dateStr =
                \`\${nextYear}-\${String(nextMonth + 1).padStart(2, '0')}-\${String(i).padStart(2, '0')}\`;
            const cellIndex = totalCells + (i - 1);
            makeAdjacentDateCell(dateStr, i, cellIndex);
        }

        updateMoneySummary();
    }

    // 📌 확대는 renderCalendar 안에서 픽셀 좌표를 직접 계산해 처리됨 (CSS grid span 방식은 문제가 있어 폐기)

    function changeMonth(delta) {
        const grid = document.getElementById('cal-days-grid');
        calEnlargedDate = null; // 달이 바뀌면 확대 상태 초기화

        const applyMonthDelta = () => {
            calMonth += delta;
            if (calMonth > 11) { calMonth = 0; calYear++; }
            else if (calMonth < 0) { calMonth = 11; calYear--; }
            // 📌 달만 이동할 뿐 특정 날짜를 자동 선택(하이라이트)하지 않음 (이전에는 1일이 계속 선택 표시되어 지저분해 보이는 문제가 있었음)
        };

        const refreshDiaryPanel = () => {
            renderDiaryAroundToday();
            renderMoneyAroundToday();
            if (isDiarySearchFilterOpen) filterDiaryCustomList();
        };

        if (!grid) {
            applyMonthDelta();
            renderCalendar();
            refreshDiaryPanel();
            return;
        }

        // 🎞️ 이동 방향에 맞춰 살짝 밀려나가는 느낌으로 페이드 아웃
        const outDir = delta > 0 ? -18 : 18;
        grid.style.transition = 'transform 0.14s ease, opacity 0.14s ease';
        grid.style.transform = \`translateX(\${outDir}px)\`;
        grid.style.opacity = '0';

        setTimeout(() => {
            applyMonthDelta();
            renderCalendar();
            refreshDiaryPanel();

            // 반대편에서 등장할 위치로 즉시 이동(애니메이션 없이)
            grid.style.transition = 'none';
            grid.style.transform = \`translateX(\${-outDir}px)\`;
            grid.style.opacity = '0';
            void grid.offsetWidth; // 강제 리플로우로 스타일 적용 확정

            // 제자리로 부드럽게 슬라이드 인
            grid.style.transition = 'transform 0.16s ease, opacity 0.16s ease';
            grid.style.transform = 'translateX(0)';
            grid.style.opacity = '1';
        }, 140);
    }

    // 👆 달력을 손가락으로 좌우로 넘겨서 이전/다음 달로 이동
    (function setupCalendarSwipe() {
        const card = document.getElementById('calendar-card');
        if (!card) return;

        let startX = 0, startY = 0, tracking = false, decided = false, isHorizontal = false;

        card.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            tracking = true;
            decided = false;
            isHorizontal = false;
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
            if (!tracking) return;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;

            if (!decided) {
                if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
                    decided = true;
                    isHorizontal = Math.abs(dx) > Math.abs(dy);
                }
            }

            if (isHorizontal) {
                // 가로 스와이프로 판단되면 세로 스크롤/당겨서 새로고침 동작을 막아 반응이 빠르고 매끄럽게 느껴지도록 처리
                e.preventDefault();
            }
        }, { passive: false });

        function finishSwipe(e) {
            if (!tracking) return;
            tracking = false;
            const touch = e.changedTouches[0];
            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;

            if (isHorizontal && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
                if (dx < 0) changeMonth(1);   // 왼쪽으로 스와이프 → 다음 달
                else changeMonth(-1);          // 오른쪽으로 스와이프 → 이전 달
            }
        }

        card.addEventListener('touchend', finishSwipe, { passive: true });
        card.addEventListener('touchcancel', () => { tracking = false; }, { passive: true });
    })();

    // 📔/💰 입력폼을 다이어리 전용 또는 가계부 전용 화면으로 전환 (서로 헷갈리지 않도록 필요한 항목만 표시)

    // 수정(기존 항목)일 때는 항목 종류로, 새 입력일 때는 현재 보고 있는 탭(다이어리/가계부)으로 자동 판단
    function toggleHealthSection() {

        if (!body) return;
        const isOpen = body.style.display !== 'none';
        body.style.display = isOpen ? 'none' : 'flex';
        if (icon) icon.textContent = isOpen ? '▼' : '▲';
    }

    function resetHealthInputFields() {
        const ids = ['health-systolic', 'health-diastolic', 'health-glucose'];
        ids.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
        const glucoseTypeEl = document.getElementById('health-glucose-type');
        if (glucoseTypeEl) glucoseTypeEl.value = '공복';
        const medM = document.getElementById('health-med-morning');
        const medE = document.getElementById('health-med-evening');
        if (medM) medM.checked = false;
        if (medE) medE.checked = false;
        const body = document.getElementById('health-input-body');
        const icon = document.getElementById('health-toggle-icon');
        if (body) body.style.display = 'none';
        if (icon) icon.textContent = '▼';
    }

    function populateHealthInputFields(healthObj) {
        resetHealthInputFields();
        if (!healthObj) return;
        if (healthObj.systolic) document.getElementById('health-systolic').value = healthObj.systolic;
        if (healthObj.diastolic) document.getElementById('health-diastolic').value = healthObj.diastolic;
        if (healthObj.glucose) document.getElementById('health-glucose').value = healthObj.glucose;
        if (healthObj.glucoseType) document.getElementById('health-glucose-type').value = healthObj.glucoseType;
        document.getElementById('health-med-morning').checked = !!healthObj.medMorning;
        document.getElementById('health-med-evening').checked = !!healthObj.medEvening;
        // 저장된 값이 하나라도 있으면 입력폼을 열어서 바로 보이게 함
        const hasAny = healthObj.systolic || healthObj.diastolic || healthObj.glucose || healthObj.medMorning || healthObj.medEvening;
        if (hasAny) {
            document.getElementById('health-input-body').style.display = 'flex';
            document.getElementById('health-toggle-icon').textContent = '▲';
        }
    }

    function collectHealthInputValue() {
        const sysVal = document.getElementById('health-systolic').value.trim();
        const diaVal = document.getElementById('health-diastolic').value.trim();
        const glucoseVal = document.getElementById('health-glucose').value.trim();
        const glucoseType = document.getElementById('health-glucose-type').value;
        const medMorning = document.getElementById('health-med-morning').checked;
        const medEvening = document.getElementById('health-med-evening').checked;

        if (!sysVal && !diaVal && !glucoseVal && !medMorning && !medEvening) return null;
        return {
            systolic: sysVal ? Number(sysVal) : null,
            diastolic: diaVal ? Number(diaVal) : null,
            glucose: glucoseVal ? Number(glucoseVal) : null,
            glucoseType: glucoseVal ? glucoseType : null,
            medMorning: medMorning,
            medEvening: medEvening
        };
    }

    // ===================== 📷 사진 저장소: IndexedDB (localStorage 5MB 한계 회피) =====================
    // 다이어리 항목(item.photo)에는 실제 이미지 데이터 대신 "사진 키(key)" 문자열만 저장하고,
    // 실제 base64 이미지 데이터는 IndexedDB에 저장합니다. photoCache는 빠른 동기 렌더링을 위한 메모리 캐시입니다.
    const PHOTO_DB_NAME = 'SmartDiaryPhotoDB';
    const PHOTO_STORE_NAME = 'photos';
    let __photoDbPromise = null;

async function getPhotoSrcAsyncSafe(key){
  if(!key) return '';
  if(key.startsWith('data:image') || key.startsWith('data:video')) return key;
  try{ if(typeof photoCache!=='undefined' && photoCache[key]) return photoCache[key]; }catch(e){}
  try{ if(window.photoCache && window.photoCache[key]) return window.photoCache[key]; }catch(e){}
  // IDB 직접
  try{
    const db = await openPhotoDB();
    const rec = await new Promise((res, rej)=>{
      const tx = db.transaction(PHOTO_STORE_NAME, 'readonly');
      const st = tx.objectStore(PHOTO_STORE_NAME);
      const r = st.get(key);
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>rej(r.error);
    });
    if(rec && rec.data){ 
      try{ photoCache[key]=rec.data; }catch(e){}
      try{ window.photoCache[key]=rec.data; }catch(e){}
      return rec.data; 
    }
  }catch(e){ console.log('IDB fail', e); }
  return '';
}

    function openPhotoDB() {
        if (__photoDbPromise) return __photoDbPromise;
        __photoDbPromise = new Promise((resolve, reject) => {
            if (!window.indexedDB) { reject(new Error('IndexedDB 미지원 브라우저')); return; }
            const req = indexedDB.open(PHOTO_DB_NAME, 1);
            req.onupgradeneeded = () => {
                const db = req.result;
                if (!db.objectStoreNames.contains(PHOTO_STORE_NAME)) {
                    db.createObjectStore(PHOTO_STORE_NAME, { keyPath: 'id' });
                }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
        return __photoDbPromise;
    }

    function generatePhotoKey(diaryId) {
        return \`photo_\${diaryId}_\${Date.now()}\`;
    }

    async function savePhotoToDB(key, dataUrl) {
        try {
            const db = await openPhotoDB();
            await new Promise((resolve, reject) => {
                const tx = db.transaction(PHOTO_STORE_NAME, 'readwrite');
                tx.objectStore(PHOTO_STORE_NAME).put({ id: key, data: dataUrl });
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
        } catch (e) {
            console.error('사진 저장(IndexedDB) 실패:', e);
        }
    }

    async function deletePhotoFromDB(key) {
        if (!key) return;
        delete photoCache[key];
        try {
            const db = await openPhotoDB();
            await new Promise((resolve, reject) => {
                const tx = db.transaction(PHOTO_STORE_NAME, 'readwrite');
                tx.objectStore(PHOTO_STORE_NAME).delete(key);
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
        } catch (e) {
            console.error('사진 삭제(IndexedDB) 실패:', e);
        }
    }

    // 렌더링에서 사용: item.photo(키 문자열)를 실제 이미지 데이터(base64)로 변환
    function getPhotoSrc(photoKeyOrData) {
        if (!photoKeyOrData) return '';
        // 혹시 아직 마이그레이션되지 않은 옛날 데이터(원본 base64가 그대로 남아있는 경우) 호환 처리
        if (photoKeyOrData.indexOf('data:image')===0 || photoKeyOrData.indexOf('data:video')===0) return photoKeyOrData;
        return photoCache[photoKeyOrData] || '';
    }

    // ❤️ 건강 기록(혈압/혈당/복약) 배지 - 판정/색상 없이 입력한 수치만 그대로 표시
    function renderHealthBadgeHTML(item) {
        const h = item.health;
        if (!h) return '';
        const vitalsParts = [];
        if (h.systolic && h.diastolic) vitalsParts.push(\`<span class="health-badge">🩺 \${h.systolic}/\${h.diastolic}</span>\`);
        if (h.glucose) vitalsParts.push(\`<span class="health-badge">🩸 \${h.glucose}\${h.glucoseType ? ' (' + h.glucoseType + ')' : ''}</span>\`);
        const medParts = [];
        if (h.medMorning) medParts.push(\`<span class="health-badge">💊 아침약</span>\`);
        if (h.medEvening) medParts.push(\`<span class="health-badge">💊 저녁약</span>\`);
        if (vitalsParts.length === 0 && medParts.length === 0) return '';
        let html = '';
        if (vitalsParts.length) html += \`<div class="health-badge-row">\${vitalsParts.join('')}</div>\`;
        if (medParts.length) html += \`<div class="health-badge-row">\${medParts.join('')}</div>\`;
        return html;
    }

    // 📷 사진만 표시 (확대보기/저장 기능은 수정폼으로 옮김 - 메인 목록에서는 항목을 터치하면 바로 수정폼이 열림)
    function _blockedVideoCheck(item){ if(item && item.photo && item.photo.startsWith('data:video/')) return ''; }
    function renderPhotoHTML(item) {
        if (!item.photo) return '';
        const _src=getPhotoSrc(item.photo); if(_src && _src.indexOf('data:video')===0){ return \`<div class="diary-photo-wrap"><video src="\${_src}" controls style="width:100%; border-radius:10px;"></video></div>\`; }
        return \`<div class="diary-photo-wrap">
            <img src="\${_src}" class="diary-photo" alt="첨부사진" oncontextmenu="return false;" ondragstart="return false;">
        </div>\`;
    }

    // 📷 사진 확대보기(라이트박스) 열기/닫기 - 항상 동일한 크기 규칙(화면의 90%/85%)으로 표시됨
    function openPhotoLightbox(photoKeyOrData) {
        const src = getPhotoSrc(photoKeyOrData);
        if (!src) {
            alert('사진을 불러올 수 없습니다.');
            return;
        }
        document.getElementById('photo-lightbox-img').src = src;
        document.getElementById('photo-lightbox-overlay').classList.add('active');
        resetPhotoZoom();
    }

    function closePhotoLightbox(event) {
        if (event) event.stopPropagation();
        document.getElementById('photo-lightbox-overlay').classList.remove('active');
        document.getElementById('photo-lightbox-img').src = '';
        resetPhotoZoom();
    }

    // ----- 🔍 사진 전용 커스텀 핀치줌/팬/더블탭 확대 (브라우저 기본 페이지줌과 무관하게 동작 - 입력폼 멈춤버그와 충돌 없음) -----
    let photoZoomScale = 1, photoZoomX = 0, photoZoomY = 0;
    let pzStartDist = 0, pzStartScale = 1, pzPanStartX = 0, pzPanStartY = 0, pzTouchStartX = 0, pzTouchStartY = 0;
    let pzIsPanning = false, pzLastTapTime = 0;

    function resetPhotoZoom() {
        photoZoomScale = 1; photoZoomX = 0; photoZoomY = 0;
        applyPhotoZoomTransform();
    }
    function applyPhotoZoomTransform() {
        const img = document.getElementById('photo-lightbox-img');
        if (img) img.style.transform = \`translate(\${photoZoomX}px, \${photoZoomY}px) scale(\${photoZoomScale})\`;
    }
    function pzTouchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
    }
    // ----- 📆 달력: 선택한 날짜 칸이 grid-row span으로 아래 칸까지 커진 채 유지됨 (renderCalendar 참고) -----

    function initPhotoZoomHandlers() {
        const img = document.getElementById('photo-lightbox-img');
        if (!img) return;

        img.addEventListener('touchstart', function (e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                pzStartDist = pzTouchDistance(e.touches);
                pzStartScale = photoZoomScale;
                pzIsPanning = false;
            } else if (e.touches.length === 1) {
                if (photoZoomScale > 1) {
                    pzIsPanning = true;
                    pzPanStartX = e.touches[0].clientX; pzPanStartY = e.touches[0].clientY;
                    pzTouchStartX = photoZoomX; pzTouchStartY = photoZoomY;
                } else {
                    // 더블탭 감지: 2.5배 확대 ↔ 원래크기 토글
                    const now = Date.now();
                    if (now - pzLastTapTime < 300) {
                        photoZoomScale = photoZoomScale > 1 ? 1 : 2.5;
                        photoZoomX = 0; photoZoomY = 0;
                        applyPhotoZoomTransform();
                    }
                    pzLastTapTime = now;
                }
            }
        }, { passive: false });

        img.addEventListener('touchmove', function (e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dist = pzTouchDistance(e.touches);
                if (pzStartDist > 0) {
                    photoZoomScale = Math.min(4, Math.max(1, pzStartScale * (dist / pzStartDist)));
                    applyPhotoZoomTransform();
                }
            } else if (e.touches.length === 1 && pzIsPanning) {
                e.preventDefault();
                const dx = e.touches[0].clientX - pzPanStartX;
                const dy = e.touches[0].clientY - pzPanStartY;
                photoZoomX = pzTouchStartX + dx;
                photoZoomY = pzTouchStartY + dy;
                applyPhotoZoomTransform();
            }
        }, { passive: false });

        img.addEventListener('touchend', function (e) {
            if (e.touches.length < 2) pzStartDist = 0;
            if (e.touches.length === 0) {
                pzIsPanning = false;
                if (photoZoomScale <= 1) { photoZoomScale = 1; photoZoomX = 0; photoZoomY = 0; applyPhotoZoomTransform(); }
            }
        });
    }

    // 수정 폼의 작은 미리보기 사진: 두 손가락으로 터치하는 순간 바로 확대뷰어를 열어줌
    // (사용자들이 사진이 작을 때 본능적으로 바로 핀치줌부터 시도하는 습관을 반영)
    function initPhotoPreviewPinchOpen() {
        const previewImg = document.getElementById('image-preview');
        if (!previewImg) return;
        previewImg.addEventListener('touchstart', function (e) {
            if (e.touches && e.touches.length >= 2 && editingDiaryId && currentPhotoBase64) {
                e.preventDefault();
                openPhotoLightbox(currentPhotoBase64);
            }
        }, { passive: false });
    }

    // 현재 편집 중인 사진(currentPhotoBase64)을 저장/삭제하고, 다이어리 항목에 넣을 "키"를 반환
    // - DB 저장/삭제는 비동기로 백그라운드에서 진행하되(await 하지 않음), 캐시는 즉시 동기 반영하여 화면이 바로 갱신되도록 함
    function persistCurrentPhoto(diaryId, oldPhotoKey) {
        if (currentPhotoBase64) {
            const key = oldPhotoKey || generatePhotoKey(diaryId);
            photoCache[key] = currentPhotoBase64;
            savePhotoToDB(key, currentPhotoBase64);
            return key;
        }
        if (oldPhotoKey) {
            deletePhotoFromDB(oldPhotoKey);
        }
        return null;
    }

    // 앱 시작 시 1회 실행: 과거 방식(사진 원본이 diary.photo에 직접 저장된 경우) → IndexedDB로 이전,
    // 그리고 IndexedDB에 있는 모든 사진을 photoCache로 미리 로드
    async function migrateAndLoadPhotosFromDB() {
        try {
            const db = await openPhotoDB();
            let diaries = getAllDiaries();
            let migrated = false;

            for (const item of diaries) {
                if (item.photo && typeof item.photo === 'string' && item.photo.indexOf('data:image') === 0) {
                    const key = generatePhotoKey(item.id);
                    await savePhotoToDB(key, item.photo);
                    photoCache[key] = item.photo;
                    item.photo = key;
                    migrated = true;
                }
            }
            if (migrated) {
                localStorage.setItem('smartDiaryList', JSON.stringify(diaries));
            }

            await new Promise((resolve, reject) => {
                const tx = db.transaction(PHOTO_STORE_NAME, 'readonly');
                const req = tx.objectStore(PHOTO_STORE_NAME).getAll();
                req.onsuccess = () => {
                    (req.result || []).forEach(rec => { photoCache[rec.id] = rec.data; });
                    resolve();
                };
                req.onerror = () => reject(req.error);
            });
        } catch (e) {
            console.error('사진 DB 초기화/마이그레이션 실패:', e);
        } finally {
            // v65 - 사진 캐시 로드 후 달력 다시 그리기
            try { if(typeof renderCalendar === 'function') renderCalendar(); } catch(e){}
            try { if(typeof renderDiaryAroundToday === 'function') renderDiaryAroundToday(); } catch(e){}
        }
    }

    // 📷 "바로 사진 찍기": 카메라를 즉시 열고, 찍은 사진을 다이어리 입력폼에 바로 채워서 보여줌
    // (사용자는 그 화면에서 메모를 추가하거나, 바로 "저장"만 눌러 사진만 저장할 수도 있음)
    function triggerQuickPhoto() {
        const input = document.getElementById('quick-photo-input');
        if (input) input.click();
    }

    function handleQuickPhotoCapture(event) {
        const file = event.target.files[0];
        if (!file) return;
        const targetDate = selectedViewDate || getTodayStr();
        const reader = new FileReader();
        reader.onload = function(e) {
            compressImageForStorage(e.target.result, function(compressedDataUrl) {
                openDiaryForm(targetDate, null, 'diary'); // 다이어리 입력폼을 새 항목 모드로 열기
                currentPhotoBase64 = compressedDataUrl;
                updatePhotoPreview();
            });
        };
        reader.readAsDataURL(file);
        event.target.value = ''; // 같은 사진을 연달아 찍어도 change 이벤트가 다시 발생하도록 초기화
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        if (file.type.startsWith('video/') || /\\.(mp4|mov|avi|mkv|webm|3gp)$/i.test(file.name)) {
            alert('동영상은 저장되지 않습니다. 사진만 선택해주세요! 📷');
            event.target.value = '';
            currentPhotoBase64 = null;
            const wrap = document.getElementById('photo-preview-wrap');
            if(wrap) wrap.style.display='none';
            return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
            const result = e.target.result;
            compressImageForStorage(result, function(compressedDataUrl) {
                currentPhotoBase64 = compressedDataUrl;
                if (typeof currentMediaType !== 'undefined') currentMediaType = 'image';
                updatePhotoPreview();
            });
        };
        reader.readAsDataURL(file);
    }  // 📷 사진 첨부 시 용량을 줄여 localStorage 메모리 문제를 방지 (최대 폭/높이 제한 + JPEG 압축)
    function compressImageForStorage(dataUrl, callback) {
        const MAX_DIMENSION = 1280;
        const JPEG_QUALITY = 0.7;
        const img = new Image();
        img.onload = function() {
            let { width, height } = img;
            if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
                if (width >= height) {
                    height = Math.round(height * (MAX_DIMENSION / width));
                    width = MAX_DIMENSION;
                } else {
                    width = Math.round(width * (MAX_DIMENSION / height));
                    height = MAX_DIMENSION;
                }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            try {
                const compressed = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
                callback(compressed);
            } catch (e) {
                console.error(e);
                callback(dataUrl);
            }
        };
        img.onerror = function() {
            callback(dataUrl);
        };
        img.src = dataUrl;
    }

    function updatePhotoPreview() {
        const wrap = document.getElementById('photo-preview-wrap');
        const img = document.getElementById('image-preview');
        if (currentPhotoBase64) {
            img.src = currentPhotoBase64;
            wrap.style.display = 'block';
            // ✏️ 기존 항목을 "수정" 중일 때만 사진을 눌러 크게 볼 수 있음.
            // (사진은 촬영/첨부 시점에 이미 앨범 3에 원본이 저장되어 있으므로, 앱에서 별도로 다시 저장하는
            //  기능은 두지 않음 - 중복 저장을 막기 위함)
            if (editingDiaryId) {
                img.style.cursor = 'default';
                img.onclick = null; // 사진터치 삭제
            } else {
                img.style.cursor = 'default';
                img.onclick = null;
            }
        } else {
            img.src = '';
            img.onclick = null;
            wrap.style.display = 'none';
        }
    }

    function removeImage() {
        if (!confirm('사진을 취소할까요? 삭제한 사진은 복구할 수 없어요.')) return;
        currentPhotoBase64 = null;

    }

    function _orig_manualSaveDiary_block_check(){ if(currentPhotoBase64 && (currentPhotoBase64.startsWith('data:video/') || currentPhotoBase64.includes('video/'))){ alert('동영상은 저장할 수 없습니다!'); return; } }
    function manualSaveDiary() {
        if(currentPhotoBase64 && (currentPhotoBase64.startsWith('data:video/') || currentPhotoBase64.includes('video/'))){ alert('동영상은 저장할 수 없습니다! 사진만 가능합니다.'); currentPhotoBase64=null; return; }
        if(typeof currentMediaType!=='undefined' && currentMediaType==='video'){ alert('동영상은 저장할 수 없습니다!'); currentMediaType='image'; currentPhotoBase64=null; return; }
        const content = (currentFormMode === 'money')
            ? (moneyNoteInput ? moneyNoteInput.value.trim() : '')
            : textOutput.innerHTML.trim();
        const timeVal = reservationTimeInput.value;
        const moneyCategory = moneyCategorySelect.value;
        const rawAmount = moneyAmountInput.value.replace(/[^0-9]/g, '').trim();
        const isCardPending = !!(currentMoneyType === 'expense' && cardPendingCheckbox && cardPendingCheckbox.checked);
        const cardNameVal = (cardPendingNameInput ? cardPendingNameInput.value : '').trim();

        stopVoiceRecording();

        let moneyObj = null;
        if (rawAmount !== '' && !isNaN(rawAmount)) {
            moneyObj = {
                type: currentMoneyType,
                category: moneyCategory,
                amount: Number(rawAmount),
                cardPending: isCardPending,
                cardName: isCardPending ? cardNameVal : ''
            };
        }

        const healthObj = collectHealthInputValue();
        const annivInputEl = document.getElementById('anniv-input');
        const annivVal = annivInputEl ? annivInputEl.value.trim() : '';
        const annivRepeatVal = annivVal ? document.getElementById('anniv-repeat-select').value : 'none';
        const annivCalTypeVal = document.getElementById('anniv-cal-lunar').checked ? 'lunar' : 'solar';

        if (!content && !currentPhotoBase64 && !moneyObj && !healthObj && !annivVal) {
            if (currentFormMode === 'money') {
                alert('가계부 금액을 입력해주세요.');
            } else {
                alert('메모(일기) 내용이나 사진을 입력해주세요.');
            }
            return;
        }

        let diaries = getAllDiaries();
        let oldPhotoKey = null;
        if (editingDiaryId) {
            const oldItem = diaries.find(d => d.id === editingDiaryId);
            oldPhotoKey = oldItem ? (oldItem.photo || null) : null;
        }
        const diaryId = editingDiaryId || Date.now().toString();
        const photoKey = persistCurrentPhoto(diaryId, oldPhotoKey);

        if (editingDiaryId) {
            diaries = diaries.map(item => {
                if (item.id === editingDiaryId) {
                    return { ...item, text: content, time: timeVal, photo: photoKey, money: moneyObj, health: healthObj, anniversary: annivVal || null, annivRepeat: annivRepeatVal, annivCalType: annivCalTypeVal };
                }
                return item;
            });
        } else {
            const newItem = {
                id: diaryId,
                date: selectedReservationDate,
                time: timeVal,
                text: content,
                photo: photoKey,
                money: moneyObj,
                health: healthObj,
                anniversary: annivVal || null,
                annivRepeat: annivRepeatVal,
                annivCalType: annivCalTypeVal
            };
            diaries.push(newItem);
        }

        localStorage.setItem('smartDiaryList', JSON.stringify(diaries));
        closeDiaryForm();
        renderCalendar();
        updateMoneySummary();
        if (isSearchFilterOpen) filterCustomList();
        renderDiaryAroundToday();
        renderMoneyAroundToday();
        if (isDiarySearchFilterOpen) filterDiaryCustomList();
        closeDiaryFormPanel(); // 저장 후 팝업창 닫기
    }

    function deleteDiary(id) {
        if (!confirm('이 항목을 정말 삭제하시겠습니까?')) return;
        let diaries = getAllDiaries();
        const target = diaries.find(d => d.id === id);
        if (target && target.photo) deletePhotoFromDB(target.photo);
        diaries = diaries.filter(d => d.id !== id);
        localStorage.setItem('smartDiaryList', JSON.stringify(diaries));
        renderCalendar();
        updateMoneySummary();
        if (isSearchFilterOpen) filterCustomList();
        renderDiaryAroundToday();
        renderMoneyAroundToday();
        if (isDiarySearchFilterOpen) filterDiaryCustomList();
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            if (recordBtn) recordBtn.style.display = 'none';
            return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.interimResults = true;
        // ⚠️ continuous:true는 안드로이드 크롬에서 이미 확정(final)된 문장을 다시 전달해
        // 텍스트가 반복(이중입력)되는 알려진 버그가 있어, 대신 false로 두고
        // onend에서 shouldRestart일 때 수동으로 재시작하여 끊김없이 이어지도록 처리한다.
        recognition.continuous = false;

        recognition.onstart = () => {
            isRecording = true;
            if (recordBtn) { recordBtn.style.background = '#e74c3c'; recordBtn.textContent = '⏹️ 녹음 중지'; }
        };

        recognition.onresult = (event) => {
            if (!isRecording) return; // 강제 종료 이후 뒤늦게 도착하는 이벤트는 무시 (이중입력 방지)
            let interimText = '';
            let finalText = '';
            for (let i = 0; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) finalText += transcript;
                else interimText += transcript;
            }
            // 매번 전체 결과를 새로 조립(누적 더하기 X)하여, 브라우저가 이미 확정된 구간을
            // 다시 전달하는 경우에도 텍스트가 중복되지 않도록 함
            sessionFinalText = finalText;
            if (textOutput) textOutput.innerHTML = recordingBaseText + finalText + interimText;
        };

        recognition.onend = () => {
            if (shouldRestart) {
                // 재시작 시, 확정된(final) 내용만 새 기준점으로 접어넣고 미확정(interim) 내용은 버림
                recordingBaseText = recordingBaseText + sessionFinalText;
                sessionFinalText = '';
                // 너무 빨리 재시작하면 일부 브라우저에서 오류가 나므로 약간의 지연을 둠
                setTimeout(() => {
                    if (!shouldRestart) return;
                    try { recognition.start(); } catch (e) { console.error(e); }
                }, 200);
                return;
            }
            isRecording = false;
            shouldRestart = false;
            if (recordBtn) { recordBtn.style.background = ''; recordBtn.textContent = '🎤 음성메모'; }
        };

        if (recordBtn) {
            recordBtn.onclick = () => {
                if (!isRecording) {
                    recordingBaseText = textOutput.innerHTML.trim() ? textOutput.innerHTML + ' ' : '';
                    sessionFinalText = '';
                    shouldRestart = true;
                    try { recognition.start(); } catch (e) { console.error(e); }
                } else {
                    shouldRestart = false;
                    try { recognition.stop(); } catch (e) { console.error(e); }
                }
            };
        }
    }

    // 🎤 음성메모 녹음을 확실히 중지하고 상태를 초기화 (저장/닫기 시 이중입력·녹음 지속 방지)
    function stopVoiceRecording() {
        shouldRestart = false;
        if (recognition && isRecording) {

        while (el && el !== document.body && el.nodeType === 1) {

        if (e.target.closest('.modal-overlay.active') || e.target.closest('.photo-lightbox-overlay.active')) {
            const scrollable = findScrollableAncestor(e.target);
            if (touchY > ptrTouchStartY) {
                if (!scrollable || scrollable.scrollTop <= 0) {
                    e.preventDefault();
                }
            }
            return;

        const row = btn.closest('.card-statement-row');
        if (row) row.remove();
    }

    function saveCardStatementRows() {
        if (!cardStatementRowsBox) return;
        const cardName = (document.getElementById('cs-card-name').value || '').trim();
        const rows = cardStatementRowsBox.querySelectorAll('.card-statement-row');

        if (rows.length === 0) {
            alert('입력할 행이 없습니다. 행을 추가해주세요.');
            return;
        }

        let diaries = getAllDiaries();
        let savedCount = 0;

        rows.forEach(row => {
            const dateVal = row.querySelector('.cs-date').value;
            const memoVal = row.querySelector('.cs-memo').value.trim();
            const categoryVal = row.querySelector('.cs-category').value;
            const rawAmount = row.querySelector('.cs-amount').value.replace(/[^0-9]/g, '').trim();

            if (!dateVal || rawAmount === '' || isNaN(rawAmount) || Number(rawAmount) <= 0) {
                return;
            }

            const textParts = [];
            if (cardName) textParts.push(\`[\${cardName}]\`);
            if (memoVal) textParts.push(memoVal);

            const newItem = {
                id: Date.now().toString() + '_' + Math.random().toString(36).slice(2, 7),
                date: normalizeDateStr(dateVal),
                time: '',
                text: textParts.join(' '),
                photo: null,
                money: { type: 'expense', category: categoryVal, amount: Number(rawAmount) }
            };
            diaries.push(newItem);
            savedCount++;

        if (savedCount === 0) {
            alert('저장할 수 있는 행이 없습니다. 날짜와 금액을 확인해주세요.');
            return;
        }

        localStorage.setItem('smartDiaryList', JSON.stringify(diaries));

        cardStatementRowsBox.innerHTML = '';
        addCardStatementRow();

        renderCalendar();
        updateMoneySummary();
        if (isSearchFilterOpen) filterCustomList();
        renderMoneyAroundToday();

        alert(\`\${savedCount}건이 가계부에 저장되었습니다.\`);
        closeCardStatementModal();
    }
