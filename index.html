<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 다이어리</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #4a7c59;
            --primary-hover: #3a6347;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border-color: #d1dedb;
            --accent-today: #e74c3c;
            --sun-color: #d93838; /* 일요일 진한 붉은색 */
            --sat-color: #1b6ca8; /* 토요일 진한 파란색 */
            --weekday-color: #34495e; /* 평일 글자 진하게 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            touch-action: manipulation;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.04);
        }

        /* 상단 바 및 컨트롤 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
        }

        .top-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .action-btn:hover {
            background: var(--primary-hover);
        }

        .font-control-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .font-btn {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-main);
        }

        /* 달력 스타일 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-header h3 {
            color: var(--primary-color);
            font-size: 16px;
        }

        .calendar-header button {
            background: #f8faf9;
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-main);
            font-weight: bold;
        }

        .calendar-header button:hover {
            background: #eaf2f0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .cal-day-name {
            font-size: 12px;
            font-weight: bold;
            padding-bottom: 6px;
        }

        .cal-day-name.sunday { color: var(--sun-color); }
        .cal-day-name.saturday { color: var(--sat-color); }
        .cal-day-name.weekday { color: var(--weekday-color); }

        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            background: #f9fbfb;
            border: 1px solid #edf2f1;
            color: var(--weekday-color);
        }

        .cal-cell:hover {
            background: #eef5f3;
            border-color: var(--primary-color);
        }

        .cal-cell.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .cal-cell.sunday {
            background: #fcf3f3;
            color: var(--sun-color);
        }

        .cal-cell.saturday {
            background: #f0f6fb;
            color: var(--sat-color);
        }

        .cal-cell.today-date {
            border: 2px solid var(--accent-today) !important;
            font-weight: bold;
            background: #fff5f5 !important;
            color: var(--accent-today);
        }

        /* 일정 표시 바 (요일별 컬러) */
        .memo-line {
            width: 65%;
            height: 4px;
            border-radius: 2px;
            margin-top: 4px;
        }
        .memo-line.sun { background-color: var(--sun-color); }
        .memo-line.mon { background-color: #e67e22; }
        .memo-line.tue { background-color: #f1c40f; }
        .memo-line.wed { background-color: #27ae60; }
        .memo-line.thu { background-color: #3498db; }
        .memo-line.fri { background-color: #9b59b6; }
        .memo-line.sat { background-color: var(--sat-color); }

        /* 새 메모 작성 폼 */
        #memo-form-card {
            display: none;
            border: 2px solid var(--primary-color);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .close-form-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: var(--text-sub);
        }

        .reservation-box {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            background: #f0f7fb;
            padding: 8px;
            border-radius: 8px;
        }

        .diary-textarea {
            width: 100%;
            min-height: 100px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            resize: vertical;
            outline: none;
            background: #fff;
            margin-bottom: 10px;
        }

        .diary-textarea:focus {
            border-color: var(--primary-color);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2ece9;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #d0deda;
        }

        /* 리스트 필터 바 */
        .filter-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .filter-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-sub);
            font-weight: bold;
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 메모 리스트 아이템 */
        .diary-item {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            position: relative;
        }

        .diary-item.alarm-memo {
            border-left: 4px solid var(--primary-color);
        }

        .diary-date {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .diary-text {
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .diary-photo {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 8px;
            display: block;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 12px;
            color: #b0c4de;
            cursor: pointer;
        }

        .delete-btn:hover {
            color: var(--accent-today);
        }

        #photo-preview-wrap {
            display: none;
            position: relative;
            margin-bottom: 10px;
        }

        #image-preview {
            max-height: 100px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 상단 설정 바 -->
    <div class="top-bar card">
        <span style="font-weight:bold; color:var(--primary-color); font-size:15px;">🌿 스마트 다이어리</span>
        <div class="top-controls">
            <button class="action-btn" onclick="openDiaryForm(getTodayStr())">➕ 새 메모 쓰기</button>
            <div class="font-control-group">
                <button class="font-btn" onclick="adjustFontSize(-1)">-</button>
                <span style="font-size:11px;">글자</span>
                <button class="font-btn" onclick="adjustFontSize(1)">+</button>
            </div>
        </div>
    </div>

    <!-- 달력 카드 -->
    <div class="card" id="calendar-card">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">◀ 이전</button>
            <h3 id="cal-month-title">0000년 00월</h3>
            <button onclick="changeMonth(1)">다음 ▶</button>
        </div>
        <div class="calendar-grid" id="cal-days-name-grid">
            <div class="cal-day-name sunday">일</div>
            <div class="cal-day-name weekday">월</div>
            <div class="cal-day-name weekday">화</div>
            <div class="cal-day-name weekday">수</div>
            <div class="cal-day-name weekday">목</div>
            <div class="cal-day-name weekday">금</div>
            <div class="cal-day-name saturday">토</div>
        </div>
        <div class="calendar-grid" id="cal-days-grid" style="margin-top: 5px;"></div>
    </div>

    <!-- 새 메모 작성 폼 -->
    <div class="card" id="memo-form-card">
        <div class="form-header-info">
            <span id="form-target-date-title">📅 0000년 00월 00일 메모 작성</span>
            <button class="close-form-btn" onclick="closeDiaryForm()">✖</button>
        </div>
        
        <div class="reservation-box">
            <label>⏰ 알람/예약 시간:</label>
            <input type="time" id="reservation-time-input" style="padding: 4px; border:1px solid var(--border-color); border-radius:4px; background:#fff;">
        </div>

        <div id="photo-preview-wrap">
            <img id="image-preview" src="" alt="미리보기">
            <button class="font-btn" style="margin-top:5px;" onclick="removeImage()">사진 취소</button>
        </div>

        <div id="textOutput" class="diary-textarea" contenteditable="true" placeholder="이곳에 메모를 입력하거나 음성메모를 사용하세요..."></div>

        <div class="btn-group">
            <button class="btn btn-secondary" id="record-btn">🎤 음성메모</button>
            <label class="btn btn-secondary" style="text-align:center; display:flex; align-items:center; justify-content:center; cursor:pointer;">
                📷 사진
                <input type="file" id="diary-photo-input" accept="image/*" style="display:none;" onchange="previewImage(event)">
            </label>
            <button class="btn btn-primary" onclick="manualSaveDiary()">저장</button>
        </div>
    </div>

    <!-- 메모 리스트 카드 -->
    <div class="card">
        <div class="filter-bar">
            <button class="filter-btn active" id="filter-month" onclick="changeFilter('month')">기본 3일</button>
            <button class="filter-btn" id="filter-all" onclick="changeFilter('all')">전체보기</button>
            <button class="filter-btn" id="filter-alarm" onclick="changeFilter('alarm')">예약보기</button>
        </div>
        <div id="diary-list"></div>
    </div>
</div>

<script>
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();
    let currentFilter = 'month'; 
    let selectedReservationDate = null;
    let currentPhotoBase64 = null;
    let currentFontSize = parseInt(localStorage.getItem('smartDiaryFontSize')) || 14;

    let recognition = null;
    let isRecording = false;
    let shouldRestart = false;
    let accumulatedText = '';

    const textOutput = document.getElementById('textOutput');
    const recordBtn = document.getElementById('record-btn');
    const diaryList = document.getElementById('diary-list');
    const reservationTimeInput = document.getElementById('reservation-time-input');
    const memoFormCard = document.getElementById('memo-form-card');
    const formTargetDateTitle = document.getElementById('form-target-date-title');

    function getTodayStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function getCurrentTimeStr() {
        const d = new Date();
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${h}:${min}`;
    }

    function normalizeDateStr(dateStr) {
        if (!dateStr) return getTodayStr();
        return dateStr.replace(/[./]/g, '-');
    }

    function parseDateObj(dateStr) {
        let parts = normalizeDateStr(dateStr).split('-');
        return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function getDayOfWeekStr(dateStr) {
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const dObj = parseDateObj(dateStr);
        return days[dObj.getDay()];
    }

    // 대한민국 음력/양력 주요 공휴일 계산 함수 (대체공휴일 포함 정밀 계산)
    function getKoreanHolidays(year) {
        let holidays = new Set([
            `${year}-01-01`, // 신정
            `${year}-03-01`, // 삼일절
            `${year}-05-05`, // 어린이날
            `${year}-06-06`, // 현충일
            `${year}-08-15`, // 광복절
            `${year}-10-03`, // 개천절
            `${year}-10-09`, // 한글날
            `${year}-12-25`  // 크리스마스
        ]);

        // 음력 명절 (설날, 부처님오신날, 추석) 양력 변환 데이터 (2024~2030 주요 연도 지원)
        const lunarHolidays = {
            2024: ['2024-02-09', '2024-02-10', '2024-02-11', '2024-05-15', '2024-09-16', '2024-09-17', '2024-09-18'],
            2025: ['2025-01-28', '2025-01-29', '2025-01-30', '2025-05-05', '2025-10-05', '2025-10-06', '2025-10-07'],
            2026: ['2026-02-16', '2026-02-17', '2026-02-18', '2026-05-24', '2026-09-24', '2026-09-25', '2026-09-26'],
            2027: ['2027-02-06', '2027-02-07', '2027-02-08', '2027-05-13', '2027-09-14', '2027-09-15', '2027-09-16'],
            2028: ['2028-01-26', '2028-01-27', '2028-01-28', '2028-05-02', '2028-10-02', '2028-10-03', '2028-10-04'],
            2029: ['2029-02-12', '2029-02-13', '2029-02-14', '2029-05-20', '2029-09-21', '2029-09-22', '2029-09-23'],
            2030: ['2030-02-02', '2030-02-03', '2030-02-04', '2030-05-09', '2030-09-11', '2030-09-12', '2030-09-13']
        };

        if (lunarHolidays[year]) {
            lunarHolidays[year].forEach(d => holidays.add(d));
        }

        return holidays;
    }

    function getAllDiaries() {
        let combinedList = [];
        let standardData = localStorage.getItem('smartDiaryList');
        if (standardData) {
            try { combinedList = JSON.parse(standardData); } catch (e) {}
        }
        if (combinedList.length === 0) {
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                let val = localStorage.getItem(key);
                try {
                    let parsed = JSON.parse(val);
                    if (Array.isArray(parsed) && parsed.length > 0 && (parsed[0].text || parsed[0].date)) {
                        combinedList = parsed;
                        localStorage.setItem('smartDiaryList', JSON.stringify(combinedList));
                        break;
                    }
                } catch (e) {}
            }
        }
        return combinedList;
    }

    function adjustFontSize(step) {
        currentFontSize += step;
        if (currentFontSize < 11) currentFontSize = 11;
        if (currentFontSize > 24) currentFontSize = 24;
        localStorage.setItem('smartDiaryFontSize', currentFontSize);
        document.querySelectorAll('.diary-text').forEach(el => {
            el.style.fontSize = currentFontSize + 'px';
        });
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                currentPhotoBase64 = e.target.result;
                document.getElementById('image-preview').src = currentPhotoBase64;
                document.getElementById('photo-preview-wrap').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    function removeImage() {
        currentPhotoBase64 = null;
        document.getElementById('diary-photo-input').value = '';
        document.getElementById('image-preview').src = '';
        document.getElementById('photo-preview-wrap').style.display = 'none';
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onstart = () => {
            isRecording = true;
            recordBtn.innerText = '⏹️ 중지';
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }

            if (finalTranscript) {
                accumulatedText += (accumulatedText ? ' ' : '') + finalTranscript;
            }
            
            textOutput.innerText = accumulatedText + (interimTranscript ? ' ' + interimTranscript : '');
        };

        recognition.onend = () => {
            if (shouldRestart && isRecording) {
                try { recognition.start(); } catch (e) {}
            } else {
                isRecording = false;
                recordBtn.innerText = '🎤 음성메모';
                accumulatedText = textOutput.innerText;
            }
        };
    }

    if (recordBtn) {
        recordBtn.onclick = () => {
            if (!recognition) return;
            if (isRecording) {
                shouldRestart = false;
                isRecording = false;
                recognition.stop();
                recordBtn.innerText = '🎤 음성메모';
            } else {
                shouldRestart = true;
                accumulatedText = textOutput.innerText;
                try { recognition.start(); } catch (e) {}
            }
        };
    }

    function openDiaryForm(dateStr) {
        selectedReservationDate = dateStr;
        const dayOfWeek = getDayOfWeekStr(dateStr);
        formTargetDateTitle.innerText = `📅 ${dateStr} (${dayOfWeek}) 메모 작성`;
        
        // 수정사항 1 & 2: 오늘 날짜면 현재 시간, 예약일이면 기본 오전 8시(이후 사용자가 자유롭게 수정 가능)
        const todayStr = getTodayStr();
        if (dateStr === todayStr) {
            reservationTimeInput.value = getCurrentTimeStr();
        } else {
            reservationTimeInput.value = "08:00";
        }

        memoFormCard.style.display = 'block';
        memoFormCard.scrollIntoView({ behavior: 'smooth' });
    }

    function closeDiaryForm() {
        memoFormCard.style.display = 'none';
        textOutput.innerText = '';
        accumulatedText = '';
        removeImage();
    }

    function manualSaveDiary() {
        const text = textOutput.innerText.trim();
        if (!text && !currentPhotoBase64) {
            alert('내용이나 사진을 입력해주세요!');
            return;
        }

        let diaryListObj = getAllDiaries();
        let targetDateStr = selectedReservationDate || getTodayStr();
        let alarmTime = reservationTimeInput.value || "08:00";

        const newEntry = {
            id: Date.now(),
            date: targetDateStr,
            time: alarmTime,
            text: text,
            photo: currentPhotoBase64
        };

        diaryListObj.push(newEntry);
        localStorage.setItem('smartDiaryList', JSON.stringify(diaryListObj));

        closeDiaryForm();
        renderCalendar();
        loadDiaryList();
        alert('메모가 안전하게 저장되었습니다!');
    }

    function changeFilter(filterType) {
        currentFilter = filterType;

        ['all', 'month', 'alarm'].forEach(type => {
            const btn = document.getElementById(`filter-${type}`);
            if (btn) btn.classList.remove('active');
        });

        const activeBtn = document.getElementById(`filter-${filterType}`);
        if (activeBtn) activeBtn.classList.add('active');

        loadDiaryList();
    }

    function changeMonth(direction) {
        calMonth += direction;
        if (calMonth > 11) {
            calMonth = 0;
            calYear++;
        } else if (calMonth < 0) {
            calMonth = 11;
            calYear--;
        }
        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('cal-days-grid');
        const title = document.getElementById('cal-month-title');
        if (!grid || !title) return;

        grid.innerHTML = '';
        title.innerText = `${calYear}년 ${calMonth + 1}월`;

        const firstDayIndex = new Date(calYear, calMonth, 1).getDay();
        const totalDays = new Date(calYear, calMonth + 1, 0).getDate();
        const todayStr = getTodayStr();
        const holidays = getKoreanHolidays(calYear);

        let diaryListObj = getAllDiaries();
        let datesWithMemo = new Map(); // 날짜별 요일 인덱스 저장용
        diaryListObj.forEach(item => {
            if (item.date) {
                let normDate = normalizeDateStr(item.date);
                let dObj = parseDateObj(normDate);
                datesWithMemo.set(normDate, dObj.getDay());
            }
        });

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'cal-cell empty';
            grid.appendChild(emptyCell);
        }

        const dayClassMap = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

        for (let day = 1; day <= totalDays; day++) {
            const cell = document.createElement('div');
            cell.className = 'cal-cell';

            const rawDateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const normalizedDateStr = normalizeDateStr(rawDateStr);
            const dObj = new Date(calYear, calMonth, day);
            const dayOfWeek = dObj.getDay();

            // 요일 및 공휴일 구분 색상 적용
            if (dayOfWeek === 0 || holidays.has(normalizedDateStr)) {
                cell.classList.add('sunday');
            } else if (dayOfWeek === 6) {
                cell.classList.add('saturday');
            }

            if (normalizedDateStr === todayStr) {
                cell.classList.add('today-date');
            }

            const span = document.createElement('span');
            span.innerText = day;
            cell.appendChild(span);

            // 수정사항 5: 데이터가 있는 일자에 요일별 컬러 바 표시
            if (datesWithMemo.has(normalizedDateStr)) {
                let memoDayOfWeek = datesWithMemo.get(normalizedDateStr);
                const memoLine = document.createElement('div');
                memoLine.className = `memo-line ${dayClassMap[memoDayOfWeek]}`;
                cell.appendChild(memoLine);
            }

            cell.onclick = () => openDiaryForm(normalizedDateStr);
            grid.appendChild(cell);
        }
    }

    // 달력 좌우 슬라이드 기능
    const calendarCard = document.getElementById('calendar-card');
    let touchStartX = 0;
    let touchEndX = 0;

    calendarCard.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});

    calendarCard.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        if (touchEndX < touchStartX - 50) changeMonth(1);
        if (touchEndX > touchStartX + 50) changeMonth(-1);
    }, {passive: true});

    let mouseStartX = 0;
    calendarCard.addEventListener('mousedown', (e) => { mouseStartX = e.clientX; });
    calendarCard.addEventListener('mouseup', (e) => {
        let mouseEndX = e.clientX;
        if (mouseStartX - mouseEndX > 50) changeMonth(1);
        else if (mouseEndX - mouseStartX > 50) changeMonth(-1);
    });

    function loadDiaryList() {
        let diaryListObj = getAllDiaries();
        if (!diaryList) return;
        diaryList.innerHTML = '';

        diaryListObj.sort((a, b) => {
            let dateA = a.date || '';
            let dateB = b.date || '';
            if (dateA !== dateB) return dateB.localeCompare(dateA);
            return b.id - a.id;
        });

        const todayStr = getTodayStr();
        const todayObj = parseDateObj(todayStr);

        let filtered = diaryListObj.filter(item => {
            const itemDate = normalizeDateStr(item.date || todayStr);
            const itemObj = parseDateObj(itemDate);

            if (currentFilter === 'all') {
                return true;
            } else if (currentFilter === 'alarm') {
                // 수정사항 3: 예약보기 필터 오류 수정 (시간이 비어있지 않은 항목 정확히 필터링)
                return item.time && item.time.trim() !== '' && item.time.trim() !== '00:00';
            } else if (currentFilter === 'month') {
                const diffTime = todayObj - itemObj;
                const diffDays = diffTime / (1000 * 60 * 60 * 24);
                return diffDays >= 0 && diffDays <= 2;
            }
            return true;
        });

        if (filtered.length === 0) {
            diaryList.innerHTML = `<div style="text-align:center; color:#95a5a6; padding:20px; font-size:14px;">조건에 일치하는 메모가 없습니다.</div>`;
            return;
        }

        filtered.forEach(item => {
            const itemDate = normalizeDateStr(item.date || todayStr);
            const dayOfWeek = getDayOfWeekStr(itemDate);
            const isAlarm = item.time && item.time.trim() !== '';

            const itemDiv = document.createElement('div');
            itemDiv.className = 'diary-item' + (isAlarm ? ' alarm-memo' : '');

            let dateHtml = `<div class="diary-date">📅 ${itemDate} (${dayOfWeek})`;
            if (item.time) {
                dateHtml += ` ⏰ ${item.time}`;
            }
            dateHtml += `</div>`;

            let textHtml = `<div class="diary-text" style="font-size: ${currentFontSize}px;" contenteditable="true" onblur="updateDiaryText(${item.id}, this)">${escapeHtml(item.text)}</div>`;
            
            let photoHtml = '';
            if (item.photo) {
                photoHtml = `<img src="${item.photo}" class="diary-photo" alt="첨부 사진">`;
            }

            let deleteHtml = `<button class="delete-btn" onclick="deleteDiary(${item.id})">🗑️ 삭제</button>`;

            itemDiv.innerHTML = dateHtml + textHtml + photoHtml + deleteHtml;
            diaryList.appendChild(itemDiv);
        });
    }

    function updateDiaryText(id, element) {
        let diaryListObj = getAllDiaries();
        const target = diaryListObj.find(item => item.id === id);
        if (target) {
            target.text = element.innerText;
            localStorage.setItem('smartDiaryList', JSON.stringify(diaryListObj));
        }
    }

    function deleteDiary(id) {
        if (confirm('정말 이 메모를 삭제하시겠습니까?')) {
            let diaryListObj = getAllDiaries();
            diaryListObj = diaryListObj.filter(item => item.id !== id);
            localStorage.setItem('smartDiaryList', JSON.stringify(diaryListObj));
            renderCalendar();
            loadDiaryList();
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    window.onload = () => {
        initSpeechRecognition();
        renderCalendar();
        loadDiaryList();
    };
</script>
</body>
</html>
