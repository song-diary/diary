<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 다이어리 & 용돈관리</title>
    <style>
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f4f6f9; 
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
        }
        h2 { 
            margin-top: 0; 
            color: #333; 
            font-size: 22px; 
            border-bottom: 2px solid #eaeaea; 
            padding-bottom: 10px; 
        }
        .filter-box { 
            margin-bottom: 20px; 
            display: flex; 
            gap: 10px; 
        }
        select { 
            flex: 1; 
            padding: 10px; 
            font-size: 14px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            background-color: #fff; 
        }
        .stats-summary { 
            background: #fff8f8; 
            border: 1px solid #ffdede; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .stats-summary span { 
            color: #e03131; 
            font-size: 18px; 
            font-weight: bold; 
        }
        h3 { 
            font-size: 16px; 
            color: #555; 
            margin-bottom: 10px; 
        }
        ul { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
        }
        li { 
            padding: 12px 15px; 
            background: #fafafa; 
            border: 1px solid #eee; 
            border-radius: 6px; 
            margin-bottom: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .item-info .category { 
            font-size: 12px; 
            background: #e9ecef; 
            padding: 2px 6px; 
            border-radius: 4px; 
            color: #495057; 
            margin-right: 5px; 
        }
        .item-info .memo { 
            font-size: 14px; 
            color: #333; 
        }
        .item-info .date { 
            display: block; 
            font-size: 11px; 
            color: #888; 
            margin-top: 3px; 
        }
        .expense-amount { 
            color: #e03131; 
            font-weight: bold; 
            font-size: 15px; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>이번 달 지출 통계 및 내역</h2>

    <!-- 기간 및 필터 선택 영역 -->
    <div class="filter-box">
        <select id="periodFilter" onchange="filterAndRenderData()">
            <option value="thisMonth">이번 달 (7월)</option>
            <option value="all">전체 기간</option>
        </select>
        <select id="categoryFilter" onchange="filterAndRenderData()">
            <option value="all">전체 카테고리</option>
            <option value="용돈">용돈</option>
            <option value="식비">식비</option>
            <option value="교통">교통</option>
        </select>
    </div>

    <!-- 통계 요약 영역 -->
    <div class="stats-summary">
        <div>총 지출 합계</div>
        <span id="totalExpenseAmount">0원</span>
    </div>

    <!-- 지출 내역 리스트 (수입은 자동 제외됨) -->
    <h3>지출 상세 내역</h3>
    <ul id="expenseListContainer">
        <!-- 자바스크립트로 리스트가 동적 생성됩니다 -->
    </ul>
</div>

<script>
    // 전체 거래 데이터 예시 (수입과 지출이 섞여 있는 원본 데이터)
    const allTransactions = [
        { id: 1, date: '2026-07-01', type: 'income', category: '월급', memo: '7월 급여 입금', amount: 3000000 },
        { id: 2, date: '2026-07-03', type: 'expense', category: '용돈', memo: '친구 모임 식사', amount: 45000 },
        { id: 3, date: '2026-07-05', type: 'expense', category: '식비', memo: '마트 장보기', amount: 62000 },
        { id: 4, date: '2026-07-10', type: 'expense', category: '용돈', memo: '도서 구입', amount: 18000 },
        { id: 5, date: '2026-07-12', type: 'income', category: '부수입', memo: '중고거래 판매', amount: 35000 },
        { id: 6, date: '2026-07-15', type: 'expense', category: '교통', memo: '택시비', amount: 12000 }
    ];

    // 숫자에 천 단위 콤마를 찍어주는 함수
    function formatNumber(num) {
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "원";
    }

    // 조건에 맞춰 데이터를 필터링하고 화면에 그려주는 함수
    function filterAndRenderData() {
        const selectedCategory = document.getElementById('categoryFilter').value;
        const selectedPeriod = document.getElementById('periodFilter').value;
        
        const listContainer = document.getElementById('expenseListContainer');
        const totalAmountElement = document.getElementById('totalExpenseAmount');
        
        listContainer.innerHTML = '';
        let calculatedTotal = 0;

        // [핵심 로직] 수입을 제외하고 지출(expense)만 골라내는 필터링
        const filteredList = allTransactions.filter(item => {
            // 1. 수입(income) 데이터는 무조건 제외
            if (item.type !== 'expense') return false;

            // 2. 카테고리 필터 적용 ('전체'가 아닐 경우 일치하는 것만)
            if (selectedCategory !== 'all' && item.category !== selectedCategory) return false;

            // 3. 기간 필터 조건 (예시용 구현)
            if (selectedPeriod === 'thisMonth') {
                // 2026-07로 시작하는 데이터만 허용
                if (!item.date.startsWith('2026-07')) return false;
            }

            return true;
        });

        // 필터링된 지출 내역을 화면에 반영
        if (filteredList.length === 0) {
            listContainer.innerHTML = '<li style="justify-content: center; color: #888;">조건에 해당하는 지출 내역이 없습니다.</li>';
        } else {
            filteredList.forEach(item => {
                calculatedTotal += item.amount;

                const listItem = document.createElement('li');
                listItem.innerHTML = `
                    <div class="item-info">
                        <span class="category">${item.category}</span>
                        <span class="memo">${item.memo}</span>
                        <span class="date">${item.date}</span>
                    </div>
                    <span class="expense-amount">-${formatNumber(item.amount)}</span>
                `;
                listContainer.appendChild(listItem);
            });
        }

        // 총 지출 합계 금액 업데이트
        totalAmountElement.textContent = formatNumber(calculatedTotal);
    }

    // 페이지가 처음 열릴 때 기본으로 실행
    window.onload = function() {
        filterAndRenderData();
    };
</script>

</body>
</html>
