<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 다이어리 (데이터 구출 버전)</title>
    <style>
        :root {
            --bg-color: #f7f4ef;
            --card-bg: #ffffff;
            --primary-color: #8c7355;
            --primary-hover: #735d43;
            --text-main: #333333;
            --text-sub: #777777;
            --border-color: #e3ded6;
            --accent-today: #fa5252;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; max-width: 600px; margin: 0 auto; }
        .app-container { display: flex; flex-direction: column; gap: 15px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-sub); }
        .action-btn { background: var(--primary-color); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .action-btn:hover { background: var(--primary-hover); }

        /* 달력 스타일 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calendar-header button { background: none; border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 4px; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
        .cal-day-name { font-size: 12px; color: var(--text-sub); padding-bottom: 5px; }
        .cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 13px; border-radius: 6px; cursor: pointer; position: relative; background: #faf8f5; }
        .cal-cell:hover { background: #efece6; }
        .cal-cell.empty { background: transparent; cursor: default; }
        .cal-cell.sunday { color: #e03131; }
        .cal-cell.saturday { color: #1971c2; }
        .cal-cell.today-date { border: 1px solid var(--accent-today); font-weight: bold; }
        .memo-bar { width: 4px; height: 4px; background-color: var(--primary-color); border-radius: 50%; margin-top: 2px; }

        /* 새 메모 작성 폼 */
        #memo-form-card { display: none; border: 2px solid var(--primary-color); }
        .form-header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; font-weight: bold; color: var(--primary-color); }
        .close-form-btn { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--text-sub); }
        .reservation-box { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 13px; background: var(--bg-color); padding: 8px; border-radius: 8px; }
        .diary-textarea { width: 100%; min-height: 100px; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; font-size: 14px; outline: none; background: #fff; margin-bottom: 10px; }
        .btn-group { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-secondary { background-color: #e3ded6; color: var(--text-main); }

        /* 메모 리스트 */
        .diary-item { background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; position: relative; }
        .diary-date { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
        .diary-text { font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-all; }
        .delete-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 12px; color: #aaa; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-bar card">
        <span style="font-weight:bold; color:var(--primary-color);">스마트 다이어리 (복구 모드)</span>
        <button class="action-btn" onclick="openDiaryForm(getTodayStr())">➕ 새 메모 쓰기</button>
    </div>

    <!-- 달력 카드 -->
    <div class="card">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">◀ 이전</button>
            <h3 id="cal-month-title">0000년 00월</h3>
            <button onclick="changeMonth(1)">다음 ▶</button>
        </div>
        <div class="calendar-grid">
            <div class="cal-day-name sunday">일</div>
            <div class="cal-day-name">월</div>
            <div class="cal-day-name">화</div>
            <div class="cal-day-name">수</div>
            <div class="cal-day-name">목</div>
            <div class="cal-day-name">금</div>
            <div class="cal-day-name saturday">토</div>
        </div>
        <div class="calendar-grid" id="cal-days-grid" style="margin-top: 5px;"></div>
    </div>

    <!-- 새 메모 작성 폼 -->
    <div class="card" id="memo-form-card">
        <div class="form-header-info">
            <span id="form-target-date-title">📅 메모 작성</span>
            <button class="close-form-btn" onclick="closeDiaryForm()">✖</button>
        </div>
        <div class="reservation-box">
            <label>⏰ 알람 시간:</label>
            <input type="time" id="reservation-time-input" style="padding: 4px; border:1px solid var(--border-color); border-radius:4px;">
        </div>
        <div id="textOutput" class="diary-textarea" contenteditable="true" placeholder="내용을 입력하세요..."></div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="manualSaveDiary()">저장</button>
        </div>
    </div>

    <!-- 메모 리스트 -->
    <div class="card">
        <div style="font-size:13px; font-weight:bold; margin-bottom:10px; color:var(--primary-color);">📋 전체 메모 목록</div>
        <div id="diary-list"></div>
    </div>
</div>

<script>
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();
    let selectedReservationDate = null;

    const memoFormCard = document.getElementById('memo-form-card');
    const formTargetDateTitle = document.getElementById('form-target-date-title');
    const textOutput = document.getElementById('textOutput');
    const diaryList = document.getElementById('diary-list');
    const reservationTimeInput = document.getElementById('reservation-time-input');

    function getTodayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getAllDiaries() {
        let combinedList = [];
        
        // 1. 기존 표준 키 확인
        let standardData = localStorage.getItem('smartDiaryList');
        if (standardData) {
            try { combinedList = JSON.parse(standardData); } catch (e) {}
        }

        // 2. 만약 없다면 브라우저 로컬 스토리지의 모든 키를 뒤져서 배열 형태인 데이터를 찾아냄
        if (combinedList.length === 0) {
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                let val = localStorage.getItem(key);
                try {
                    let parsed = JSON.parse(val);
                    if (Array.isArray(parsed) && parsed.length > 0 && (parsed[0].text || parsed[0].date)) {
                        combinedList = parsed;
                        // 찾은 데이터를 표준 키에 강제 저장하여 앞으로 이 데이터를 쓰게 함
                        localStorage.setItem('smartDiaryList', JSON.stringify(combinedList));
                        break;
                    }
                } catch (e) {}
            }
        }
        return combinedList;
    }

    function openDiaryForm(dateStr) {
        selectedReservationDate = dateStr;
        formTargetDateTitle.innerText = `📅 ${dateStr} 메모 작성`;
        memoFormCard.style.display = 'block';
        memoFormCard.scrollIntoView({ behavior: 'smooth' });
    }

    function closeDiaryForm() {
        memoFormCard.style.display = 'none';
        textOutput.innerText = '';
        reservationTimeInput.value = '';
    }

    function manualSaveDiary() {
        const text = textOutput.innerText.trim();
        if (!text) {
            alert('내용을 입력해주세요!');
            return;
        }
        let diaryListObj = getAllDiaries();
        diaryListObj.push({
            id: Date.now(),
            date: selectedReservationDate || getTodayStr(),
            time: reservationTimeInput.value || null,
            text: text,
            photo: null
        });
        localStorage.setItem('smartDiaryList', JSON.stringify(diaryListObj));
        closeDiaryForm();
        renderCalendar();
        loadDiaryList();
        alert('저장되었습니다!');
    }

    function deleteDiary(id) {
        if (confirm('삭제하시겠습니까?')) {
            let diaryListObj = getAllDiaries();
            diaryListObj = diaryListObj.filter(item => item.id !== id);
            localStorage.setItem('smartDiaryList', JSON.stringify(diaryListObj));
            renderCalendar();
            loadDiaryList();
        }
    }

    function renderCalendar() {
        const grid = document.getElementById('cal-days-grid');
        const title = document.getElementById('cal-month-title');
        grid.innerHTML = '';
        title.innerText = `${calYear}년 ${calMonth + 1}월`;

        const firstDayIndex = new Date(calYear, calMonth, 1).getDay();
        const totalDays = new Date(calYear, calMonth + 1, 0).getDate();
        const todayStr = getTodayStr();

        let diaryListObj = getAllDiaries();
        let datesWithMemo = new Set();
        diaryListObj.forEach(item => {
            if (item.date) datesWithMemo.add(item.date.replace(/[./]/g, '-'));
        });

        for (let i = 0; i < firstDayIndex; i++) {
            let emptyCell = document.createElement('div');
            emptyCell.className = 'cal-cell empty';
            grid.appendChild(emptyCell);
        }

        for (let day = 1; day <= totalDays; day++) {
            let cell = document.createElement('div');
            cell.className = 'cal-cell';
            let dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

            if (dateStr === todayStr) cell.classList.add('today-date');

            let span = document.createElement('span');
            span.innerText = day;
            cell.appendChild(span);

            if (datesWithMemo.has(dateStr)) {
                let memoBar = document.createElement('div');
                memoBar.className = 'memo-bar';
                cell.appendChild(memoBar);
            }

            cell.onclick = () => openDiaryForm(dateStr);
            grid.appendChild(cell);
        }
    }

    function loadDiaryList() {
        let diaryListObj = getAllDiaries();
        diaryList.innerHTML = '';

        if (diaryListObj.length === 0) {
            diaryList.innerHTML = `<div style="text-align:center; color:#a09184; padding:20px; font-size:14px;">저장된 메모가 없습니다. 새 메모를 작성해 보세요!</div>`;
            return;
        }

        diaryListObj.sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id - a.id);

        diaryListObj.forEach(item => {
            let itemDiv = document.createElement('div');
            itemDiv.className = 'diary-item';
            itemDiv.innerHTML = `
                <div class="diary-date">📅 ${item.date || '날짜 없음'} ${item.time ? '⏰ ' + item.time : ''}</div>
                <div class="diary-text">${item.text || ''}</div>
                <button class="delete-btn" onclick="deleteDiary(${item.id})">🗑️ 삭제</button>
            `;
            diaryList.appendChild(itemDiv);
        });
    }

    function changeMonth(dir) {
        calMonth += dir;
        if (calMonth > 11) { calMonth = 0; calYear++; }
        else if (calMonth < 0) { calMonth = 11; calYear--; }
        renderCalendar();
    }

    window.onload = () => {
        renderCalendar();
        loadDiaryList();
    };
</script>
</body>
</html>
