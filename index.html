<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 다이어리 & 용돈관리</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --expense-color: #e74c3c;
            --income-color: #2ecc71;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 24px;
            color: var(--primary-color);
        }

        .section {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .section h2 {
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 14px;
            color: var(--text-main);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        /* 폼 스타일 */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fafafa;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: #fff;
        }

        .row-group {
            display: flex;
            gap: 12px;
        }

        .row-group .form-group {
            flex: 1;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* 달력 스타일 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-header button {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .calendar-header button:hover {
            background: #f1f5f9;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .calendar-day-name {
            font-weight: bold;
            font-size: 12px;
            color: var(--text-sub);
            padding: 6px 0;
        }

        .calendar-cell {
            min-height: 70px;
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px;
            cursor: pointer;
            font-size: 12px;
            text-align: left;
            position: relative;
            transition: all 0.2s;
        }

        .calendar-cell:hover {
            background: #f1f5f9;
            border-color: var(--primary-color);
        }

        .calendar-cell.selected {
            border-color: var(--primary-color);
            background: #eff6ff;
            box-shadow: 0 0 0 1px var(--primary-color);
        }

        .cell-date {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .cell-expense {
            color: var(--expense-color);
            font-size: 11px;
            font-weight: 600;
            background: #fde8e8;
            padding: 2px 4px;
            border-radius: 4px;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 검색 및 지출 내역 리스트 영역 */
        .filter-box {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .filter-box select, .filter-box input {
            padding: 9px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
        }

        .filter-box input {
            flex: 1;
        }

        #search-result-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .sub-memo-item {
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            position: relative;
        }

        .sub-memo-item.is-expense {
            border-left: 5px solid var(--expense-color);
        }

        .memo-action-btns {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 4px;
        }

        .memo-action-btns button {
            background: #fff;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .edit-btn { color: var(--primary-color); }
        .delete-btn { color: var(--expense-color); }

        .diary-text {
            margin-top: 8px;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 14px;
            line-height: 1.5;
        }

        .diary-photo {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>스마트 다이어리 & 용돈관리</h1>

    <!-- 1. 달력 섹션 -->
    <div class="section">
        <div class="calendar-header">
            <button onclick="moveMonth(-1)">&lt; 이전 달</button>
            <h2 id="cal-title" style="margin:0; border:none; padding:0;">2026년 7월</h2>
            <button onclick="moveMonth(1)">다음 달 &gt;</button>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
    </div>

    <!-- 2. 입력 및 수정 섹션 -->
    <div class="section">
        <h2 id="form-section-title">일기 및 지출 입력</h2>
        <div class="row-group">
            <div class="form-group">
                <label>날짜 선택</label>
                <input type="date" id="input-date">
            </div>
            <div class="form-group">
                <label>내역 구분</label>
                <select id="input-money-type">
                    <option value="expense">지출</option>
                </select>
            </div>
        </div>
        <div class="row-group">
            <div class="form-group">
                <label>카테고리</label>
                <input type="text" id="input-category" placeholder="예: 식비, 교통비, 쇼핑 등">
            </div>
            <div class="form-group">
                <label>금액 (원)</label>
                <input type="text" id="input-amount" placeholder="금액 입력" oninput="formatAmountInput(this)">
            </div>
        </div>
        <div class="form-group">
            <label>내용 및 메모</label>
            <textarea id="input-text" rows="3" placeholder="오늘의 기록이나 특이사항을 남겨보세요."></textarea>
        </div>
        <div class="form-group">
            <label>사진 첨부</label>
            <input type="file" id="input-photo" accept="image/*" onchange="handleImageUpload(event)">
            <input type="hidden" id="input-photo-data">
        </div>
        <button class="btn-primary" id="save-btn" onclick="saveDiaryData()">저장하기</button>
    </div>

    <!-- 3. 검색 및 지출 내역 리스트 섹션 (수입 제외, 지출 전용 필터링 완벽 적용) -->
    <div class="section">
        <h2>지출 내역 검색 및 조회</h2>
        <div class="filter-box">
            <select id="period-filter" onchange="changePeriodFilter()">
                <option value="month">이번 달</option>
                <option value="week">최근 7일</option>
                <option value="all">전체보기</option>
            </select>
            <input type="text" id="search-keyword" placeholder="검색어, 카테고리 또는 금액 입력..." oninput="filterCustomList()">
        </div>
        <div id="search-result-list"></div>
    </div>
</div>

<script>
    // 전역 상태 변수
    let currentDate = new Date();
    let currentPeriodFilter = 'month';
    let editingId = null;
    let uploadedImageBase64 = '';

    // 초기 실행
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('input-date').value = getTodayStr();
        renderCalendar();
        filterCustomList();
    });

    function getTodayStr() {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function parseDateObj(dateStr) {
        if (!dateStr) return new Date();
        const parts = dateStr.split('-');
        if (parts.length === 3) {
            return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        }
        return new Date(dateStr);
    }

    // 금액 천 단위 콤마 자동 포맷팅
    function formatAmountInput(el) {
        let val = el.value.replace(/[^0-9]/g, '');
        if (val) {
            el.value = Number(val).toLocaleString();
        } else {
            el.value = '';
        }
    }

    // 이미지 업로드 처리
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            uploadedImageBase64 = e.target.result;
            document.getElementById('input-photo-data').value = uploadedImageBase64;
        };
        reader.readAsDataURL(file);
    }

    // 로컬 스토리지 데이터 관리
    function getAllDiaries() {
        try {
            const data = localStorage.getItem('smart_diaries_v2');
            return data ? JSON.parse(data) : [];
        } catch (e) {
            return [];
        }
    }

    function saveAllDiaries(diaries) {
        localStorage.setItem('smart_diaries_v2', JSON.stringify(diaries));
    }

    // 달력 렌더링
    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const title = document.getElementById('cal-title');
        grid.innerHTML = '';

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        title.innerText = `${year}년 ${month + 1}월`;

        const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
        dayNames.forEach(name => {
            const div = document.createElement('div');
            div.className = 'calendar-day-name';
            div.innerText = name;
            grid.appendChild(div);
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const lastDay = new Date(year, month + 1, 0).getDate();
        let diaries = getAllDiaries();

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            grid.appendChild(emptyCell);
        }

        for (let day = 1; day <= lastDay; day++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell';
            const monthStr = String(month + 1).padStart(2, '0');
            const dayStr = String(day).padStart(2, '0');
            const dateStr = `${year}-${monthStr}-${dayStr}`;

            if (dateStr === getTodayStr()) {
                cell.style.borderColor = '#cbd5e1';
            }

            let cellHTML = `<div class="cell-date">${day}</div>`;

            // 해당 날짜의 지출 항목만 달력에 표시
            const dayItems = diaries.filter(item => item.date === dateStr && item.money && item.money.type === 'expense');
            dayItems.forEach(item => {
                let amtFormatted = Number(item.money.amount).toLocaleString();
                cellHTML += `<div class="cell-expense">-${amtFormatted}</div>`;
            });

            cell.innerHTML = cellHTML;
            cell.onclick = () => {
                document.getElementById('input-date').value = dateStr;
                highlightSelectedCell(cell);
            };

            grid.appendChild(cell);
        }
    }

    function moveMonth(dir) {
        currentDate.setMonth(currentDate.getMonth() + dir);
        renderCalendar();
    }

    function highlightSelectedCell(selectedCell) {
        document.querySelectorAll('.calendar-cell').forEach(c => c.classList.remove('selected'));
        selectedCell.classList.add('selected');
    }

    // 데이터 저장 및 수정 처리
    function saveDiaryData() {
        const date = document.getElementById('input-date').value;
        const type = document.getElementById('input-money-type').value;
        const category = document.getElementById('input-category').value.trim();
        const rawAmount = document.getElementById('input-amount').value.replace(/,/g, '');
        const text = document.getElementById('input-text').value;
        const photo = document.getElementById('input-photo-data').value || null;

        if (!date) {
            alert('날짜를 선택해주세요.');
            return;
        }

        let diaries = getAllDiaries();
        let moneyData = null;
        if (category || rawAmount) {
            moneyData = {
                type: type, // 지출(expense)
                category: category || '기타',
                amount: Number(rawAmount) || 0
            };
        }

        if (editingId) {
            diaries = diaries.map(item => {
                if (item.id === editingId) {
                    return { 
                        ...item, 
                        date, 
                        text, 
                        money: moneyData, 
                        photo: photo !== null && photo !== "" ? photo : item.photo 
                    };
                }
                return item;
            });
            editingId = null;
            document.getElementById('save-btn').innerText = '저장하기';
            document.getElementById('form-section-title').innerText = '일기 및 지출 입력';
        } else {
            const newItem = {
                id: 'd_' + Date.now(),
                date,
                text,
                money: moneyData,
                photo
            };
            diaries.push(newItem);
        }

        saveAllDiaries(diaries);
        resetForm();
        renderCalendar();
        filterCustomList();
    }

    function resetForm() {
        document.getElementById('input-date').value = getTodayStr();
        document.getElementById('input-category').value = '';
        document.getElementById('input-amount').value = '';
        document.getElementById('input-text').value = '';
        document.getElementById('input-photo').value = '';
        document.getElementById('input-photo-data').value = '';
        uploadedImageBase64 = '';
        editingId = null;
        document.getElementById('save-btn').innerText = '저장하기';
        document.getElementById('form-section-title').innerText = '일기 및 지출 입력';
    }

    function openDiaryForm(dateStr, item) {
        document.getElementById('input-date').value = dateStr;
        document.getElementById('input-category').value = item.money ? item.money.category : '';
        document.getElementById('input-amount').value = item.money ? Number(item.money.amount).toLocaleString() : '';
        document.getElementById('input-text').value = item.text || '';
        if (item.photo) {
            document.getElementById('input-photo-data').value = item.photo;
        }
        editingId = item.id;
        document.getElementById('save-btn').innerText = '수정 완료';
        document.getElementById('form-section-title').innerText = '일기 및 지출 수정';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteDiary(id) {
        if (!confirm('정말 삭제하시겠습니까?')) return;
        let diaries = getAllDiaries();
        diaries = diaries.filter(item => item.id !== id);
        saveAllDiaries(diaries);
        renderCalendar();
        filterCustomList();
    }

    function changePeriodFilter() {
        currentPeriodFilter = document.getElementById('period-filter').value;
        filterCustomList();
    }

    // -----------------------------------------------------------------
    // [핵심 필터링] 수입 데이터는 완전히 제외하고 지출(비용) 내역만 리스트업
    // -----------------------------------------------------------------
    function filterCustomList() {
        const resultListContainer = document.getElementById('search-result-list');
        if (!resultListContainer) return;
        resultListContainer.innerHTML = '';

        let diaries = getAllDiaries();
        let keywordInput = document.getElementById('search-keyword');
        let keyword = keywordInput ? keywordInput.value.trim().toLowerCase() : '';
        
        const todayStr = getTodayStr();
        const tObj = parseDateObj(todayStr);
        const calYear = tObj.getFullYear();
        const calMonth = tObj.getMonth();

        let filtered = diaries.filter(item => {
            // 1. 수입 데이터이거나 가계부 지출 데이터가 아예 없는 경우는 검색/조회 리스트에서 원천 배제
            if (!item.money || item.money.type !== 'expense') return false;

            let itemDateStr = item.date;
            
            // 2. 기간 필터 적용 (이번 달 / 최근 7일 / 전체보기)
            if (currentPeriodFilter === 'week') {
                let itemDate = parseDateObj(itemDateStr);
                let diffTime = tObj - itemDate;
                let diffDays = diffTime / (1000 * 60 * 60 * 24);
                if (diffDays < 0 || diffDays > 7) return false;
            } else if (currentPeriodFilter === 'month') {
                let prefix = `${calYear}-${String(calMonth + 1).padStart(2, '0')}`;
                if (!itemDateStr.startsWith(prefix)) return false;
            }

            // 3. 키워드 검색 적용 (메모 내용, 카테고리, 금액)
            if (keyword !== '') {
                let textMatch = item.text && item.text.toLowerCase().includes(keyword);
                let catMatch = item.money && item.money.category && item.money.category.toLowerCase().includes(keyword);
                let amtMatch = item.money && String(item.money.amount).includes(keyword);
                if (!textMatch && !catMatch && !amtMatch) return false;
            }

            return true;
        });

        if (filtered.length === 0) {
            resultListContainer.innerHTML = '<div style="text-align:center; color:var(--text-sub); font-size:13px; padding:24px;">조건에 일치하는 지출 내역이 없습니다.</div>';
            return;
        }

        // 최신순 정렬
        filtered.sort((a, b) => b.date.localeCompare(a.date));

        // 화면 렌더링
        filtered.forEach(item => {
            const subItem = document.createElement('div');
            subItem.className = 'sub-memo-item is-expense';

            let amountStr = Number(item.money.amount).toLocaleString() + '원';
            let moneyHTML = `<div style="font-weight: bold; margin-bottom: 6px; color: var(--expense-color);">
                💰 [${item.date}] [지출] ${item.money.category} : -${amountStr}
            </div>`;

            let textContentHTML = item.text ? `<div class="diary-text">${item.text}</div>` : '';
            let photoHTML = item.photo ? `<img src="${item.photo}" class="diary-photo" alt="첨부사진">` : '';

            const itemJsonStr = JSON.stringify(item).replace(/"/g, '&quot;');

            subItem.innerHTML = `
                <div class="memo-action-btns">
                    <button class="edit-btn" onclick='openDiaryForm("${item.date}", ${itemJsonStr})'>수정</button>
                    <button class="delete-btn" onclick="deleteDiary('${item.id}')">삭제</button>
                </div>
                ${moneyHTML}
                ${textContentHTML}
                ${photoHTML}
            `;
            resultListContainer.appendChild(subItem);
        });
    }
</script>

</body>
</html>
