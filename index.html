<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>다이어리&가계부</title>
    <style>
        :root {
            --bg-color: #f7f4f4;
            --card-bg: #ffffff;
            --primary-color: #e06d6d;
            --primary-hover: #cc5c5c;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border-color: #e6d8d8;
            --accent-today: #e74c3c;
            --sun-color: #d93838;
            --sat-color: #1b6ca8;
            --weekday-color: #34495e;
            --income-color: #27ae60;
            --expense-color: #c0392b;
            --memo-color: #8e44ad;
            --base-font-size: 16px;
            --memo-font-size: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        html {
            overscroll-behavior-y: contain;
            touch-action: pan-y pinch-zoom;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            touch-action: pan-y pinch-zoom;
            font-size: var(--base-font-size);
            overscroll-behavior-y: contain;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.04);
        }

        /* 메인 탭 바 */
        .main-tab-bar {
            display: flex;
            gap: 6px;
            padding: 6px 8px;
        }

        .main-tab-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 4px;
            font-size: calc(var(--base-font-size) - 3px);
            font-weight: bold;
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: all 0.15s ease;
        }

        .main-tab-btn .tab-icon {
            font-size: calc(var(--base-font-size) - 1px);
            line-height: 1;
        }

        .main-tab-btn.settings-tab-btn {
            flex: 0 0 40px;
        }

        .main-tab-btn.input-tab-btn {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }

        .main-tab-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .action-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: calc(var(--base-font-size) - 1px);
            font-weight: bold;
        }

        .action-btn:hover {
            background: var(--primary-hover);
        }

        /* 설정 및 팝업 카드 스타일 */
        #settings-card, #card-statement-card, #card-pending-card, #balance-location-card, #memo-form-card {
            background: #fff;
            border: 2px solid var(--primary-color);
            animation: fadeIn 0.3s ease;
            width: min(500px, 92vw);
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            overscroll-behavior: contain;
            touch-action: pan-y pinch-zoom;
        }

        .settings-title {
            font-size: calc(var(--base-font-size) + 1px);
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: -1px;
            background: #fff;
            z-index: 5;
            padding-top: 4px;
        }

        .settings-section {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
        }

        .settings-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .settings-section label {
            display: block;
            font-size: calc(var(--base-font-size) - 2px);
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--weekday-color);
        }

        .view-select-group {
            display: flex;
            gap: 6px;
        }

        .view-select-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 6px;
            font-size: calc(var(--base-font-size) - 2px);
            cursor: pointer;
            color: var(--text-sub);
            font-weight: bold;
        }

        .view-select-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 가계부 요약 및 통계 스타일 */
        #money-summary-card {
            background: linear-gradient(135deg, #f0fff4, #e6f9ed);
            border: 1px solid #c2e8ce;
            border-radius: 12px;
            padding: 15px;
        }

        .money-summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
            color: #27ae60;
            font-size: var(--base-font-size);
        }

        .money-summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .money-box {
            background: #ffffff;
            border: 2px solid #d2eedc;
            border-radius: 8px;
            padding: 8px 4px;
            cursor: pointer;
            position: relative;
        }

        .money-box .m-label {
            font-size: calc(var(--base-font-size) - 4px);
            color: var(--text-sub);
            margin-bottom: 3px;
        }

        .money-box .m-value {
            font-size: calc(var(--base-font-size) - 2px);
            font-weight: bold;
        }

        .money-box.income .m-value { color: var(--income-color); }
        .money-box.expense .m-value { color: var(--expense-color); }
        .money-box.balance .m-value { color: #2980b9; }

        .sub-feature-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
        }

        .feature-title {
            font-size: var(--base-font-size);
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 달력 스타일 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-header h3 {
            color: var(--primary-color);
            font-size: calc(var(--base-font-size) + 4px);
        }

        .calendar-header button {
            background: #faf5f5;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .cal-day-name {
            font-size: calc(var(--base-font-size) - 1px);
            font-weight: bold;
            padding-bottom: 6px;
        }
        .cal-day-name.sunday { color: var(--sun-color); }
        .cal-day-name.saturday { color: var(--sat-color); }

        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: var(--base-font-size);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            background: #ffffff;
            border: 1px solid #e8dfdf;
            color: var(--weekday-color);
        }

        .cal-cell.today-date {
            border: 2px solid var(--accent-today) !important;
            background: #fff5f5 !important;
        }

        .cal-cell.selected-date {
            border: 2px solid #2980b9 !important;
            background: #eaf3fb !important;
        }

        /* 운세 및 사주 티저 */
        .fortune-teaser {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 16px;
            border-radius: 14px;
            margin-bottom: 12px;
            background: linear-gradient(120deg, #2C2F5B, #4A3B77 55%, #2C2F5B);
            color: #F4F0FF;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(44,47,91,0.28);
        }
        .fortune-teaser .ft-text { flex: 1; font-size: 16px; font-weight: 600; }
        .fortune-teaser .ft-sub { font-size: 13px; color: rgba(244,240,255,0.6); }

        /* 모달 오버레이 공통 (확대 허용) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            touch-action: pan-y pinch-zoom;
        }

        .modal-overlay.active {
            display: flex;
            touch-action: pan-y pinch-zoom;
        }

        .fortune-popup-card {
            width: 100%; max-width: 420px; max-height: 92vh; overflow-y: auto;
            border-radius: 22px; padding: 22px 20px 20px;
            background: linear-gradient(165deg, #23264A 0%, #171933 60%, #14152B 100%);
            color: #F2EFFF;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
            position: relative;
            touch-action: pan-y pinch-zoom;
        }

        .fortune-popup-close, .close-form-btn {
            position: absolute; top: 14px; right: 14px; 
            background: rgba(255,255,255,0.15);
            border: none; color: #fff; width: 32px; height: 32px; 
            border-radius: 50%; font-size: 16px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* 종료 및 링크 버튼 명시성 강화 */
        .explicit-close-btn {
            display: block;
            width: 100%;
            margin-top: 14px;
            padding: 10px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }

        .diary-textarea {
            width: 100%; min-height: 150px; border: 1px solid var(--border-color);
            border-radius: 8px; padding: 12px; outline: none; background: #fff;
            font-size: var(--memo-font-size); margin-bottom: 10px;
        }

        .btn-group { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-secondary { background-color: #f0e2e2; color: var(--text-main); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- 🔮 오늘의 운세 및 사주 풀이 링크 영역 (요청 반영) -->
    <div style="display: flex; gap: 8px;">
        <div class="fortune-teaser" id="fortune-teaser" onclick="openFortunePopup()" style="flex: 2; margin-bottom: 0;">
            <span class="ft-icon">🔮</span>
            <div style="flex:1;">
                <div class="ft-text" id="fortune-teaser-text">오늘의 운세 보기</div>
                <div class="ft-sub" id="fortune-teaser-sub"></div>
            </div>
            <span>›</span>
        </div>
        <div class="fortune-teaser" onclick="openSajuDetailModal()" style="flex: 1; margin-bottom: 0; background: linear-gradient(120deg, #4A3B77, #2C2F5B); justify-content: center; text-align: center;">
            <div class="ft-text" style="font-size: 14px;">📜 나의 사주 풀이</div>
        </div>
    </div>

    <!-- 🔑 달력 카드 -->
    <div class="card" id="calendar-card">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">◀ 이전</button>
            <h3 id="cal-month-title">0000년 00월</h3>
            <button onclick="changeMonth(1)">다음 ▶</button>
        </div>
        <div class="calendar-grid" id="cal-days-name-grid">
            <div class="cal-day-name sunday">일</div>
            <div class="cal-day-name weekday">월</div>
            <div class="cal-day-name weekday">화</div>
            <div class="cal-day-name weekday">수</div>
            <div class="cal-day-name weekday">목</div>
            <div class="cal-day-name weekday">금</div>
            <div class="cal-day-name saturday">토</div>
        </div>
        <div class="calendar-grid" id="cal-days-grid" style="margin-top: 5px;"></div>
    </div>

    <!-- 🧭 메인 탭 바 -->
    <div class="card main-tab-bar">
        <button class="main-tab-btn settings-tab-btn" onclick="openSettingsModal()" title="설정">
            <span class="tab-icon">☰</span>
        </button>
        <button class="main-tab-btn active" id="tab-diary-btn" onclick="switchMainTab('diary')">
            <span class="tab-icon">📔</span>다이어리
        </button>
        <button class="main-tab-btn" id="tab-money-btn" onclick="switchMainTab('money')">
            <span class="tab-icon">💰</span>가계부
        </button>
        <button class="main-tab-btn input-tab-btn" onclick="openDiaryForm(selectedViewDate || getTodayStr())">
            <span class="tab-icon">✏️</span>입력
        </button>
    </div>

    <!-- 📔 다이어리 패널 -->
    <div class="tab-panel active" id="diary-panel">
        <div class="card sub-feature-card">
            <div class="feature-title">
                <span id="selected-date-title">📔 다이어리 내역</span>
            </div>
            <div id="diary-around-today-list">등록된 내용이 없습니다.</div>
        </div>
    </div>

    <!-- 💰 가계부 패널 -->
    <div class="tab-panel" id="money-panel">
        <div class="card" id="money-summary-card">
            <div class="money-summary-header">
                <span>💵 가계부 현황</span>
            </div>
            <div class="money-summary-grid">
                <div class="money-box income">
                    <div class="m-label">총 수입</div>
                    <div class="m-value" id="summary-income">0원</div>
                </div>
                <div class="money-box expense">
                    <div class="m-label">총 지출</div>
                    <div class="m-value" id="summary-expense">0원</div>
                </div>
                <div class="money-box balance">
                    <div class="m-label">잔액</div>
                    <div class="m-value" id="summary-balance">0원</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ⚙️ 설정 모달 -->
    <div class="modal-overlay" id="settings-modal-overlay" onclick="closeSettingsModal()">
        <div class="card" id="settings-card" onclick="event.stopPropagation()">
            <div class="settings-title">
                <span>🛠️ 환경 설정</span>
                <button class="close-form-btn" onclick="closeSettingsModal()">✖</button>
            </div>
            <div class="settings-section">
                <label>📅 생일 입력 (양력 기준)</label>
                <input type="date" id="saju-birth-date" style="width:100%; padding:8px; border:1px solid var(--border-color); border-radius:6px;">
            </div>
            <div class="settings-section">
                <button class="action-btn" style="width:100%;" onclick="saveSajuBirthInfo()">설정 저장</button>
            </div>
            <div class="explicit-close-btn" onclick="closeSettingsModal()">설정 닫기 (종료)</div>
        </div>
    </div>

    <!-- 🔮 오늘의 운세 모달 -->
    <div class="modal-overlay" id="fortune-popup-overlay" onclick="closeFortunePopup()">
        <div class="fortune-popup-card" onclick="event.stopPropagation()">
            <button class="fortune-popup-close" onclick="closeFortunePopup()">✖</button>
            <h2 style="margin-bottom: 12px; font-size: 18px;">🔮 오늘의 운세</h2>
            <div id="fortune-popup-body" style="font-size: 14px; line-height: 1.6;">생년월일을 설정하면 오늘의 운세가 나타납니다.</div>
            <div class="explicit-close-btn" onclick="closeFortunePopup()">확인 및 종료</div>
        </div>
    </div>

    <!-- 📜 사주 풀이 모달 -->
    <div class="modal-overlay" id="saju-detail-modal-overlay" onclick="closeSajuDetailModal()">
        <div class="fortune-popup-card" onclick="event.stopPropagation()">
            <button class="fortune-popup-close" onclick="closeSajuDetailModal()">✖</button>
            <h2 style="margin-bottom: 12px; font-size: 18px;">📜 나의 사주 풀이</h2>
            <div id="saju-detail-body" style="font-size: 14px; line-height: 1.6;">설정된 생년월일 기반 사주 정보가 표시됩니다.</div>
            <div class="explicit-close-btn" onclick="closeSajuDetailModal()">닫기 (종료)</div>
        </div>
    </div>

    <!-- ✏️ 입력 폼 모달 -->
    <div class="modal-overlay" id="memo-modal-overlay" onclick="closeDiaryFormPanel()">
        <div id="memo-form-card" onclick="event.stopPropagation()">
            <div class="settings-title">
                <span id="form-target-date-title">📅 입력 폼</span>
                <button class="close-form-btn" onclick="closeDiaryFormPanel()">✖</button>
            </div>
            <div class="diary-textarea" contenteditable="true" placeholder="내용을 입력하세요"></div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeDiaryFormPanel()">취소</button>
                <button class="btn btn-primary" onclick="closeDiaryFormPanel()">저장</button>
            </div>
            <div class="explicit-close-btn" onclick="closeDiaryFormPanel()">작업 종료</div>
        </div>
    </div>

</div>

<script>
    // 기본 유틸리티 및 인터랙션 함수
    function getTodayStr() {
        const d = new Date();
        return d.toISOString().split('T')[0];
    }

    let selectedViewDate = getTodayStr();

    function switchMainTab(tabName) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
        if(tabName === 'diary') {
            document.getElementById('diary-panel').classList.add('active');
            document.getElementById('tab-diary-btn').classList.add('active');
        } else if(tabName === 'money') {
            document.getElementById('money-panel').classList.add('active');
            document.getElementById('tab-money-btn').classList.add('active');
        }
    }

    function openSettingsModal() { document.getElementById('settings-modal-overlay').classList.add('active'); }
    function closeSettingsModal() { document.getElementById('settings-modal-overlay').classList.remove('active'); }

    function openFortunePopup() { document.getElementById('fortune-popup-overlay').classList.add('active'); }
    function closeFortunePopup() { document.getElementById('fortune-popup-overlay').classList.remove('active'); }

    function openSajuDetailModal() { document.getElementById('saju-detail-modal-overlay').classList.add('active'); }
    function closeSajuDetailModal() { document.getElementById('saju-detail-modal-overlay').classList.remove('active'); }

    function openDiaryForm(dateStr) { document.getElementById('memo-modal-overlay').classList.add('active'); }
    function closeDiaryFormPanel() { document.getElementById('memo-modal-overlay').classList.remove('active'); }

    function saveSajuBirthInfo() {
        alert('생일(양력) 정보가 저장되었습니다.');
        closeSettingsModal();
    }

    // 간단 달력 렌더링 예시
    function renderCalendar() {
        const grid = document.getElementById('cal-days-grid');
        grid.innerHTML = '';
        for(let i=1; i<=30; i++) {
            const cell = document.createElement('div');
            cell.className = 'cal-cell';
            cell.innerText = i;
            cell.onclick = () => openDiaryForm();
            grid.appendChild(cell);
        }
        document.getElementById('cal-month-title').innerText = "2026년 8월";
    }

    renderCalendar();
</script>
</body>
</html>
