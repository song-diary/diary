<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 다이어리</title>
    <style>
        :root {
            --bg-color: #f7f4f4;
            --card-bg: #ffffff;
            --primary-color: #e06d6d;
            --primary-hover: #cc5c5c;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border-color: #e6d8d8;
            --accent-today: #e74c3c;
            --sun-color: #d93838;
            --sat-color: #1b6ca8;
            --weekday-color: #34495e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            touch-action: manipulation;
            font-size: 16px;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.04);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            color: var(--primary-color);
            font-weight: bold;
        }

        .action-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .action-btn:hover {
            background: var(--primary-hover);
        }

        /* 설정 카드 */
        #settings-card {
            display: none;
            background: #fff8f8;
            border: 2px solid var(--primary-color);
            animation: fadeIn 0.3s ease;
        }

        .settings-title {
            font-size: 17px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-section {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
        }

        .settings-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .settings-section label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--weekday-color);
        }

        .view-select-group {
            display: flex;
            gap: 6px;
        }

        .view-select-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-sub);
            font-weight: bold;
        }

        .view-select-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 날씨 카드 스타일 */
        #weather-card {
            background: linear-gradient(135deg, #f0f7ff, #e6f0fa);
            border: 1px solid #bce0fd;
            border-radius: 12px;
            padding: 15px;
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
            color: #2980b9;
            font-size: 16px;
        }

        .weather-today-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #d0e7ff;
        }

        .weather-icon {
            font-size: 32px;
        }

        .weather-info-main {
            flex: 1;
        }

        .weather-temp {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }

        .weather-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .weekly-weather-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .weekly-cell {
            background: #ffffff;
            border: 1px solid #d0e7ff;
            border-radius: 6px;
            padding: 6px 2px;
            font-size: 12px;
        }

        .weekly-cell .w-day {
            font-weight: bold;
            color: #34495e;
            margin-bottom: 3px;
        }

        .weekly-cell .w-icon {
            font-size: 16px;
            margin-bottom: 2px;
        }

        .weekly-cell .w-temp {
            font-size: 11px;
            color: var(--text-sub);
        }

        /* 달력 스타일 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-header h3 {
            color: var(--primary-color);
            font-size: 20px;
        }

        .calendar-header button {
            background: #faf5f5;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-main);
            font-weight: bold;
            font-size: 15px;
            touch-action: manipulation;
        }

        .calendar-header button:hover {
            background: #f4e8e8;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .cal-day-name {
            font-size: 15px;
            font-weight: bold;
            padding-bottom: 6px;
        }

        .cal-day-name.sunday { color: var(--sun-color); }
        .cal-day-name.saturday { color: var(--sat-color); }
        .cal-day-name.weekday { color: var(--weekday-color); }

        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            background: #ffffff;
            border: 1px solid #e8dfdf;
            color: var(--weekday-color);
            touch-action: manipulation;
        }

        .cal-cell:hover {
            opacity: 0.85;
            border-color: var(--primary-color);
        }

        .cal-cell.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .cal-cell.sunday {
            background: #fdf2f2;
            border-color: #f7d6d6;
        }

        .cal-cell.saturday {
            background: #f0f6fb;
            border-color: #d1e3f3;
        }

        .cal-cell.today-date {
            border: 2px solid var(--accent-today) !important;
            font-weight: bold;
            background: #fff5f5 !important;
        }

        .memo-line {
            width: 65%;
            height: 4px;
            border-radius: 2px;
            margin-top: 4px;
        }
        .memo-line.sun { background-color: var(--sun-color); }
        .memo-line.mon { background-color: #e67e22; }
        .memo-line.tue { background-color: #f1c40f; }
        .memo-line.wed { background-color: #27ae60; }
        .memo-line.thu { background-color: #3498db; }
        .memo-line.fri { background-color: #9b59b6; }
        .memo-line.sat { background-color: var(--sat-color); }

        /* 메모 작성 폼 */
        #memo-form-card {
            display: none;
            border: 2px solid var(--primary-color);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 17px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .close-form-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-sub);
        }

        .reservation-box {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
            font-size: 15px;
            background: #fff0f0;
            padding: 10px;
            border-radius: 8px;
        }

        .reservation-box input {
            font-size: 15px;
        }

        .diary-textarea {
            width: 100%;
            min-height: 120px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            resize: vertical;
            outline: none;
            background: #fff;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .diary-textarea:focus {
            border-color: var(--primary-color);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            touch-action: manipulation;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #f0e2e2;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #e5d2d2;
        }

        /* 일자별 그룹 박스 스타일 */
        .date-group-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .date-group-header {
            font-size: 16px;
            font-weight: bold;
            padding-bottom: 8px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--bg-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .date-group-header.sunday { color: var(--sun-color); }
        .date-group-header.saturday { color: var(--sat-color); }
        .date-group-header.weekday { color: var(--weekday-color); }

        .sub-memo-item {
            background: #fcfcfc;
            border: 1px solid #f0e6e6;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            position: relative;
            padding-right: 95px;
        }

        .sub-memo-item:last-child {
            margin-bottom: 0;
        }

        .sub-memo-item.alarm-memo {
            border-left: 4px solid var(--primary-color);
        }

        .diary-text {
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .diary-photo {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 8px;
            display: block;
        }

        .memo-action-btns {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
        }

        .edit-btn, .delete-btn {
            background: none;
            border: none;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            touch-action: manipulation;
        }

        .edit-btn {
            color: #3498db;
        }
        .edit-btn:hover {
            background: #ebf5fb;
        }

        .delete-btn {
            color: #e74c3c;
        }
        .delete-btn:hover {
            background: #fdf2f2;
        }

        #photo-preview-wrap {
            display: none;
            position: relative;
            margin-bottom: 10px;
        }

        #image-preview {
            max-height: 100px;
            border-radius: 6px;
        }

        /* 구분선 토글 버튼 스타일 */
        .section-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 2px;
            cursor: pointer;
        }

        .section-divider::before,
        .section-divider::after {
            content: "";
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
            opacity: 0.55;
        }

        .section-divider .divider-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
            color: var(--primary-color);
            background: var(--bg-color);
            padding: 4px 12px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            white-space: nowrap;
        }

        .section-divider:hover .divider-label {
            background: #f0e2e2;
        }

        /* 명언 카드 스타일 */
        #quote-card {
            background: linear-gradient(135deg, #fff5f5, #fffcfc);
            border: 1px dashed var(--primary-color);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            color: var(--weekday-color);
            user-select: none;
        }

        .quote-header-tabs {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .quote-tab-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            cursor: pointer;
            touch-action: manipulation;
        }

        .quote-tab-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .quote-text {
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 6px;
            color: #c0392b;
        }

        .quote-author {
            color: var(--text-sub);
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 상단 설정 바 -->
    <div class="card top-bar">
        <span>🌸 스마트 다이어리</span>
        <button class="action-btn" onclick="toggleSettings()">⚙️ 설정</button>
    </div>

    <!-- 설정 카드 -->
    <div class="card" id="settings-card">
        <div class="settings-title">
            <span>🛠️ 환경 설정</span>
            <button class="close-form-btn" onclick="toggleSettings()">✖</button>
        </div>
        
        <div class="settings-section">
            <label>👀 메모 보기 방식</label>
            <div class="view-select-group">
                <button class="view-select-btn active" id="view-3days" onclick="changeViewMode('3days')">기본 3일</button>
                <button class="view-select-btn" id="view-week" onclick="changeViewMode('week')">일주일</button>
                <button class="view-select-btn" id="view-month" onclick="changeViewMode('month')">한달</button>
                <button class="view-select-btn" id="view-alarm" onclick="changeViewMode('alarm')">예약보기</button>
                <button class="view-select-btn" id="view-all" onclick="changeViewMode('all')">전체보기</button>
            </div>
        </div>

        <div class="settings-section">
            <label>💬 메인 화면 정보 설정</label>
            <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                <button class="view-select-btn active" id="quote-mode-random" onclick="setQuoteMode('random')">매일 명언</button>
                <button class="view-select-btn" id="quote-mode-fixed" onclick="setQuoteMode('fixed')">나만의 좌우명</button>
            </div>
            <div id="fixed-quote-input-wrap" style="display: none; gap: 6px;">
                <input type="text" id="custom-quote-input" placeholder="나만의 좌우명을 입력하세요" style="flex:1; padding: 6px 10px; border:1px solid var(--border-color); border-radius:6px; font-size:14px;">
                <button class="action-btn" style="padding: 6px 12px; font-size:14px;" onclick="saveCustomQuote()">저장</button>
            </div>
        </div>

        <div class="settings-section">
            <label>🔤 글자 크기 조절 (명언/해설 & 메모 공통)</label>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button class="action-btn" style="flex:1;" onclick="adjustFontSize(-1)">작게 (-)</button>
                <span id="font-size-display" style="font-size: 16px; font-weight: bold; min-width: 45px; text-align: center;">16px</span>
                <button class="action-btn" style="flex:1;" onclick="adjustFontSize(1)">크게 (+)</button>
            </div>
        </div>

        <div class="settings-section" style="padding-top: 5px;">
            <button class="action-btn" style="background-color: var(--accent-today); width:100%; font-size:14px; padding:6px;" onclick="resetAllData()">⚠️ 데이터 초기화 (새로 시작)</button>
        </div>
    </div>

    <!-- 🌤️ 날씨 카드 -->
    <div class="card" id="weather-card">
        <div class="weather-header">
            <span>📍 안양시 날씨 정보</span>
            <span style="font-size: 12px; color: #7f8c8d; font-weight: normal;">실시간 기상 예보</span>
        </div>
        <div class="weather-today-box">
            <div class="weather-icon" id="today-weather-icon">⛅</div>
            <div class="weather-info-main">
                <div class="weather-temp" id="today-temp-text">오늘 최고 31°C / 최저 27°C</div>
                <div class="weather-desc" id="today-desc-text">흐림 후 맑음 (주말 비 소식 주의)</div>
            </div>
        </div>
        <div class="weekly-weather-grid" id="weekly-weather-grid"></div>
    </div>

    <!-- 달력 카드 -->
    <div class="card" id="calendar-card">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">◀ 이전</button>
            <h3 id="cal-month-title">0000년 00월</h3>
            <button onclick="changeMonth(1)">다음 ▶</button>
        </div>
        <div class="calendar-grid" id="cal-days-name-grid">
            <div class="cal-day-name sunday">일</div>
            <div class="cal-day-name weekday">월</div>
            <div class="cal-day-name weekday">화</div>
            <div class="cal-day-name weekday">수</div>
            <div class="cal-day-name weekday">목</div>
            <div class="cal-day-name weekday">금</div>
            <div class="cal-day-name saturday">토</div>
        </div>
        <div class="calendar-grid" id="cal-days-grid" style="margin-top: 5px;"></div>
    </div>

    <!-- 구분선 -->
    <div class="section-divider" onclick="toggleDiarySection()">
        <span class="divider-label" id="divider-label-text">📝 나의 기록 펼치기 ▼</span>
    </div>

    <!-- 명언 카드 -->
    <div class="card" id="quote-card">
        <div class="quote-header-tabs">
            <button class="quote-tab-btn active" id="tab-quote" onclick="switchQuoteCategory('quote')">💬 명언/좌우명</button>
            <button class="quote-tab-btn" id="tab-idiom" onclick="switchQuoteCategory('idiom')">📖 사자성어</button>
            <button class="quote-tab-btn" id="tab-tech" onclick="switchQuoteCategory('tech')">🤖 IT / AI 용어</button>
        </div>
        <div class="quote-text" id="quote-content" style="font-size: 16px;">"작은 일에 성실한 사람은 큰 일에도 성실하다."</div>
        <div class="quote-author" id="quote-author-text" style="font-size: 14px;">- 성경 -</div>
    </div>

    <!-- 새 메모 작성/수정 폼 -->
    <div class="card" id="memo-form-card">
        <div class="form-header-info">
            <span id="form-target-date-title">📅 0000년 00월 00일 메모 작성</span>
            <button class="close-form-btn" onclick="closeDiaryForm()">✖</button>
        </div>
        
        <div class="reservation-box">
            <label>⏰ 알람/시간:</label>
            <input type="time" id="reservation-time-input" style="padding: 4px; border:1px solid var(--border-color); border-radius:4px; background:#fff;">
        </div>

        <div id="photo-preview-wrap">
            <img id="image-preview" src="" alt="미리보기">
            <button class="action-btn" style="margin-top:5px;" onclick="removeImage()">사진 취소</button>
        </div>

        <div id="textOutput" class="diary-textarea" contenteditable="true" placeholder="이곳에 메모를 입력하거나 음성메모를 사용하세요..."></div>

        <div class="btn-group">
            <button class="btn btn-secondary" id="record-btn">🎤 음성메모</button>
            <label class="btn btn-secondary" style="text-align:center; display:flex; align-items:center; justify-content:center; cursor:pointer;">
                📷 사진
                <input type="file" id="diary-photo-input" accept="image/*" style="display:none;" onchange="previewImage(event)">
            </label>
            <button class="btn btn-primary" onclick="manualSaveDiary()">저장</button>
        </div>
    </div>

    <!-- 메모 리스트 카드 -->
    <div class="card" id="diary-list-card" style="display: none;">
        <div id="current-view-label" style="font-size: 14px; color: var(--text-sub); margin-bottom: 10px; font-weight: bold;">📋 기본 3일 메모</div>
        <div id="diary-list"></div>
    </div>
</div>

<script>
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();
    let currentViewMode = localStorage.getItem('smartDiaryViewMode') || '3days'; 
    let selectedReservationDate = null;
    let editingDiaryId = null;
    let currentPhotoBase64 = null;
    let currentFontSize = parseInt(localStorage.getItem('smartDiaryFontSize')) || 16;
    let isDiaryOpen = false;

    let quoteMode = localStorage.getItem('smartDiaryQuoteMode') || 'random';
    let customQuoteText = localStorage.getItem('smartDiaryCustomQuote') || '오늘 흘린 땀방울은 내일의 기쁨이 된다.';
    let activeQuoteCategory = localStorage.getItem('smartDiaryQuoteCategory') || 'quote';
    let currentItemIndex = 0; 

    const quotesList = [

    function getTodayStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function getCurrentTimeStr() {
        const d = new Date();
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${h}:${min}`;
    }

    function normalizeDateStr(dateStr) {
        if (!dateStr) return getTodayStr();
        let clean = String(dateStr).trim().replace(/[./]/g, '-');
        let parts = clean.split('-');
        if (parts.length === 3) {
            let y = parts[0];
            let m = parts[1].padStart(2, '0');
            let d = parts[2].padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        return getTodayStr();
    }

    function parseDateObj(dateStr) {
        let cleanStr = normalizeDateStr(dateStr);
        let parts = cleanStr.split('-');
        return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    }

    function getDayOfWeekStr(dateStr) {
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const dObj = parseDateObj(dateStr);
        return days[dObj.getDay()];
    }

            2028: ['2028-01-26', '2028-01-27', '2028-01-28', '2028-05-02', '2028-10-02', '2028-10-03', '2028-10-04'],
            2029: ['2029-02-12', '2029-02-13', '2029-02-14', '2029-05-20', '2029-09-21', '2029-09-22', '2029-09-23'],
            2030: ['2030-02-02', '2030-02-03', '2030-02-04', '2030-05-09', '2030-09-11', '2030-09-12', '2030-09-13']

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onstart = () => {
            isRecording = true;
            recordBtn.innerText = '⏹️ 중지';
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }

            if (finalTranscript) {
                accumulatedText += (accumulatedText ? ' ' : '') + finalTranscript;
            }
            
            textOutput.innerText = accumulatedText + (interimTranscript ? ' ' + interimTranscript : '');
        };

        recognition.onend = () => {
            if (shouldRestart && isRecording) {
                try { recognition.start(); } catch (e) {}
            } else {
                isRecording = false;
                recordBtn.innerText = '🎤 음성메모';
                accumulatedText = textOutput.innerText;
            }
        };
    }

    if (recordBtn) {
        recordBtn.onclick = () => {
            if (!recognition) return;
            if (isRecording) {
                shouldRestart = false;
                isRecording = false;
                recognition.stop();
                recordBtn.innerText = '🎤 음성메모';
            } else {
                shouldRestart = true;
                accumulatedText = textOutput.innerText;
                try { recognition.start(); } catch (e) {}
            }
        };
    }

        if (targetDateStr === todayStr && (!alarmTime || alarmTime === "08:00")) {
            alarmTime = getCurrentTimeStr();
        }

        if (editingDiaryId) {
            diaryListObj = diaryListObj.map(item => {
                if (item.id === editingDiaryId) {
                    return {
                        ...item,
                        date: targetDateStr,
                        time: alarmTime,
                        text: text,
                        photo: currentPhotoBase64
                    };
                }
                return item;
            });
            alert('메모가 성공적으로 수정되었습니다!');
        } else {
            const newEntry = {
                id: Date.now(),
                date: targetDateStr,
                time: alarmTime,
                text: text,
                photo: currentPhotoBase64
            };
            diaryListObj.push(newEntry);
            alert('메모가 안전하게 저장되었습니다!');

    function renderCalendar() {
        const grid = document.getElementById('cal-days-grid');
        const title = document.getElementById('cal-month-title');
        if (!grid || !title) return;

        grid.innerHTML = '';
        title.innerText = `${calYear}년 ${calMonth + 1}월`;

        const firstDayIndex = new Date(calYear, calMonth, 1).getDay();
        const totalDays = new Date(calYear, calMonth + 1, 0).getDate();
        const todayStr = getTodayStr();
        const holidays = getKoreanHolidays(calYear);

        let diaryListObj = getAllDiaries();
        let datesWithMemo = new Map();
        diaryListObj.forEach(item => {
            if (item.date) {
                let normDate = normalizeDateStr(item.date);
                let dObj = parseDateObj(normDate);
                datesWithMemo.set(normDate, dObj.getDay());
            }
        });

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'cal-cell empty';
            grid.appendChild(emptyCell);
        }

        const dayClassMap = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

        for (let day = 1; day <= totalDays; day++) {
            const cell = document.createElement('div');
            cell.className = 'cal-cell';

            const mStr = String(calMonth + 1).padStart(2, '0');
            const dStr = String(day).padStart(2, '0');
            const normalizedDateStr = `${calYear}-${mStr}-${dStr}`;

            const dObj = parseDateObj(normalizedDateStr);
            const dayOfWeek = dObj.getDay();

            if (dayOfWeek === 0 || holidays.has(normalizedDateStr)) {
                cell.classList.add('sunday');
            } else if (dayOfWeek === 6) {
                cell.classList.add('saturday');
            }

            if (normalizedDateStr === todayStr) {
                cell.classList.add('today-date');
            }

            const span = document.createElement('span');
            span.innerText = day;
            cell.appendChild(span);

            if (datesWithMemo.has(normalizedDateStr)) {
                let memoDayOfWeek = datesWithMemo.get(normalizedDateStr);
                const memoLine = document.createElement('div');
                memoLine.className = `memo-line ${dayClassMap[memoDayOfWeek]}`;
                cell.appendChild(memoLine);
            }

            // 날짜 셀 클릭 시 메모 창 열기 (지연 없는 즉시 반응)
            cell.addEventListener('click', (e) => {
                e.stopPropagation();
                openDiaryForm(normalizedDateStr);
            });

            grid.appendChild(cell);
        }
    }

    function loadDiaryList() {
        let diaryListObj = getAllDiaries();
        if (!diaryList) return;
        diaryList.innerHTML = '';

        diaryListObj.sort((a, b) => {
            let dateA = normalizeDateStr(a.date);
            let dateB = normalizeDateStr(b.date);
            if (dateA !== dateB) return dateB.localeCompare(dateA);
            return b.id - a.id;
        });

        const todayStr = getTodayStr();
        const currentTimeStr = getCurrentTimeStr();
        const todayObj = parseDateObj(todayStr);

        let labelText = '📋 기본 3일 메모';
        let filtered = diaryListObj.filter(item => {
            const itemDate = normalizeDateStr(item.date || todayStr);
            const itemObj = parseDateObj(itemDate);

            if (currentViewMode === 'all') {
                labelText = '📋 전체보기 메모';
                return true;
            } else if (currentViewMode === 'alarm') {
                labelText = '⏰ 예약보기 (미래 일정)';
                const isFutureDate = itemDate > todayStr;
                const isTodayFutureTime = (itemDate === todayStr && item.time && item.time >= currentTimeStr);
                return (isFutureDate || isTodayFutureTime) && item.time && item.time.trim() !== '' && item.time.trim() !== '00:00';
            } else if (currentViewMode === 'week') {
                labelText = '📋 일주일 메모';
                const diffTime = todayObj - itemObj;
                const diffDays = diffTime / (1000 * 60 * 60 * 24);
                return diffDays >= 0 && diffDays <= 6;
            } else if (currentViewMode === 'month') {
                labelText = '📋 한달 메모';
                const diffTime = todayObj - itemObj;
                const diffDays = diffTime / (1000 * 60 * 60 * 24);
                return diffDays >= 0 && diffDays <= 30;
            } else {
                labelText = '📋 기본 3일 메모';
                const diffTime = todayObj - itemObj;
                const diffDays = diffTime / (1000 * 60 * 60 * 24);
                return diffDays >= 0 && diffDays <= 2;
            }
        });

        if (currentViewLabel) currentViewLabel.innerText = labelText;

        ['3days', 'week', 'month', 'alarm', 'all'].forEach(type => {
            const btn = document.getElementById(`view-${type}`);
            if (btn) {
                if (type === currentViewMode) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        });

        if (filtered.length === 0) {
            diaryList.innerHTML = `<div style="text-align:center; color:#95a5a6; padding:20px; font-size:15px;">조건에 일치하는 메모가 없습니다.</div>`;
            return;
        }

        let groupedByDate = new Map();
        filtered.forEach(item => {
            const itemDate = normalizeDateStr(item.date || todayStr);
            if (!groupedByDate.has(itemDate)) {
                groupedByDate.set(itemDate, []);
            }
            groupedByDate.get(itemDate).push(item);
        });

        groupedByDate.forEach((items, dateStr) => {
            const normalizedDateStr = normalizeDateStr(dateStr);
            const dayOfWeek = getDayOfWeekStr(normalizedDateStr);
            const dObj = parseDateObj(normalizedDateStr);
            const dayIndex = dObj.getDay(); 
            const yearVal = dObj.getFullYear();
            const yearHolidays = getKoreanHolidays(yearVal);

            let headerColorClass = 'weekday';
            if (dayIndex === 0 || yearHolidays.has(normalizedDateStr)) {
                headerColorClass = 'sunday';    
            } else if (dayIndex === 6) {
                headerColorClass = 'saturday';  
            }
            
            const groupCard = document.createElement('div');
            groupCard.className = 'date-group-card';

            const groupHeader = document.createElement('div');
            groupHeader.className = `date-group-header ${headerColorClass}`;
            groupHeader.innerHTML = `📅 ${normalizedDateStr} (${dayOfWeek})`;
            groupCard.appendChild(groupHeader);

            items.forEach(item => {
                const itemDate = normalizeDateStr(item.date || todayStr);
                const isFutureDate = itemDate > todayStr;
                const isTodayFutureTime = (itemDate === todayStr && item.time && item.time >= currentTimeStr);
                const isFutureAlarm = (isFutureDate || isTodayFutureTime) && item.time && item.time.trim() !== '';

                const subItemDiv = document.createElement('div');
                subItemDiv.className = isFutureAlarm ? 'sub-memo-item alarm-memo' : 'sub-memo-item';

                let timeStrInfo = item.time ? `⏰ ${item.time}` : '';
                let photoHtml = item.photo ? `<img src="${item.photo}" class="diary-photo" alt="메모 사진">` : '';

                subItemDiv.innerHTML = `
                    <div style="font-size: 13px; color: var(--text-sub); margin-bottom: 4px; font-weight: bold;">${timeStrInfo}</div>
                    <div class="diary-text" style="font-size: ${currentFontSize}px;">${item.text || ''}</div>
                    ${photoHtml}
                    <div class="memo-action-btns">
                        <button class="edit-btn" onclick="editDiary(${item.id})">수정</button>
                        <button class="delete-btn" onclick="deleteDiary(${item.id})">삭제</button>
                    </div>
                `;
                groupCard.appendChild(subItemDiv);
            });

            diaryList.appendChild(groupCard);
        });
    }

    function deleteDiary(id) {
        if (!confirm('이 메모를 정말 삭제하시겠습니까?')) return;
        let diaryListObj = getAllDiaries();
        diaryListObj = diaryListObj.filter(item => item.id !== id);
        localStorage.setItem('smartDiaryList', JSON.stringify(diaryListObj));
        renderCalendar();
        loadDiaryList();
    }

    window.onload = function() {
        initSpeechRecognition();
        renderCalendar();
        displayQuote();
        renderWeeklyWeather();
        
        ['quote', 'idiom', 'tech'].forEach(cat => {
            const btn = document.getElementById(`tab-${cat}`);
            if (btn) {
                if (cat === activeQuoteCategory) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        });

        if (quoteMode === 'fixed') {
            document.getElementById('quote-mode-fixed').classList.add('active');
            document.getElementById('quote-mode-random').classList.remove('active');
            fixedQuoteInputWrap.style.display = 'flex';
            if (customQuoteInput) customQuoteInput.value = customQuoteText;
        }

        if (fontSizeDisplay) {
            fontSizeDisplay.innerText = currentFontSize + 'px';
        }
        if (textOutput) {
            textOutput.style.fontSize = currentFontSize + 'px';
        }
        if (quoteContent) {
            quoteContent.style.fontSize = currentFontSize + 'px';
        }
        if (quoteAuthorText) {
            quoteAuthorText.style.fontSize = Math.max(12, currentFontSize - 2) + 'px';
        }
    };
</script>
