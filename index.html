<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 다이어리 & 용돈관리</title>
    <style>
        :root {
            --bg-color: #f7f4f4;
            --card-bg: #ffffff;
            --primary-color: #e06d6d;
            --primary-hover: #cc5c5c;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border-color: #e6d8d8;
            --accent-today: #e74c3c;
            --sun-color: #d93838;
            --sat-color: #1b6ca8;
            --weekday-color: #34495e;
            --income-color: #27ae60;
            --expense-color: #c0392b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            touch-action: manipulation;
            font-size: 16px;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.04);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            color: var(--primary-color);
            font-weight: bold;
        }

        .action-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .action-btn:hover {
            background: var(--primary-hover);
        }

        /* 설정 카드 */
        #settings-card {
            display: none;
            background: #fff8f8;
            border: 2px solid var(--primary-color);
            animation: fadeIn 0.3s ease;
        }

        .settings-title {
            font-size: 17px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-section {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
        }

        .settings-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .settings-section label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--weekday-color);
        }

        .view-select-group {
            display: flex;
            gap: 6px;
        }

        .view-select-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-sub);
            font-weight: bold;
        }

        .view-select-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 💰 용돈관리 요약 카드 */
        #money-summary-card {
            background: linear-gradient(135deg, #f0fff4, #e6f9ed);
            border: 1px solid #c2e8ce;
            border-radius: 12px;
            padding: 15px;
        }

        .money-summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
            color: #27ae60;
            font-size: 16px;
        }

        .money-summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .money-box {
            background: #ffffff;
            border: 1px solid #d2eedc;
            border-radius: 8px;
            padding: 8px 4px;
        }

        .money-box .m-label {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 3px;
        }

        .money-box .m-value {
            font-size: 14px;
            font-weight: bold;
        }

        .money-box.income .m-value { color: var(--income-color); }
        .money-box.expense .m-value { color: var(--expense-color); }
        .money-box.balance .m-value { color: #2980b9; }

        /* 📊 통계 및 검색 카드 스타일 */
        .sub-feature-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
        }

        .feature-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 카테고리 통계 바 */
        .stat-bar-container {
            margin-bottom: 8px;
        }

        .stat-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 3px;
        }

        .stat-bar-bg {
            width: 100%;
            height: 8px;
            background: #f1f2f6;
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            background: var(--expense-color);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        /* 검색 필터 영역 */
        .search-filter-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-row {
            display: flex;
            gap: 6px;
        }

        .search-input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        /* 날씨 카드 스타일 */
        #weather-card {
            background: linear-gradient(135deg, #f0f7ff, #e6f0fa);
            border: 1px solid #bce0fd;
            border-radius: 12px;
            padding: 15px;
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
            color: #2980b9;
            font-size: 16px;
        }

        .weather-today-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #d0e7ff;
        }

        .weather-icon {
            font-size: 32px;
        }

        .weather-info-main {
            flex: 1;
        }

        .weather-temp {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }

        .weather-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .weekly-weather-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .weekly-cell {
            background: #ffffff;
            border: 1px solid #d0e7ff;
            border-radius: 6px;
            padding: 6px 2px;
            font-size: 12px;
        }

        .weekly-cell .w-day {
            font-weight: bold;
            color: #34495e;
            margin-bottom: 3px;
        }

        .weekly-cell .w-icon {
            font-size: 16px;
            margin-bottom: 2px;
        }

        .weekly-cell .w-temp {
            font-size: 11px;
            color: var(--text-sub);
        }

        /* 달력 스타일 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-header h3 {
            color: var(--primary-color);
            font-size: 20px;
        }

        .calendar-header button {
            background: #faf5f5;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-main);
            font-weight: bold;
            font-size: 15px;
            touch-action: manipulation;
        }

        .calendar-header button:hover {
            background: #f4e8e8;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .cal-day-name {
            font-size: 15px;
            font-weight: bold;
            padding-bottom: 6px;
        }

        .cal-day-name.sunday { color: var(--sun-color); }
        .cal-day-name.saturday { color: var(--sat-color); }
        .cal-day-name.weekday { color: var(--weekday-color); }

        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            background: #ffffff;
            border: 1px solid #e8dfdf;
            color: var(--weekday-color);
            touch-action: manipulation;
        }

        .cal-cell:hover {
            opacity: 0.85;
            border-color: var(--primary-color);
        }

        .cal-cell.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .cal-cell.sunday {
            background: #fdf2f2;
            border-color: #f7d6d6;
        }

        .cal-cell.saturday {
            background: #f0f6fb;
            border-color: #d1e3f3;
        }

        .cal-cell.today-date {
            border: 2px solid var(--accent-today) !important;
            font-weight: bold;
            background: #fff5f5 !important;
        }

        .memo-line {
            width: 65%;
            height: 3px;
            border-radius: 2px;
            margin-top: 2px;
        }
        .memo-line.sun { background-color: var(--sun-color); }
        .memo-line.mon { background-color: #e67e22; }
        .memo-line.tue { background-color: #f1c40f; }
        .memo-line.wed { background-color: #27ae60; }
        .memo-line.thu { background-color: #3498db; }
        .memo-line.fri { background-color: #9b59b6; }
        .memo-line.sat { background-color: var(--sat-color); }

        .money-dots {
            display: flex;
            gap: 3px;
            margin-top: 2px;
            margin-bottom: 1px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .dot.expense { background-color: var(--expense-color); }
        .dot.income { background-color: var(--income-color); }

        /* 메모 및 가계부 작성 폼 */
        #memo-form-card {
            display: none;
            border: 2px solid var(--primary-color);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 17px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .close-form-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-sub);
        }

        .reservation-box {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            background: #fff0f0;
            padding: 8px 10px;
            border-radius: 8px;
            color: var(--text-sub);
        }

        .reservation-box input {
            font-size: 13px;
            padding: 3px 6px;
        }

        /* 💵 가계부 입력 영역 스타일 */
        .money-input-box {
            background: #f0f9f4;
            border: 1px solid #c2e8ce;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .money-input-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .money-type-btn {
            flex: 1;
            padding: 6px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-sub);
        }

        .money-type-btn.expense.active {
            background: var(--expense-color);
            color: white;
            border-color: var(--expense-color);
        }

        .money-type-btn.income.active {
            background: var(--income-color);
            color: white;
            border-color: var(--income-color);
        }

        .money-input-field {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            background: #fff;
        }

        .diary-textarea {
            width: 100%;
            min-height: 100px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            resize: vertical;
            outline: none;
            background: #fff;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .diary-textarea:focus {
            border-color: var(--primary-color);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            touch-action: manipulation;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #f0e2e2;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #e5d2d2;
        }

        /* 일자별 그룹 박스 스타일 */
        .date-group-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .date-group-header {
            font-size: 16px;
            font-weight: bold;
            padding-bottom: 8px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--bg-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .date-group-header.sunday { color: var(--sun-color); }
        .date-group-header.saturday { color: var(--sat-color); }
        .date-group-header.weekday { color: var(--weekday-color); }

        .sub-memo-item {
            background: #fcfcfc;
            border: 1px solid #f0e6e6;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            position: relative;
            padding-right: 95px;
        }

        .sub-memo-item:last-child {
            margin-bottom: 0;
        }

        .sub-memo-item.alarm-memo {
            border-left: 4px solid var(--primary-color);
        }

        .sub-memo-item.money-item-box {
            border-left: 4px solid var(--income-color);
            background: #fbfefc;
        }
        .sub-memo-item.money-item-box.is-expense {
            border-left: 4px solid var(--expense-color);
            background: #fffdfd;
        }

        .diary-text {
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .diary-photo {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 8px;
            display: block;
        }

        .memo-action-btns {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
        }

        .edit-btn, .delete-btn {
            background: none;
            border: none;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            touch-action: manipulation;
        }

        .edit-btn { color: #3498db; }
        .edit-btn:hover { background: #ebf5fb; }

        .delete-btn { color: #e74c3c; }
        .delete-btn:hover { background: #fdf2f2; }

        #photo-preview-wrap {
            display: none;
            position: relative;
            margin-bottom: 10px;
        }

        #image-preview {
            max-height: 100px;
            border-radius: 6px;
        }

        .section-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 2px;
            cursor: pointer;
        }

        .section-divider::before,
        .section-divider::after {
            content: "";
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
            opacity: 0.55;
        }

        .section-divider .divider-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
            color: var(--primary-color);
            background: var(--bg-color);
            padding: 4px 12px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            white-space: nowrap;
        }

        .section-divider:hover .divider-label {
            background: #f0e2e2;
        }

        /* 명언 카드 스타일 */
        #quote-card {
            background: linear-gradient(135deg, #fff5f5, #fffcfc);
            border: 1px dashed var(--primary-color);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            color: var(--weekday-color);
            user-select: none;
        }

        .quote-header-tabs {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .quote-tab-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            cursor: pointer;
            touch-action: manipulation;
        }

        .quote-tab-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .quote-text {
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 6px;
            color: #c0392b;
        }

        .quote-author {
            color: var(--text-sub);
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 상단 설정 바 -->
    <div class="card top-bar">
        <span>🌸 스마트 다이어리 & 용돈관리</span>
        <button class="action-btn" onclick="toggleSettings()">⚙️ 설정</button>
    </div>

    <!-- 설정 카드 -->
    <div class="card" id="settings-card">
        <div class="settings-title">
            <span>🛠️ 환경 설정</span>
            <button class="close-form-btn" onclick="toggleSettings()">✖</button>
        </div>
        
        <div class="settings-section">
            <label>👀 메모 보기 방식</label>
            <div class="view-select-group">
                <button class="view-select-btn active" id="view-3days" onclick="changeViewMode('3days')">기본 3일</button>
                <button class="view-select-btn" id="view-week" onclick="changeViewMode('week')">일주일</button>
                <button class="view-select-btn" id="view-month" onclick="changeViewMode('month')">한달</button>
                <button class="view-select-btn" id="view-alarm" onclick="changeViewMode('alarm')">예약보기</button>
                <button class="view-select-btn" id="view-all" onclick="changeViewMode('all')">전체보기</button>
            </div>
        </div>

        <!-- 🌤️ 날씨 표시 온/오프 설정 -->
        <div class="settings-section">
            <label>🌤️ 날씨 정보 표시 설정</label>
            <div style="display: flex; gap: 6px;">
                <button class="view-select-btn active" id="weather-on-btn" onclick="setWeatherVisibility(true)">날씨 켜기</button>
                <button class="view-select-btn" id="weather-off-btn" onclick="setWeatherVisibility(false)">날씨 끄기</button>
            </div>
        </div>

        <!-- 💵 용돈현황 표시 온/오프 설정 -->
        <div class="settings-section">
            <label>💵 용돈현황 요약 표시 설정</label>
            <div style="display: flex; gap: 6px;">
                <button class="view-select-btn active" id="money-summary-on-btn" onclick="setMoneySummaryVisibility(true)">용돈현황 켜기</button>
                <button class="view-select-btn" id="money-summary-off-btn" onclick="setMoneySummaryVisibility(false)">용돈현황 끄기</button>
            </div>
        </div>

        <!-- 💬 명언/좌우명 표시 온/오프 설정 -->
        <div class="settings-section">
            <label>💬 명언 및 좌우명 표시 설정</label>
            <div style="display: flex; gap: 6px;">
                <button class="view-select-btn active" id="quote-on-btn" onclick="setQuoteVisibility(true)">명언 켜기</button>
                <button class="view-select-btn" id="quote-off-btn" onclick="setQuoteVisibility(false)">명언 끄기</button>
            </div>
        </div>

        <div class="settings-section">
            <label>💬 메인 화면 정보 설정</label>
            <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                <button class="view-select-btn active" id="quote-mode-random" onclick="setQuoteMode('random')">매일 명언</button>
                <button class="view-select-btn" id="quote-mode-fixed" onclick="setQuoteMode('fixed')">나만의 좌우명</button>
            </div>
            <div id="fixed-quote-input-wrap" style="display: none; gap: 6px;">
                <input type="text" id="custom-quote-input" placeholder="나만의 좌우명을 입력하세요" style="flex:1; padding: 6px 10px; border:1px solid var(--border-color); border-radius:6px; font-size:14px;">
                <button class="action-btn" style="padding: 6px 12px; font-size:14px;" onclick="saveCustomQuote()">저장</button>
            </div>
        </div>

        <div class="settings-section">

    function getTodayStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function getCurrentTimeStr() {
        const d = new Date();
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${h}:${min}`;
    }

    function normalizeDateStr(dateStr) {
        if (!dateStr) return getTodayStr();
        let clean = String(dateStr).trim().replace(/[./]/g, '-');
        let parts = clean.split('-');
        if (parts.length === 3) {
            let y = parts[0];
            let m = parts[1].padStart(2, '0');
            let d = parts[2].padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        return getTodayStr();
    }

    function parseDateObj(dateStr) {
        let cleanStr = normalizeDateStr(dateStr);
        let parts = cleanStr.split('-');
        return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    }

    function getDayOfWeekStr(dateStr) {
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const dObj = parseDateObj(dateStr);
        return days[dObj.getDay()];
    }

    function getKoreanHolidays(year) {

            `${year}-10-09`, `${year}-12-25`

            2024: ['2024-02-09', '2024-02-10', '2024-02-11', '2024-05-15', '2024-09-16', '2024-09-17', '2024-09-18'],
            2025: ['2025-01-28', '2025-01-29', '2025-01-30', '2025-05-05', '2025-10-05', '2025-10-06', '2025-10-07'],
            2026: ['2026-02-16', '2026-02-17', '2026-02-18', '2026-05-24', '2026-09-24', '2026-09-25', '2026-09-26'],
            2027: ['2027-02-06', '2027-02-07', '2027-02-08', '2027-05-13', '2027-09-14', '2027-09-15', '2027-09-16'],
            2028: ['2028-01-26', '2028-01-27', '2028-01-28', '2028-05-02', '2028-10-02', '2028-10-03', '2028-10-04'],
            2029: ['2029-02-12', '2029-02-13', '2029-02-14', '2029-05-20', '2029-09-21', '2029-09-22', '2029-09-23'],
            2030: ['2030-02-02', '2030-02-03', '2030-02-04', '2030-05-09', '2030-09-11', '2030-09-12', '2030-09-13']
        };
        if (lunarHolidays[year]) lunarHolidays[year].forEach(d => holidays.add(d));
        return holidays;
    }

    function getAllDiaries() {
        let combinedList = [];
        let standardData = localStorage.getItem('smartDiaryList');
        if (standardData) {
            try { 
                let parsed = JSON.parse(standardData);
                if (Array.isArray(parsed)) combinedList = parsed;
            } catch (e) {
                combinedList = [];
            }
        }
        return combinedList;
    }

    // 📊 카테고리별 통계 렌더링 함수 추가
    function renderCategoryStats() {
        const statsBody = document.getElementById('category-stats-body');
        const statsTotalExpense = document.getElementById('stats-total-expense');
        if (!statsBody) return;

        statsBody.innerHTML = '';
        const diaries = getAllDiaries();
        const prefix = `${calYear}-${String(calMonth + 1).padStart(2, '0')}`;

        let categorySums = {};
        expenseCategories.forEach(cat => categorySums[cat] = 0);
        let totalExp = 0;

        diaries.forEach(item => {
            if (normalizeDateStr(item.date).startsWith(prefix) && item.money && item.money.type === 'expense') {
                let cat = item.money.category || '기타 지출';
                let amt = Number(item.money.amount) || 0;
                if (!categorySums[cat]) categorySums[cat] = 0;
                categorySums[cat] += amt;
                totalExp += amt;
            }
        });

        if (statsTotalExpense) statsTotalExpense.textContent = totalExp.toLocaleString() + '원';

        let sortedCats = Object.keys(categorySums).map(cat => ({
            category: cat,
            amount: categorySums[cat]
        })).sort((a, b) => b.amount - a.amount);

        let hasData = sortedCats.some(item => item.amount > 0);
        if (!hasData) {
            statsBody.innerHTML = '<div style="text-align:center; color:var(--text-sub); font-size:13px; padding:6px;">이번 달 지출 내역이 없습니다.</div>';
            return;
        }

        sortedCats.forEach(item => {
            if (item.amount === 0) return;
            let percent = totalExp > 0 ? ((item.amount / totalExp) * 100).toFixed(1) : 0;

            const row = document.createElement('div');
            row.className = 'stat-bar-container';
            row.innerHTML = `
                <div class="stat-info-row">
                    <span style="font-weight:bold; color:var(--weekday-color);">${item.category}</span>
                    <span>${item.amount.toLocaleString()}원 (<span style="color:var(--primary-color);">${percent}%</span>)</span>
                </div>
                <div class="stat-bar-bg">
                    <div class="stat-bar-fill" style="width: ${percent}%;"></div>
                </div>
            `;
            statsBody.appendChild(row);
        });
    }

    // 🔍 검색 및 기간별 필터 함수 추가
    function setPeriodFilter(period) {
        currentPeriodFilter = period;
        ['all', 'week', 'month'].forEach(p => {
            const btn = document.getElementById(`filter-period-${p}`);
            if (btn) {
                if (p === period) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        });
        filterCustomList();
    }

    function resetSearchFilter() {
        if (keywordSearchInput) keywordSearchInput.value = '';
        setPeriodFilter('all');
    }

    function filterCustomList() {
        const resultListContainer = document.getElementById('search-result-list');
        if (!resultListContainer) return;
        resultListContainer.innerHTML = '';

        let diaries = getAllDiaries();
        let keyword = keywordSearchInput ? keywordSearchInput.value.trim().toLowerCase() : '';
        const todayStr = getTodayStr();
        const tObj = parseDateObj(todayStr);

        let filtered = diaries.filter(item => {
            let itemDateStr = normalizeDateStr(item.date);
            
            // 기간 필터 적용
            if (currentPeriodFilter === 'week') {
                let itemDate = parseDateObj(itemDateStr);
                let diffTime = tObj - itemDate;
                let diffDays = diffTime / (1000 * 60 * 60 * 24);
                if (diffDays < 0 || diffDays > 7) return false;
            } else if (currentPeriodFilter === 'month') {
                let prefix = `${calYear}-${String(calMonth + 1).padStart(2, '0')}`;
                if (!itemDateStr.startsWith(prefix)) return false;
            }

            // 키워드 검색 적용 (메모 내용, 가계부 카테고리, 금액 등에 포함되는지 확인)
            if (keyword !== '') {
                let textMatch = item.text && item.text.toLowerCase().includes(keyword);
                let catMatch = item.money && item.money.category && item.money.category.toLowerCase().includes(keyword);
                let amtMatch = item.money && String(item.money.amount).includes(keyword);
                if (!textMatch && !catMatch && !amtMatch) return false;
            }

            return true;
        });

        if (filtered.length === 0) {
            resultListContainer.innerHTML = '<div style="text-align:center; color:var(--text-sub); font-size:13px; padding:10px;">조건에 일치하는 상세 내역이 없습니다.</div>';
            return;
        }

        filtered.sort((a, b) => normalizeDateStr(b.date).localeCompare(normalizeDateStr(a.date)));

        filtered.forEach(item => {
            const subItem = document.createElement('div');
            subItem.className = 'sub-memo-item';
            let dateStr = normalizeDateStr(item.date);

            let moneyHTML = '';
            if (item.money) {
                let isExp = item.money.type === 'expense';
                subItem.classList.add('money-item-box');
                if (isExp) subItem.classList.add('is-expense');

                let colorStyle = isExp ? 'color: var(--expense-color);' : 'color: var(--income-color);';
                let typeSign = isExp ? '-' : '+';
                let amountStr = Number(item.money.amount).toLocaleString() + '원';
                
                moneyHTML = `<div style="font-weight: bold; margin-bottom: 4px; ${colorStyle}">
                    💰 [${dateStr}] [${isExp ? '지출' : '수입'}] ${item.money.category} : ${typeSign}${amountStr}
                </div>`;
            } else {
                moneyHTML = `<div style="font-weight: bold; margin-bottom: 4px; color:var(--text-sub);">📅 [${dateStr}] 메모</div>`;
            }

            let textContentHTML = item.text ? `<div class="diary-text" style="font-size: ${currentFontSize}px;">${item.text}</div>` : '';
            let photoHTML = item.photo ? `<img src="${item.photo}" class="diary-photo" alt="첨부사진">` : '';

            subItem.innerHTML = `
                <div class="memo-action-btns">
                    <button class="edit-btn" onclick='openDiaryForm("${dateStr}", ${JSON.stringify(item)})'>수정</button>
                    <button class="delete-btn" onclick="deleteDiary('${item.id}')">삭제</button>
                </div>
                ${moneyHTML}
                ${textContentHTML}
                ${photoHTML}
            `;
            resultListContainer.appendChild(subItem);
        });
    }

    function updateMoneySummary() {
        const diaries = getAllDiaries();
        const prefix = `${calYear}-${String(calMonth + 1).padStart(2, '0')}`;
        
        let totalIncome = 0;
        let totalExpense = 0;

        diaries.forEach(item => {
            if (normalizeDateStr(item.date).startsWith(prefix) && item.money && item.money.amount) {
                let amt = Number(item.money.amount) || 0;
                if (item.money.type === 'income') totalIncome += amt;
                else if (item.money.type === 'expense') totalExpense += amt;
            }
        });

        let balance = totalIncome - totalExpense;

        const summaryTitle = document.getElementById('money-summary-title');
        const summaryIncome = document.getElementById('summary-income');
        const summaryExpense = document.getElementById('summary-expense');
        const summaryBalance = document.getElementById('summary-balance');

        if (summaryTitle) summaryTitle.textContent = `💵 ${calYear}년 ${calMonth + 1}월 용돈 현황`;
        if (summaryIncome) summaryIncome.textContent = totalIncome.toLocaleString() + '원';
        if (summaryExpense) summaryExpense.textContent = totalExpense.toLocaleString() + '원';
        if (summaryBalance) {
            summaryBalance.textContent = balance.toLocaleString() + '원';
            summaryBalance.style.color = balance < 0 ? 'var(--expense-color)' : '#2980b9';
        }

        renderCategoryStats();
        filterCustomList();
    }

    function renderCalendar() {
        const title = document.getElementById('cal-month-title');
        const grid = document.getElementById('cal-days-grid');
        if (!title || !grid) return;

        title.textContent = `${calYear}년 ${calMonth + 1}월`;
        grid.innerHTML = '';

        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const lastDate = new Date(calYear, calMonth + 1, 0).getDate();
        const holidays = getKoreanHolidays(calYear);
        const diaries = getAllDiaries();
        const todayStr = getTodayStr();

        for (let i = 0; i < firstDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'cal-cell empty';
            grid.appendChild(emptyCell);
        }

        for (let day = 1; day <= lastDate; day++) {
            const mStr = String(calMonth + 1).padStart(2, '0');
            const dStr = String(day).padStart(2, '0');
            const dateStr = `${calYear}-${mStr}-${dStr}`;

            const cell = document.createElement('div');
            cell.className = 'cal-cell';

            const dObj = new Date(calYear, calMonth, day);
            const dayOfWeek = dObj.getDay();

            if (dateStr === todayStr) cell.classList.add('today-date');

            if (dayOfWeek === 0 || holidays.has(dateStr)) cell.classList.add('sunday');
            else if (dayOfWeek === 6) cell.classList.add('saturday');

            const dayDiaries = diaries.filter(d => normalizeDateStr(d.date) === dateStr);
            let indicatorHTML = '';
            if (dayDiaries.length > 0) {
                const daysMap = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
                const lineClass = daysMap[dayOfWeek] || 'mon';
                
                let hasExpense = dayDiaries.some(d => d.money && d.money.type === 'expense');
                let hasIncome = dayDiaries.some(d => d.money && d.money.type === 'income');
                
                let dotHTML = '';
                if (hasExpense || hasIncome) {
                    let dots = [];
                    if (hasExpense) dots.push('<span class="dot expense" title="지출"></span>');
                    if (hasIncome) dots.push('<span class="dot income" title="수입"></span>');
                    dotHTML = `<div class="money-dots">${dots.join('')}</div>`;
                }

                indicatorHTML = `${dotHTML}<div class="memo-line ${lineClass}"></div>`;
            }

            cell.innerHTML = `<span>${day}</span>${indicatorHTML}`;
            cell.onclick = () => openDiaryForm(dateStr);
            grid.appendChild(cell);
        }
        updateMoneySummary();
    }

    function changeMonth(delta) {
        calMonth += delta;
        if (calMonth > 11) { calMonth = 0; calYear++; }
        else if (calMonth < 0) { calMonth = 11; calYear--; }
        renderCalendar();
    }

    function openDiaryForm(dateStr, existingItem = null) {
        selectedReservationDate = normalizeDateStr(dateStr);
        editingDiaryId = existingItem ? existingItem.id : null;

        const dObj = parseDateObj(selectedReservationDate);
        const dayName = getDayOfWeekStr(selectedReservationDate);
        formTargetDateTitle.textContent = `📅 ${dObj.getFullYear()}년 ${dObj.getMonth() + 1}월 ${dObj.getDate()}일 (${dayName}) 메모`;

        if (existingItem) {
            textOutput.innerHTML = existingItem.text || '';
            reservationTimeInput.value = existingItem.time || '';
            currentPhotoBase64 = existingItem.photo || null;
            if (existingItem.money) {
                setMoneyType(existingItem.money.type || 'expense', existingItem.money.category || '');
                moneyAmountInput.value = Number(existingItem.money.amount || 0).toLocaleString();
            } else {
                setMoneyType('expense', '');
                moneyAmountInput.value = '';
            }
        } else {
            textOutput.innerHTML = '';
            reservationTimeInput.value = getCurrentTimeStr();
            currentPhotoBase64 = null;
            setMoneyType('expense', '');
            moneyAmountInput.value = '';
        }

        updatePhotoPreview();
        memoFormCard.style.display = 'block';
        memoFormCard.scrollIntoView({ behavior: 'smooth' });
    }

    function closeDiaryForm() {
        memoFormCard.style.display = 'none';
        editingDiaryId = null;
        currentPhotoBase64 = null;
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            currentPhotoBase64 = e.target.result;
            updatePhotoPreview();
        };
        reader.readAsDataURL(file);
    }

    function updatePhotoPreview() {
        const wrap = document.getElementById('photo-preview-wrap');
        const img = document.getElementById('image-preview');
        if (currentPhotoBase64) {
            img.src = currentPhotoBase64;
            wrap.style.display = 'block';
        } else {
            img.src = '';
            wrap.style.display = 'none';
        }

    function removeImage() {
        currentPhotoBase64 = null;
        updatePhotoPreview();
        const fileInput = document.getElementById('diary-photo-input');
        if (fileInput) fileInput.value = '';
    }

    function manualSaveDiary() {
        const content = textOutput.innerHTML.trim();
        const timeVal = reservationTimeInput.value;
        const moneyCategory = moneyCategorySelect.value;
        const rawAmount = moneyAmountInput.value.replace(/[^0-9]/g, '').trim();

        let moneyObj = null;
        if (rawAmount !== '' && !isNaN(rawAmount)) {
            moneyObj = {
                type: currentMoneyType,
                category: moneyCategory,
                amount: Number(rawAmount)
            };
        }

        if (!content && !currentPhotoBase64 && !moneyObj) {
            alert('내용, 사진, 또는 가계부 내역 중 하나 이상을 입력해주세요.');
            return;
        }

        let diaries = getAllDiaries();

        if (editingDiaryId) {
            diaries = diaries.map(item => {
                if (item.id === editingDiaryId) {
                    return { ...item, text: content, time: timeVal, photo: currentPhotoBase64, money: moneyObj };
                }
                return item;
            });
        } else {
            const newItem = {
                id: Date.now().toString(),
                date: selectedReservationDate,
                time: timeVal,
                text: content,
                photo: currentPhotoBase64,
                money: moneyObj
            };
            diaries.push(newItem);
        }

        localStorage.setItem('smartDiaryList', JSON.stringify(diaries));
        closeDiaryForm();
        renderCalendar();
        updateMoneySummary();
        if (isDiaryOpen) loadDiaryList();
    }

    function deleteDiary(id) {
        if (!confirm('이 항목을 정말 삭제하시겠습니까?')) return;
        let diaries = getAllDiaries();
        diaries = diaries.filter(d => d.id !== id);
        localStorage.setItem('smartDiaryList', JSON.stringify(diaries));
        renderCalendar();
        updateMoneySummary();
        if (isDiaryOpen) loadDiaryList();
    }

    function loadDiaryList() {
        if (!diaryList) return;
        diaryList.innerHTML = '';

        let diaries = getAllDiaries();
        if (diaries.length === 0) {
            diaryList.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:15px;">등록된 메모가 없습니다. 달력 날짜를 터치해 기록을 남겨보세요!</div>';
            if (currentViewLabel) currentViewLabel.textContent = '📋 메모 목록 (0개)';
            return;
        }

        const todayStr = getTodayStr();
        let filtered = [];
        let labelText = '';

        if (currentViewMode === '3days') {
            labelText = '📋 기본 3일 기록 (오늘 기준 전후)';
            const tObj = parseDateObj(todayStr);
            let targetDates = [];
            for (let i = -1; i <= 1; i++) {
                let d = new Date(tObj);
                d.setDate(tObj.getDate() + i);
                let y = d.getFullYear();
                let m = String(d.getMonth() + 1).padStart(2, '0');
                let day = String(d.getDate()).padStart(2, '0');
                targetDates.push(`${y}-${m}-${day}`);
            }
            filtered = diaries.filter(d => targetDates.includes(normalizeDateStr(d.date)));
        } else if (currentViewMode === 'week') {
            labelText = '📋 일주일 기록 (이번 주)';
            const tObj = parseDateObj(todayStr);
            let dayOfWeek = tObj.getDay();
            let targetDates = [];
            for (let i = 0; i < 7; i++) {
                let d = new Date(tObj);
                d.setDate(tObj.getDate() - dayOfWeek + i);
                let y = d.getFullYear();
                let m = String(d.getMonth() + 1).padStart(2, '0');
                let day = String(d.getDate()).padStart(2, '0');
                targetDates.push(`${y}-${m}-${day}`);
            }
            filtered = diaries.filter(d => targetDates.includes(normalizeDateStr(d.date)));
        } else if (currentViewMode === 'month') {
            labelText = `📋 한달 기록 (${calYear}년 ${calMonth + 1}월)`;
            let prefix = `${calYear}-${String(calMonth + 1).padStart(2, '0')}`;
            filtered = diaries.filter(d => normalizeDateStr(d.date).startsWith(prefix));
        } else if (currentViewMode === 'alarm') {
            labelText = '📋 예약/알람 설정된 메모';
            filtered = diaries.filter(d => d.time && d.time.trim() !== '');
        } else {
            labelText = '📋 전체 기록 목록';
            filtered = diaries;
        }

        if (currentViewLabel) currentViewLabel.textContent = labelText;

        if (filtered.length === 0) {
            diaryList.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:15px;">해당 조건에 일치하는 기록이 없습니다.</div>';
            return;
        }

        filtered.sort((a, b) => normalizeDateStr(b.date).localeCompare(normalizeDateStr(a.date)));

        let grouped = {};
        filtered.forEach(item => {
            let dStr = normalizeDateStr(item.date);
            if (!grouped[dStr]) grouped[dStr] = [];
            grouped[dStr].push(item);
        });

        Object.keys(grouped).sort((a, b) => b.localeCompare(a)).forEach(dateStr => {
            const groupCard = document.createElement('div');
            groupCard.className = 'date-group-card';

            const dObj = parseDateObj(dateStr);
            const dayOfWeek = dObj.getDay();
            const dayName = getDayOfWeekStr(dateStr);
            const holidays = getKoreanHolidays(dObj.getFullYear());

            let headerClass = 'weekday';
            if (dayOfWeek === 0 || holidays.has(dateStr)) headerClass = 'sunday';
            else if (dayOfWeek === 6) headerClass = 'saturday';

            let groupHeader = document.createElement('div');
            groupHeader.className = `date-group-header ${headerClass}`;
            groupHeader.innerHTML = `<span>📅 ${dObj.getFullYear()}년 ${dObj.getMonth() + 1}월 ${dObj.getDate()}일 (${dayName})</span>`;
            groupCard.appendChild(groupHeader);

            grouped[dateStr].forEach(item => {
                const subItem = document.createElement('div');
                subItem.className = 'sub-memo-item';
                if (item.time) subItem.classList.add('alarm-memo');

                let moneyHTML = '';
                if (item.money) {
                    let isExp = item.money.type === 'expense';
                    subItem.classList.add('money-item-box');
                    if (isExp) subItem.classList.add('is-expense');

                    let colorStyle = isExp ? 'color: var(--expense-color);' : 'color: var(--income-color);';
                    let typeSign = isExp ? '-' : '+';
                    let amountStr = Number(item.money.amount).toLocaleString() + '원';
                    
                    moneyHTML = `<div style="font-weight: bold; margin-bottom: 4px; ${colorStyle}">
                        💰 [${isExp ? '지출' : '수입'}] ${item.money.category} : ${typeSign}${amountStr}
                    </div>`;
                }

                let timeBadge = item.time ? `<span style="color:var(--primary-color); font-weight:bold; margin-right:6px; font-size:12px;">⏰ ${item.time}</span>` : '';
                let photoHTML = item.photo ? `<img src="${item.photo}" class="diary-photo" alt="첨부사진">` : '';
                let textContentHTML = item.text ? `<div class="diary-text" style="font-size: ${currentFontSize}px;">${timeBadge}${item.text}</div>` : (item.time ? `<div class="diary-text" style="font-size: ${currentFontSize}px;">${timeBadge}</div>` : '');

                subItem.innerHTML = `
                    <div class="memo-action-btns">
                        <button class="edit-btn" onclick='openDiaryForm("${dateStr}", ${JSON.stringify(item)})'>수정</button>
                        <button class="delete-btn" onclick="deleteDiary('${item.id}')">삭제</button>
                    </div>
                    ${moneyHTML}
                    ${textContentHTML}
                    ${photoHTML}
                `;
                groupCard.appendChild(subItem);
            });

            diaryList.appendChild(groupCard);
        });
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            if (recordBtn) recordBtn.style.display = 'none';
            return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onstart = () => {
            isRecording = true;
            if (recordBtn) { recordBtn.style.background = '#e74c3c'; recordBtn.textContent = '⏹️ 녹음 중지'; }
        };

        recognition.onresult = (event) => {
            let interimText = '';
            let finalSegment = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) finalSegment += event.results[i][0].transcript;
                else interimText += event.results[i][0].transcript;
            }
            if (finalSegment) accumulatedText += finalSegment + ' ';
            if (textOutput) textOutput.innerHTML = accumulatedText + interimText;
        };

        recognition.onend = () => {
            if (shouldRestart) {
                try { recognition.start(); return; } catch (e) { console.error(e); }
            }
            isRecording = false;
            shouldRestart = false;
            if (recordBtn) { recordBtn.style.background = ''; recordBtn.textContent = '🎤 음성메모'; }
        };

        if (recordBtn) {
            recordBtn.onclick = () => {
                if (!isRecording) {
                    accumulatedText = textOutput.innerHTML.trim() ? textOutput.innerHTML + ' ' : '';
                    shouldRestart = true;
                    try { recognition.start(); } catch (e) { console.error(e); }
                } else {
                    shouldRestart = false;
                    try { recognition.stop(); } catch (e) { console.error(e); }
                }
            };
        }
    }

    window.onload = () => {
        renderWeeklyWeather();
        setWeatherVisibility(isWeatherVisible);
        setQuoteVisibility(isQuoteVisible);
        setMoneySummaryVisibility(isMoneySummaryVisible);
        renderCalendar();
        applyFontSize();
        setQuoteMode(quoteMode);
        initSpeechRecognition();
        updateMoneySummary();
    };
</script>
