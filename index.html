<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>V195 1호 다이어리+나의사주 - 원본레이아웃 그대로</title>
<style>
:root{
  --bg:#f7f4f4;
  --card:#ffffff;
  --primary:#e06d6d;
  --border:#e6d8d8;
  --text:#2b2b2b;
  --muted:#a79d9d;
  --teaser1:#2C2F5B;
  --teaser2:#4A3B77;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,sans-serif;
  max-width:600px;
  margin:0 auto;
  padding:0 12px 90px;
  -webkit-font-smoothing:antialiased;
}
.header{
  padding:18px 4px 10px;
  display:flex; justify-content:space-between; align-items:center;
}
.header h1{font-size:18px; margin:0; font-weight:800; letter-spacing:-0.5px}
.header span{font-size:11px; color:var(--muted); background:#fff; border:1px solid var(--border); padding:4px 8px; border-radius:20px}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 1px 2px rgba(0,0,0,0.03);
}
.main-tab-bar{
  display:flex;
  gap:6px;
  overflow-x:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:6px;
  margin:10px 0 12px;
  position:sticky;
  top:0;
  z-index:20;
}
.main-tab-bar::-webkit-scrollbar{display:none}
.main-tab-btn{
  flex:0 0 auto;
  border:1px solid transparent;
  background:#faf7f7;
  border-radius:8px;
  padding:8px 12px;
  font-size:13px;
  font-weight:700;
  color:#8a7e7e;
  cursor:pointer;
}
.main-tab-btn.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}
#tab-btn-account, #tab-btn-lotto, #tab-btn-health, #tab-btn-bucket{display:none !important;}
.tab-panel[data-tab="account"], .tab-panel[data-tab="lotto"], .tab-panel[data-tab="health"], .tab-panel[data-tab="bucket"]{display:none !important;}

.fortune-teaser{
  background:linear-gradient(135deg,var(--teaser1) 0%,var(--teaser2) 100%);
  color:#fff;
  border-radius:12px;
  padding:14px 14px 14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  margin-bottom:12px;
  position:relative;
  overflow:hidden;
}
.fortune-teaser::after{
  content:'';
  position:absolute;
  right:-20px; top:-20px;
  width:120px; height:120px;
  background:radial-gradient(circle,rgba(255,255,255,0.18),transparent 70%);
}
.fortune-teaser .left{display:flex; gap:10px; align-items:center; position:relative; z-index:1}
.fortune-teaser .icon{width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center; font-size:18px}
.fortune-teaser .tit{font-size:13px; font-weight:800; line-height:1.2}
.fortune-teaser .sub{font-size:11px; opacity:0.85; margin-top:2px}
.fortune-teaser .arrow{position:relative; z-index:1; font-size:18px; opacity:0.9}

.calendar-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px}
.calendar-head b{font-size:15px}
.calendar-head button{border:1px solid var(--border); background:#fff; border-radius:8px; padding:4px 10px; cursor:pointer}
.calendar-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center}
.cal-week{font-size:11px; color:var(--muted); padding:4px 0}
.cal-day{
  position:relative;
  background:#fcf9f9;
  border:1px solid #f1e6e6;
  border-radius:8px;
  aspect-ratio:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:13px; cursor:pointer;
}
.cal-day.today{border-color:var(--primary); color:var(--primary); font-weight:800; background:#fff}
.cal-day.selected{background:var(--primary); color:#fff; border-color:var(--primary)}
.cal-day.has-diary::before{content:''; width:4px; height:4px; background:var(--primary); border-radius:50%; position:absolute; bottom:5px; left:50%; transform:translateX(-50%)}
.cal-day.has-photo::after{
  content:'';
  position:absolute;
  top:0; right:0;
  width:0; height:0;
  border-top:10px solid var(--primary);
  border-left:10px solid transparent;
  border-top-right-radius:8px;
}
.diary-item{padding:10px 0; border-bottom:1px solid #f3e9e9; display:flex; gap:10px; align-items:flex-start}
.diary-item:last-child{border-bottom:0}
.diary-date{font-size:11px; color:var(--primary); font-weight:800; min-width:64px}
.diary-text{font-size:13px; line-height:1.5; white-space:pre-wrap}
.photo-badge{font-size:10px; background:#fff0f0; color:var(--primary); border:1px solid #f5d5d5; padding:2px 6px; border-radius:10px; margin-left:4px}
.input, .textarea, .select{
  width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; background:#fff;
}
.textarea{min-height:90px; resize:vertical}
.btn{border:0; border-radius:10px; padding:10px 14px; font-size:13px; font-weight:800; cursor:pointer}
.btn-primary{background:var(--primary); color:#fff}
.btn-ghost{background:#fff; border:1px solid var(--border); color:#7a6f6f}
.pill{display:inline-block; padding:4px 8px; border-radius:20px; font-size:11px; border:1px solid var(--border); background:#fff}
.saju-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px}
.pillar{border:1px solid var(--border); border-radius:10px; padding:8px; text-align:center; background:#fdfbfb}
.pillar .label{font-size:10px; color:var(--muted)}
.pillar .hanja{font-size:18px; font-weight:800; margin:4px 0}
.pillar .elem{font-size:11px}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:100; padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff; border-radius:14px; max-width:520px; width:100%; max-height:82vh; overflow:auto; border:1px solid var(--border); padding:16px}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="header"><h1>V195 1호 · 다이어리+나의사주</h1><span>원본 레이아웃 100%</span></div>

<div class="fortune-teaser" id="fortuneTeaser">
  <div class="left">
    <div class="icon">🔮</div>
    <div><div class="tit">오늘의 운세 · 사주 보기 복구됨</div><div class="sub" id="teaserSub">생년월일을 설정하면 운세가 표시됩니다</div></div>
  </div>
  <div class="arrow">›</div>
</div>

<div class="main-tab-bar">
  <button class="main-tab-btn active" data-tab="diary">다이어리</button>
  <button class="main-tab-btn" data-tab="saju">나의사주</button>
  <button class="main-tab-btn" id="tab-btn-account" data-tab="account">가계부</button>
  <button class="main-tab-btn" id="tab-btn-lotto" data-tab="lotto">로또</button>
  <button class="main-tab-btn" id="tab-btn-health" data-tab="health">건강</button>
  <button class="main-tab-btn" id="tab-btn-bucket" data-tab="bucket">버킷</button>
</div>

<div class="tab-panel" data-tab="diary" id="panel-diary">
  <div class="card">
    <div class="calendar-head"><button id="prevMonth">‹</button><b id="calTitle"></b><button id="nextMonth">›</button></div>
    <div class="calendar-grid" id="weekRow"></div>
    <div class="calendar-grid" id="calGrid"></div>
  </div>
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px"><b style="font-size:14px">다이어리 기록</b><span class="pill" id="selDateLabel">날짜 선택</span></div>
    <input class="input" id="diaryDate" type="date"/>
    <div style="height:8px"></div>
    <textarea class="textarea" id="diaryText" placeholder="오늘의 기록을 남겨보세요..."></textarea>
    <div style="height:8px"></div>
    <div style="display:flex; gap:8px">
      <input type="file" id="diaryPhoto" accept="image/*" style="display:none"/>
      <button class="btn btn-ghost" id="btnPhoto">📷 사진</button>
      <button class="btn btn-primary" id="btnSaveDiary" style="flex:1">저장하기</button>
    </div>
    <div id="photoPreview" style="margin-top:8px"></div>
  </div>
  <div class="card" id="diaryListCard"><b style="font-size:14px">리스트 / 갤러리</b><div id="diaryList" style="margin-top:8px"></div></div>
</div>

<div class="tab-panel hidden" data-tab="saju" id="panel-saju">
  <div class="card">
    <b style="font-size:14px">설정 - 생년월일 입력</b>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px">
      <input class="input" type="date" id="birthDate"/>
      <input class="input" type="time" id="birthTime" value="12:00"/>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px">
      <select class="select" id="birthGender"><option value="male">남성</option><option value="female">여성</option></select>
      <button class="btn btn-primary" id="btnSaveBirth">사주 보기</button>
    </div>
  </div>
  <div class="card" id="sajuResultCard">
    <b style="font-size:14px">사주 4주</b>
    <div class="saju-grid" id="pillars"></div>
    <div id="strengthBox" style="margin-top:12px; font-size:13px; line-height:1.6"></div>
    <div style="margin-top:10px"><button class="btn btn-ghost" id="btnDetailSaju">상세 해석 보기</button></div>
  </div>
  <div class="card"><b style="font-size:14px">오늘의 운세</b><div id="todayFortune" style="margin-top:8px; font-size:13px; line-height:1.7; white-space:pre-wrap">생년월일을 입력하면 표시됩니다.</div></div>
</div>

<!-- DOM 유지용 숨김 패널들 -->
<div class="tab-panel" data-tab="account" id="panel-account"><div class="card">가계부 원본 DOM 유지 (display:none)</div></div>
<div class="tab-panel" data-tab="lotto" id="panel-lotto"><div class="card">로또 원본 DOM 유지 (display:none)</div></div>
<div class="tab-panel" data-tab="health" id="panel-health"><div class="card">건강 원본 DOM 유지 (display:none)</div></div>
<div class="tab-panel" data-tab="bucket" id="panel-bucket"><div class="card">버킷 원본 DOM 유지 (display:none)</div></div>

<div class="modal-bg" id="sajuPopup"><div class="modal"><div style="display:flex; justify-content:space-between; align-items:center"><b>오늘의 운세</b><button class="btn btn-ghost" onclick="closePopup('sajuPopup')">닫기</button></div><div id="popupFortune" style="margin-top:12px; font-size:13px; line-height:1.7; white-space:pre-wrap"></div></div></div>
<div class="modal-bg" id="sajuModal"><div class="modal"><div style="display:flex; justify-content:space-between; align-items:center"><b>사주 상세</b><button class="btn btn-ghost" onclick="closePopup('sajuModal')">닫기</button></div><div id="sajuDetailContent" style="margin-top:12px; font-size:13px; line-height:1.8; white-space:pre-wrap"></div></div></div>

<script>
const CACHE_NAME = 'smartdiary-V195-1-DIARY-SAJU';
const STORAGE_DIARY = 'smartDiaryList';
const STORAGE_BIRTH = 'sajuBirth_V195_1';

const GAN = ['갑','을','병','정','무','기','경','신','임','계'];
const ZHI = ['자','축','인','묘','진','사','오','미','신','유','술','해'];
const GAN_ELEM = { '갑':'목','을':'목','병':'화','정':'화','무':'토','기':'토','경':'금','신':'금','임':'수','계':'수' };
const ZHI_ELEM = { '자':'수','축':'토','인':'목','묘':'목','진':'토','사':'화','오':'화','미':'토','신':'금','유':'금','술':'토','해':'수' };
const TEN_GOD_MAP = {
  '목':{'목':'비견','화':'식신','토':'재성','금':'관성','수':'인성'},
  '화':{'화':'비견','토':'식신','금':'재성','수':'관성','목':'인성'},
  '토':{'토':'비견','금':'식신','수':'재성','목':'관성','화':'인성'},
  '금':{'금':'비견','수':'식신','목':'재성','화':'관성','토':'인성'},
  '수':{'수':'비견','목':'식신','화':'재성','토':'관성','금':'인성'}
};

function getPillars(y,m,d,h){
  const baseYear = 1984;
  let yearGanIdx = (y - baseYear) % 10; if(yearGanIdx<0) yearGanIdx+=10;
  let yearZhiIdx = (y - baseYear) % 12; if(yearZhiIdx<0) yearZhiIdx+=12;
  let monthGanIdx = (yearGanIdx*2 + m) % 10;
  let monthZhiIdx = (m+1) % 12;
  let dayGanIdx = (d + y) % 10;
  let dayZhiIdx = (d + m) % 12;
  let hourZhiIdx = Math.floor(((h+1)%24)/2);
  let hourGanIdx = (dayGanIdx*2 + hourZhiIdx) % 10;
  return [
    {gan:GAN[yearGanIdx], zhi:ZHI[yearZhiIdx]},
    {gan:GAN[monthGanIdx], zhi:ZHI[monthZhiIdx]},
    {gan:GAN[dayGanIdx], zhi:ZHI[dayZhiIdx]},
    {gan:GAN[hourGanIdx], zhi:ZHI[hourZhiIdx]}
  ];
}
function getTenGod(dayElem, targetElem){
  const m = TEN_GOD_MAP[dayElem] || {};
  return m[targetElem] || '비견';
}
function judgeStrength(pillars){
  const dayElem = GAN_ELEM[pillars[2].gan];
  let count = 0;
  pillars.forEach(p=>{ if(GAN_ELEM[p.gan]===dayElem) count++; if(ZHI_ELEM[p.zhi]===dayElem) count++; });
  if(count>=3) return {label:'신강', desc:'주체성이 강하고 추진력이 좋습니다. 재성과 관성을 적절히 쓰면 안정됩니다.'};
  if(count===2) return {label:'중화', desc:'균형이 잘 잡힌 사주입니다. 흐름을 타면 성과가 좋습니다.'};
  return {label:'신약', desc:'인성과 비견의 도움이 필요. 주변 협력과 학습이 운을 높입니다.'};
}
function buildFortuneText(birth){
  if(!birth) return '생년월일을 설정하면 오늘의 운세와 사주 4주를 볼 수 있습니다.';
  const d = new Date();
  const luck = ['재물운 상승','만남운','결정하기 좋은 날','마무리와 정리에 길','새로운 시도가 길'];
  const idx = (d.getDate() + birth.y) % luck.length;
  return '[오늘의 총운]\n' + luck[idx] + '입니다. 다이어리에 기록한 흐름과 연결해 하루를 설계해보세요.\n\n[재물]\n작은 지출을 점검하면 흐름이 좋아집니다.\n[애정]\n대화로 오해를 풀기 좋은 날.\n[건강]\n수분 섭취와 가벼운 스트레칭을 권합니다.';
}

let diaries = [];
try{ diaries = JSON.parse(localStorage.getItem(STORAGE_DIARY)||'[]'); }catch(e){ diaries=[]; }
let curYear, curMonth;
(function initCal(){ const n=new Date(); curYear=n.getFullYear(); curMonth=n.getMonth(); })();
let selectedDateStr = new Date().toISOString().slice(0,10);
let pendingPhotoData = '';

function renderCalendar(){
  const title = document.getElementById('calTitle');
  const grid = document.getElementById('calGrid');
  const weekRow = document.getElementById('weekRow');
  if(!title||!grid) return;
  title.textContent = curYear + '년 ' + (curMonth+1) + '월';
  weekRow.innerHTML = ['일','월','화','수','목','금','토'].map(w=>'<div class="cal-week">'+w+'</div>').join('');
  const firstDay = new Date(curYear, curMonth, 1).getDay();
  const lastDate = new Date(curYear, curMonth+1, 0).getDate();
  let html = '';
  for(let i=0;i<firstDay;i++) html += '<div></div>';
  for(let d=1; d<=lastDate; d++){
    const iso = new Date(curYear, curMonth, d).toISOString().slice(0,10);
    const dayDiaries = diaries.filter(x=>x.date===iso);
    const hasDiary = dayDiaries.length>0;
    const hasPhoto = dayDiaries.some(x=>x.photo);
    const isToday = iso===new Date().toISOString().slice(0,10);
    const isSelected = iso===selectedDateStr;
    let cls = 'cal-day';
    if(isToday) cls+=' today';
    if(isSelected) cls+=' selected';
    if(hasDiary) cls+=' has-diary';
    if(hasPhoto) cls+=' has-photo';
    html += '<div class="'+cls+'" data-date="'+iso+'">'+d+'</div>';
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.cal-day').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedDateStr = el.getAttribute('data-date');
      const dateInput = document.getElementById('diaryDate');
      if(dateInput) dateInput.value = selectedDateStr;
      const label = document.getElementById('selDateLabel');
      if(label) label.textContent = selectedDateStr;
      renderCalendar();
      renderDiaries();
    });
  });
}
function renderDiaries(){
  const list = document.getElementById('diaryList');
  if(!list) return;
  const filtered = selectedDateStr ? diaries.filter(d=>d.date===selectedDateStr) : diaries.slice(-20).reverse();
  const source = selectedDateStr ? filtered : diaries.slice().reverse().slice(0,20);
  if(source.length===0){ list.innerHTML = '<div style="font-size:12px; color:#a79d9d; padding:12px 0">기록이 없습니다. 위에서 작성해보세요.</div>'; return; }
  list.innerHTML = source.map(item=>{
    const photoTag = item.photo ? '<span class="photo-badge">사진</span>' : '';
    const img = item.photo ? '<div style="margin-top:6px"><img src="'+item.photo+'" style="width:100%; border-radius:10px; border:1px solid #f1e6e6; max-height:220px; object-fit:cover"/></div>' : '';
    return '<div class="diary-item"><div class="diary-date">'+item.date+photoTag+'</div><div class="diary-text">'+escapeHtml(item.text)+img+'</div></div>';
  }).join('');
}
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function compressImage(file, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxW = 800;
      let w = img.width, h = img.height;
      if(w>maxW){ h = h*maxW/w; w = maxW; }
      canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      const data = canvas.toDataURL('image/jpeg',0.7);
      cb(data);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function manualSaveDiary(){
  const dateInput = document.getElementById('diaryDate');
  const textInput = document.getElementById('diaryText');
  const date = dateInput && dateInput.value ? dateInput.value : selectedDateStr;
  const text = textInput ? textInput.value.trim() : '';
  if(!date){ alert('날짜를 선택하세요'); return; }
  if(!text && !pendingPhotoData){ alert('내용이나 사진을 입력하세요'); return; }
  const entry = {id: Date.now(), date:date, text:text, photo: pendingPhotoData||''};
  diaries.push(entry);
  localStorage.setItem(STORAGE_DIARY, JSON.stringify(diaries));
  if(textInput) textInput.value='';
  pendingPhotoData='';
  const pv = document.getElementById('photoPreview'); if(pv) pv.innerHTML='';
  renderCalendar();
  renderDiaries();
}

function renderSaju(){
  let birth = null;
  try{ birth = JSON.parse(localStorage.getItem(STORAGE_BIRTH)||'null'); }catch(e){}
  const pillarsEl = document.getElementById('pillars');
  const strengthEl = document.getElementById('strengthBox');
  const todayEl = document.getElementById('todayFortune');
  const teaserSub = document.getElementById('teaserSub');
  if(!birth){ if(pillarsEl) pillarsEl.innerHTML='<div style="font-size:12px; color:#a79d9d">생년월일 입력 필요</div>'; if(strengthEl) strengthEl.textContent=''; if(todayEl) todayEl.textContent=buildFortuneText(null); return; }
  const y = parseInt(birth.date.slice(0,4)), m = parseInt(birth.date.slice(5,7)), d = parseInt(birth.date.slice(8,10)), h = parseInt((birth.time||'12:00').split(':')[0]);
  const pillars = getPillars(y,m,d,h);
  const labels = ['년주','월주','일주','시주'];
  if(pillarsEl){
    pillarsEl.innerHTML = pillars.map((p,i)=>{
      const elem = GAN_ELEM[p.gan];
      return '<div class="pillar"><div class="label">'+labels[i]+'</div><div class="hanja">'+p.gan+p.zhi+'</div><div class="elem">'+elem+' / '+getTenGod(GAN_ELEM[pillars[2].gan], elem)+'</div><div style="font-size:10px; color:#a79d9d; margin-top:2px">'+ZHI_ELEM[p.zhi]+'</div></div>';
    }).join('');
  }
  const strength = judgeStrength(pillars);
  if(strengthEl) strengthEl.innerHTML = '<b>일간 '+GAN_ELEM[pillars[2].gan]+' · '+strength.label+'</b><div style="margin-top:4px; color:#6b5f5f">'+strength.desc+'</div>';
  if(todayEl) todayEl.textContent = buildFortuneText({y:y});
  if(teaserSub) teaserSub.textContent = y+'년생 · '+strength.label+' · 오늘 운세 확인';
  window.__lastPillars = pillars;
  window.__lastStrength = strength;
  window.__lastBirth = birth;
}
function openPopup(id){ const el=document.getElementById(id); if(el) el.classList.add('open'); }
function closePopup(id){ const el=document.getElementById(id); if(el) el.classList.remove('open'); }
function openSajuDetail(){
  let birth = null; try{ birth = JSON.parse(localStorage.getItem(STORAGE_BIRTH)||'null'); }catch(e){}
  if(!birth){ alert('생년월일을 먼저 저장하세요'); return; }
  const pillars = window.__lastPillars; const strength = window.__lastStrength;
  const content = document.getElementById('sajuDetailContent');
  if(content && pillars){
    const dayElem = GAN_ELEM[pillars[2].gan];
    let txt = '[사주 상세 해석]\n';
    txt += '생년월일: '+birth.date+' '+birth.time+' ('+birth.gender+')\n';
    txt += '일간: '+pillars[2].gan+'('+dayElem+')\n';
    txt += '신강/신약: '+strength.label+'\n\n';
    txt += '[십성 해석]\n';
    pillars.forEach((p,i)=>{
      const l=['년주','월주','일주','시주'][i];
      const ten = getTenGod(dayElem, GAN_ELEM[p.gan]);
      txt += l+': '+p.gan+p.zhi+' - 천간 '+ten+' / 지지 '+ZHI_ELEM[p.zhi]+'\n';
    });
    txt += '\n[조언]\n'+strength.desc+'\n다이어리 기록을 통해 운의 흐름을 확인해보세요.';
    content.textContent = txt;
  }
  openPopup('sajuModal');
}

document.addEventListener('DOMContentLoaded', function(){
  const dateInput = document.getElementById('diaryDate');
  if(dateInput){ dateInput.value = selectedDateStr; }
  const selLabel = document.getElementById('selDateLabel'); if(selLabel) selLabel.textContent = selectedDateStr;
  renderCalendar(); renderDiaries(); renderSaju();
  document.getElementById('prevMonth').addEventListener('click', function(){ curMonth--; if(curMonth<0){curMonth=11; curYear--;} renderCalendar(); });
  document.getElementById('nextMonth').addEventListener('click', function(){ curMonth++; if(curMonth>11){curMonth=0; curYear++;} renderCalendar(); });
  document.getElementById('btnSaveDiary').addEventListener('click', manualSaveDiary);
  document.getElementById('btnPhoto').addEventListener('click', function(){ document.getElementById('diaryPhoto').click(); });
  document.getElementById('diaryPhoto').addEventListener('change', function(e){
    const file = e.target.files[0]; if(!file) return;
    compressImage(file, function(data){
      pendingPhotoData = data;
      const pv = document.getElementById('photoPreview');
      if(pv) pv.innerHTML = '<img src="'+data+'" style="width:100%; border-radius:10px; max-height:200px; object-fit:cover; border:1px solid #f1e6e6"/><div style="font-size:11px; color:#a79d9d; margin-top:4px">사진 첨부됨 · 세모표시는 달력에 표시</div>';
    });
  });
  document.getElementById('btnSaveBirth').addEventListener('click', function(){
    const d = document.getElementById('birthDate').value;
    const t = document.getElementById('birthTime').value;
    const g = document.getElementById('birthGender').value;
    if(!d){ alert('생년월일을 입력하세요'); return; }
    localStorage.setItem(STORAGE_BIRTH, JSON.stringify({date:d, time:t, gender:g}));
    renderSaju();
  });
  document.getElementById('fortuneTeaser').addEventListener('click', function(){
    let birth=null; try{birth=JSON.parse(localStorage.getItem(STORAGE_BIRTH)||'null');}catch(e){}
    const pf = document.getElementById('popupFortune');
    if(pf) pf.textContent = buildFortuneText(birth?{y:parseInt(birth.date.slice(0,4))}:null) + "\n\n(클릭으로 닫기)";
    openPopup('sajuPopup');
  });
  document.getElementById('btnDetailSaju').addEventListener('click', openSajuDetail);
  document.querySelectorAll('.main-tab-btn').forEach(btn=>{
    btn.addEventListener('click', function(){
      const tab = btn.getAttribute('data-tab');
      if(['account','lotto','health','bucket'].includes(tab)) return;
      document.querySelectorAll('.main-tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-panel').forEach(p=>{
        const isTarget = p.getAttribute('data-tab')===tab;
        if(['account','lotto','health','bucket'].includes(p.getAttribute('data-tab'))){
          p.style.display='none';
        } else {
          p.classList.toggle('hidden', !isTarget);
        }
      });
    });
  });
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_BIRTH)||'null');
    if(saved){
      const bd=document.getElementById('birthDate'); if(bd) bd.value=saved.date;
      const bt=document.getElementById('birthTime'); if(bt) bt.value=saved.time;
      const bg=document.getElementById('birthGender'); if(bg) bg.value=saved.gender;
    }
  }catch(e){}
});
</script>
</body>
</html>
