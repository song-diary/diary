<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다이어리 & 가계부</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f6fa;
            --text-color: #333;
            --border-color: #dcdde1;
            --income-color: #27ae60;
            --expense-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .tab-menu {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #7f8c8d;
            padding: 5px 15px;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* 폼 스타일 */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button.submit-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.submit-btn:hover {
            background-color: #357abd;
        }

        /* 리스트 스타일 */
        .list-container {
            margin-top: 20px;
        }

        .item-card {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .item-date {
            font-size: 12px;
            color: #7f8c8d;
        }

        .item-category {
            font-size: 13px;
            font-weight: bold;
            color: #2980b9;
        }

        .item-memo {
            font-size: 14px;
            color: #2c3e50;
        }

        .item-amount {
            font-size: 16px;
            font-weight: bold;
        }

        .amount-income {
            color: var(--income-color);
        }

        .amount-expense {
            color: var(--expense-color);
        }

        /* 통계 화면 스타일 */
        .stat-summary {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .stat-category-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.1s;
        }

        .stat-category-item:hover {
            background: #f1f2f6;
        }

        .back-btn {
            background: #7f8c8d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>다이어리 & 가계부</h2>

    <!-- 탭 메뉴 -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('diary')">일기</button>
        <button class="tab-btn" onclick="switchTab('account')">가계부 입력</button>
        <button class="tab-btn" onclick="switchTab('stats')">통계</button>
    </div>

    <!-- 1. 일기 섹션 -->
    <div id="diary-section" class="section active">
        <div class="form-group">
            <label>날짜</label>
            <input type="date" id="diary-date">
        </div>
        <div class="form-group">
            <label>내용</label>
            <textarea id="diary-content" placeholder="오늘의 기록을 남겨보세요."></textarea>
        </div>
        <button class="submit-btn" onclick="saveDiary()">일기 저장</button>
        
        <div class="list-container" id="diary-list"></div>
    </div>

    <!-- 2. 가계부 입력 섹션 -->
    <div id="account-section" class="section">
        <div class="form-group">
            <label>분류</label>
            <select id="acc-type" onchange="updateCategories()">
                <option value="income">수입</option>
                <option value="expense">지출</option>
            </select>
        </div>
        <div class="form-group">
            <label>날짜</label>
            <input type="date" id="acc-date">
        </div>
        <div class="form-group">
            <label>계정과목</label>
            <select id="acc-category"></select>
        </div>
        <div class="form-group">
            <label>금액 (원)</label>
            <input type="number" id="acc-amount" placeholder="금액을 입력하세요">
        </div>
        <div class="form-group">
            <label>내용 / 메모</label>
            <input type="text" id="acc-memo" placeholder="사용처 또는 적요">
        </div>
        <button class="submit-btn" onclick="saveAccount()">가계부 저장</button>

        <div class="list-container" id="account-list"></div>
    </div>

    <!-- 3. 통계 섹션 -->
    <div id="stats-section" class="section">
        <div class="tab-menu" style="margin-bottom: 10px;">
            <button class="tab-btn active" id="stat-tab-income" onclick="switchStatType('income')">수입 통계</button>
            <button class="tab-btn" id="stat-tab-expense" onclick="switchStatType('expense')">지출 통계</button>
        </div>
        
        <div id="stat-content">
            <!-- 동적 통계 및 상세 리스트 영역 -->
        </div>
    </div>
</div>

<script>
    // 데이터 저장용 배열
    let diaries = JSON.parse(localStorage.getItem('diaries')) || [];
    let accounts = JSON.parse(localStorage.getItem('accounts')) || [];

    // 카테고리 정의
    const categories = {
        income: ['급여', '용돈', '사업수입', '금융/투자', '기타수입'],
        expense: ['식비', '교통비', '주거/통신', '쇼핑', '문화/여가', '기타지출']
    };

    let currentStatType = 'income';
    let selectedCategoryFilter = null;

    // 초기 실행
    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('diary-date').value = today;
        document.getElementById('acc-date').value = today;
        updateCategories();
        renderDiaries();
        renderAccounts();
        renderStats();
    };

    // 탭 전환
    function switchTab(tabName) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

        if(tabName === 'diary') {
            document.getElementById('diary-section').classList.add('active');
            event.target.classList.add('active');
        } else if(tabName === 'account') {
            document.getElementById('account-section').classList.add('active');
            event.target.classList.add('active');
            renderAccounts();
        } else if(tabName === 'stats') {
            document.getElementById('stats-section').classList.add('active');
            event.target.classList.add('active');
            selectedCategoryFilter = null; // 통계 탭 올 때 필터 초기화
            renderStats();
        }
    }

    // 가계부 타입 변경에 따른 계정과목 셀렉트박스 업데이트
    function updateCategories() {
        const type = document.getElementById('acc-type').value;
        const catSelect = document.getElementById('acc-category');
        catSelect.innerHTML = '';
        
        categories[type].forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            catSelect.appendChild(opt);
        });
    }

    // 일기 저장
    function saveDiary() {
        const date = document.getElementById('diary-date').value;
        const content = document.getElementById('diary-content').value;

        if(!content.trim()) {
            alert('내용을 입력해주세요.');
            return;
        }

        diaries.push({ id: Date.now(), date, content });
        localStorage.setItem('diaries', JSON.stringify(diaries));
        document.getElementById('diary-content').value = '';
        renderDiaries();
    }

    // 일기 렌더링
    function renderDiaries() {
        const list = document.getElementById('diary-list');
        list.innerHTML = '';
        
        diaries.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(item => {
            list.innerHTML += `
                <div class="item-card">
                    <div class="item-info">
                        <span class="item-date">${item.date}</span>
                        <span class="item-memo">${item.content}</span>
                    </div>
                </div>
            `;
        });
    }

    // 가계부 저장
    function saveAccount() {
        const type = document.getElementById('acc-type').value;
        const date = document.getElementById('acc-date').value;
        const category = document.getElementById('acc-category').value;
        const amount = Number(document.getElementById('acc-amount').value);
        const memo = document.getElementById('acc-memo').value;

        if(!amount) {
            alert('금액을 입력해주세요.');
            return;
        }

        accounts.push({ id: Date.now(), type, date, category, amount, memo });
        localStorage.setItem('accounts', JSON.stringify(accounts));
        
        document.getElementById('acc-amount').value = '';
        document.getElementById('acc-memo').value = '';
        renderAccounts();
    }

    // 가계부 내역 렌더링
    function renderAccounts() {
        const list = document.getElementById('account-list');
        list.innerHTML = '';

        accounts.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(item => {
            const amountClass = item.type === 'income' ? 'amount-income' : 'amount-expense';
            const sign = item.type === 'income' ? '+' : '-';
            
            list.innerHTML += `
                <div class="item-card">
                    <div class="item-info">
                        <span class="item-date">${item.date}</span>
                        <span class="item-category">[${item.category}] ${item.memo || ''}</span>
                    </div>
                    <div class="item-amount ${amountClass}">${sign}${item.amount.toLocaleString()}원</div>
                </div>
            `;
        });
    }

    // 통계 타입 전환 (수입/지출)
    function switchStatType(type) {
        currentStatType = type;
        selectedCategoryFilter = null; // 타입 바꾸면 필터 초기화
        document.getElementById('stat-tab-income').classList.toggle('active', type === 'income');
        document.getElementById('stat-tab-expense').classList.toggle('active', type === 'expense');
        renderStats();
    }

    // 통계 화면 렌더링 (계정과목 클릭 시 과목명 반복 제거 적용)
    function renderStats() {
        const container = document.getElementById('stat-content');
        container.innerHTML = '';

        // 필터링된 상태 (특정 계정과목을 누른 경우)
        if (selectedCategoryFilter) {
            const filteredItems = accounts.filter(item => item.type === currentStatType && item.category === selectedCategoryFilter);
            const totalAmount = filteredItems.reduce((sum, item) => sum + item.amount, 0);
            const typeLabel = currentStatType === 'income' ? '수입' : '지출';

            let html = `
                <button class="back-btn" onclick="selectedCategoryFilter = null; renderStats();">← 통계 목록으로</button>
                <div class="stat-summary">
                    <h3>${selectedCategoryFilter} 상세 내역</h3>
                    <p style="font-size: 18px; font-weight: bold; margin-top: 5px; color: ${currentStatType === 'income' ? 'var(--income-color)' : 'var(--expense-color)'};">
                        총 ${totalAmount.toLocaleString()}원
                    </p>
                </div>
                <div class="list-container">
            `;

            if (filteredItems.length === 0) {
                html += `<p style="text-align:center; color:#7f8c8d; padding:20px;">해당 내역이 없습니다.</p>`;
            } else {
                filteredItems.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(item => {
                    const amountClass = item.type === 'income' ? 'amount-income' : 'amount-expense';
                    const sign = item.type === 'income' ? '+' : '-';
                    
                    // 핵심 수정 부분: 이미 상단에 과목명이 명시되어 있으므로 개별 리스트에서는 과목명을 반복 출력하지 않고 날짜와 메모/내용 위주로 깔끔하게 출력
                    html += `
                        <div class="item-card">
                            <div class="item-info">
                                <span class="item-date">${item.date}</span>
                                <span class="item-memo" style="font-weight: 500;">${item.memo || '내용 없음'}</span>
                            </div>
                            <div class="item-amount ${amountClass}">${sign}${item.amount.toLocaleString()}원</div>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            container.innerHTML = html;
            return;
        }

        // 기본 통계 목록 화면 (계정과목별 집계)
        const targetAccounts = accounts.filter(item => item.type === currentStatType);
        const grandTotal = targetAccounts.reduce((sum, item) => sum + item.amount, 0);

        // 과목별 합계 계산
        const summary = {};
        categories[currentStatType].forEach(cat => summary[cat] = 0);
        targetAccounts.forEach(item => {
            if (summary[item.category] !== undefined) {
                summary[item.category] += item.amount;
            } else {
                summary[item.category] = item.amount;
            }
        });

        let html = `
            <div class="stat-summary">
                <h3>전체 ${currentStatType === 'income' ? '수입' : '지출'} 현황</h3>
                <p style="font-size: 20px; font-weight: bold; margin-top: 5px; color: #2c3e50;">${grandTotal.toLocaleString()}원</p>
            </div>
            <div style="background: #fff; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden;">
        `;

        for (const [cat, amt] of Object.entries(summary)) {
            html += `
                <div class="stat-category-item" onclick="selectedCategoryFilter = '${cat}'; renderStats();">
                    <span style="font-weight: 600; color: #2980b9;">${cat}</span>
                    <span style="font-weight: bold;">${amt.toLocaleString()}원 &gt;</span>
                </div>
            `;
        }
        html += `</div>`;
        container.innerHTML = html;
    }
</script>

</body>
</html>
