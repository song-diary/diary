<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"><title>다이어리&가계부 V195 SINGLE - 원본정리 (코드클린)</title>
<style>
        :root {
            --bg-color: #f7f4f4;
            --card-bg: #ffffff;
            --primary-color: #e06d6d;
            --primary-hover: #cc5c5c;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border-color: #e6d8d8;
            --accent-today: #e74c3c;
            --sun-color: #d93838;
            --sat-color: #1b6ca8;
            --weekday-color: #34495e;
            --income-color: #27ae60;
            --expense-color: #c0392b;
            --memo-color: #8e44ad;
            --base-font-size: 16px;
            --memo-font-size: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        html {
            overscroll-behavior-y: contain;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            touch-action: pan-x pan-y;
            font-size: var(--base-font-size);
            overscroll-behavior-y: contain;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.04);
        }

        /* 메인 탭 바 (설정/다이어리/가계부) */
        .main-tab-bar {
            display: flex;
            gap: 6px;
            padding: 6px 8px;
        }

        .main-tab-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 4px;
            font-size: calc(var(--base-font-size) - 3px);
            font-weight: bold;
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: all 0.15s ease;
        }

        .main-tab-btn .tab-icon {
            font-size: calc(var(--base-font-size) - 1px);
            line-height: 1;
        }

        .main-tab-btn.settings-tab-btn {
            flex: 0 0 40px;
        }

        .main-tab-btn.health-tab-btn {
            flex: 0 0 40px;
            background: #fdf0f2;
            border-color: #f3c6cd;
        }
        .main-tab-btn.health-tab-btn .tab-icon { font-size: calc(var(--base-font-size) + 1px); }

        .main-tab-btn.input-tab-btn {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }

        .main-tab-btn.input-tab-btn:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            color: #fff;
        }

        .main-tab-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }

        .main-tab-btn:hover:not(.active) {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .action-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: calc(var(--base-font-size) - 1px);
            font-weight: bold;
        }

        .action-btn:hover {
            background: var(--primary-hover);
        }

        /* 설정 카드 (팝업 폼) */
        #settings-card {
            background: #fff8f8;
            border: 2px solid var(--primary-color);
            animation: fadeIn 0.3s ease;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* 카드명세 일괄입력 카드 (팝업 폼) */
        #card-statement-card {
            background: #fff;
            border: 2px solid var(--primary-color);
            animation: fadeIn 0.3s ease;
            width: min(500px, 92vw);
            max-height: min(600px, 85vh);
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 12px;
            padding: 16px;
            box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* ⏳ 카드 대기 지출 정산 카드 (팝업 폼) */
        #card-pending-card {
            background: #fff;
            border: 2px solid #f39c12;
            animation: fadeIn 0.3s ease;
            width: min(500px, 92vw);
            max-height: min(600px, 85vh);
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 12px;
            padding: 16px;
            box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            overscroll-behavior: contain;
        }

        /* 💼 잔액 보관처별 분류 / 이월액 카드 (팝업 폼) */
        #balance-location-card {
            background: #fff;
            border: 2px solid #2980b9;
            animation: fadeIn 0.3s ease;
            width: min(500px, 92vw);
            max-height: min(600px, 85vh);
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 12px;
            padding: 16px;
            box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            overscroll-behavior: contain;
        }

        .card-pending-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            background: #fffaf1;
            border: 1px solid #f5d9a8;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 6px;
        }

        .card-pending-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .card-pending-row .cp-info {
            flex: 1;
            min-width: 0;
            font-size: 13px;
        }

        .card-pending-row .cp-amount {
            font-weight: bold;
            color: var(--expense-color);
        }

        /* 카드명세 일괄입력 */
        .card-statement-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
            gap: 4px;
            margin-bottom: 6px;
            background: #fbfbfb;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px;
        }

        .card-statement-row .cs-date {
            grid-column: 1 / 2;
            min-width: 0;
        }

        .card-statement-row .cs-category {
            grid-column: 2 / 3;
            min-width: 0;
        }

        .card-statement-row .cs-amount {
            grid-column: 3 / 4;
            min-width: 0;
            text-align: right;
        }

        .card-statement-row .cs-memo {
            grid-column: 1 / 3;
            min-width: 0;
        }

        .card-statement-row .cs-del-btn {
            grid-column: 3 / 4;
            min-width: 0;
        }

        .card-statement-row input, .card-statement-row select {
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .cs-del-btn {
            background: var(--expense-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 9px;
            font-size: 12px;
            cursor: pointer;
        }

        .card-statement-header-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
            gap: 4px;
            padding: 0 6px;
            margin-bottom: 4px;
        }

        .card-statement-header-row span {

        .toggle-slider::before {

    font-size: 9px !important;
}


/* V155 A안: 일자 칸 아래로 25% 늘려서 3줄까지 보이게 */
.cal-cell {
    aspect-ratio: auto !important;
}
.cal-cell-inner {
    justify-content: center !important;
    padding-top: 2px !important;
    padding-bottom: 2px !important;
}
.cal-anniv-label, .cal-special-label {
    -webkit-line-clamp: 3 !important;
    max-height: 38px !important;
}


/* V171 fix main not opening */
#anniv-input::placeholder { color:#bbb !important; opacity:1; }
#anniv-input:focus { outline:none; border-color: var(--primary-color) !important; }
#anniv-input, #textOutput.diary-textarea { font-size:14.5px !important; }


/* V172 - 왼쪽정렬 + 메모 3-4줄 */

#diary-content-section { text-align:left !important; }
#textOutput.diary-textarea {
    min-height: 90px !important; /* 3-4줄 */
    height: auto !important;
    line-height: 1.5 !important;
    padding: 10px 12px !important;
}


/* V179 - 완전 동일 정렬 */


/* V180 FIX 1 - 빈 상태 문구 압축 방지: 항상 전체 너비 */
#diary-around-today-list .empty-state-hint,
#diary-around-today-list.gallery-mode .empty-state-hint {
  grid-column: 1 / -1 !important;
  width: 100% !important;

}

/* V180 FIX 2 - 날짜 폰트 달력과 동일 */
.form-date-row { font-size: var(--base-font-size) !important; }
#form-date-input, #form-date-label, .form-date-label,
#selected-date-title, #selected-date-title div {
  font-size: var(--base-font-size) !important;
}
#selected-date-title div div:first-child {
  font-size: var(--base-font-size) !important; /* dateLabel */
}
/* 달력 셀 폰트와 동일하게 */
.cal-cell { font-size: var(--base-font-size) !important; }
.form-date-row .form-date-label { font-size: var(--base-font-size) !important; }

/* 3. 4버튼 유지 */


/* V187 가로모드 - 달력 크게 */
@media screen and (orientation: landscape) {
  .container { max-width: 95vw !important; width: 95vw !important; }
  #calendar-card { max-width: 100% !important; }
  .cal-cell { min-height: 62px !important; }
}
@media screen and (max-width: 900px) and (orientation: landscape) {

/* V188 자동 전환 애니메이션 */
.container, #calendar-card, .cal-cell { transition: all 0.25s ease !important; }

    function sajuHasConsecutiveRun(numbers, minRun) {
        const sorted = [...numbers].sort((a, b) => a - b);
        let run = 1;
        for (let i = 1; i < sorted.length; i++) {
            if (sorted[i] === sorted[i - 1] + 1) {
                run++;
                if (run >= minRun) return true;
            } else {
                run = 1;
            }
        }
        return false;
    }

            function getSpread(arr){ const s=[...arr].sort((a,b)=>a-b); return s[s.length-1]-s[0]; }
            function seededShuffle(array, seedVal){
                let s=seedVal; 
                const arr=[...array];
                function rng(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }
                for(let i=arr.length-1;i>0;i--){
                    const j=Math.floor(rng()*(i+1));

                return arr;

                if(!hasConsec3(nums) && getSpread(nums)>=20){
                    break;
                }
                attempts++;
            }
            while(nums.length<6){
                const n=available[Math.floor(Math.random()*available.length)];

    function sajuGetMondayOfWeek(dateStr) {
        const d = parseDateObj(dateStr);
        const dow = d.getDay(); // 0=일 ~ 6=토
        const diffToMonday = (dow === 0 ? -6 : 1) - dow;
        const monday = new Date(d);
        monday.setDate(d.getDate() + diffToMonday);
        const mm = String(monday.getMonth() + 1).padStart(2, '0');
        const dd = String(monday.getDate()).padStart(2, '0');
        return \`\${monday.getFullYear()}-\${mm}-\${dd}\`;
    }
    function sajuGetWeeklyLottoStore() {
        const monday = sajuGetMondayOfWeek(getTodayStr());
        let store = null;
        try { store = JSON.parse(localStorage.getItem('smartDiaryWeeklyLotto') || 'null'); } catch (e) {}
        if (!store || store.weekStart !== monday) {
            store = { weekStart: monday, days: {} };
            localStorage.setItem('smartDiaryWeeklyLotto', JSON.stringify(store));
        }
        return store;
    }
    function sajuRecordTodayLottoWeekly(lottoMain) {
        const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
        const dObj = parseDateObj(getTodayStr());
        const dayLabel = dayNames[dObj.getDay()];
        if (dayLabel === '일') return; // 월~토만 기록
        const store = sajuGetWeeklyLottoStore();
        store.days[dayLabel] = lottoMain;
        localStorage.setItem('smartDiaryWeeklyLotto', JSON.stringify(store));
    }

        for(let e in counts){ if(counts[e] < minCount){ minCount = counts[e]; minElem = e; } }

        }
        return { god: minElem, reason: minElem + ' 보충', color: minElem };

    function sajuCheckHapChung(myZhis, todayZhi){
        let result = [];
        myZhis.forEach(myZhi => {
            if(!myZhi) return;
            const key1 = myZhi + todayZhi;
            const key2 = todayZhi + myZhi;
            if(SAJU_HAP[key1] || SAJU_HAP[key2]){
                result.push({ type: '육합', my: myZhi, today: todayZhi, text: myZhi + todayZhi + ' 육합 - 인연이 붙는 날이에요' });
            }
            if(SAJU_CHUNG[key1] || SAJU_CHUNG[key2]){
                result.push({ type: '충', my: myZhi, today: todayZhi, text: myZhi + todayZhi + ' 충 - 변동수, 이동수 있어요' });
            }
        });
        SAJU_SAMHAP.forEach(sam => {
            if(sam.keys.includes(todayZhi)){
                const haveCount = myZhis.filter(z => sam.keys.includes(z)).length;
                if(haveCount >= 1){
                    result.push({ type: '삼합', name: sam.name, elem: sam.elem, text: sam.name + ' - ' + sam.meaning });
                }
            }
        });
        return result;
    }

    function sajuGetEnhancedFortune(){
        if(!sajuPillars || !sajuBirthInfo) return null;
        const todayInfo = sajuGetTodayInfo();
        const dayGan = sajuPillars.day.gan;
        const todayGan = todayInfo.gz[0];
        const todayZhi = todayInfo.gz[1];
        const tenGodGan = sajuGetTenGod(dayGan, todayGan);
        const relation = sajuRelationOf(sajuDayMasterElem, todayInfo.elem);
        const base = SAJU_FORTUNE[relation] || SAJU_FORTUNE['비겁'];
        const strength = sajuJudgeStrength(sajuPillars, sajuDayMasterElem);
        const useful = sajuGetUsefulGod(sajuPillars, sajuDayMasterElem, strength);
        const myZhis = [sajuPillars.year?.zhi, sajuPillars.month?.zhi, sajuPillars.day?.zhi, sajuPillars.hour?.zhi].filter(Boolean);
        const hapChung = sajuCheckHapChung(myZhis, todayZhi);
        let score = base.score;
        if(todayInfo.elem === useful.god) score = Math.min(95, score + 15);
        if(hapChung.some(h => h.type === '육합' || h.type === '삼합')) score = Math.min(96, score + 10);
        if(hapChung.some(h => h.type === '충')) score = Math.max(45, score - 8);
        const luckColor = SAJU_LUCK_COLOR[useful.god] || SAJU_LUCK_COLOR['목'];
        const luckColorHex = SAJU_LUCK_COLOR_HEX[useful.god] || SAJU_LUCK_COLOR_HEX['목'];
        const luckPlace = SAJU_LUCK_PLACE[useful.god] || SAJU_LUCK_PLACE['목'];
        return {
            base, tenGodGan, relation, strength, useful, hapChung,
            score, todayGan, todayZhi,
            luckColor, luckColorHex, luckPlace,
            todayGz: todayInfo.gz,
            dateObj: todayInfo.dateObj
        };

            document.body.style.left = '0';
            document.body.style.right = '0';
            document.body.style.width = '100%';
        }
        modalLockCount++;
    }
    function unlockBodyScroll() {

            document.body.style.width = '';
            window.scrollTo(0, modalLockedScrollY);
        }

    function settleSelectedCardPending() {
        const checkboxes = document.querySelectorAll('#card-pending-list .cp-checkbox:checked');
        if (checkboxes.length === 0) {
            alert('정산할 항목을 선택해주세요.');

        if (!confirm(\`선택한 \${checkboxes.length}건을 오늘(\${getTodayStr()}) 날짜로 정산 처리하시겠습니까?\\n정산 후에는 잔액 계산에 반영됩니다.\`)) return;

        const idsToSettle = new Set(Array.from(checkboxes).map(cb => cb.dataset.id));
        const todayStr = getTodayStr();
        let diaries = getAllDiaries();

        diaries = diaries.map(item => {
            if (idsToSettle.has(item.id) && item.money && item.money.cardPending) {
                return {
                    ...item,
                    date: todayStr,
                    money: {
                        ...item.money,
                        cardPending: false,
                        cardUseDate: item.date
                    }
                };
            }
            return item;
        });

        localStorage.setItem('smartDiaryList', JSON.stringify(diaries));

        renderCalendar();
        updateMoneySummary();
        if (isSearchFilterOpen) filterCustomList();
        renderDiaryAroundToday();
        renderMoneyAroundToday();
        if (isDiarySearchFilterOpen) filterDiaryCustomList();

        renderCardPendingList();
        updateCardStatementVisibility();

    function getTodayStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return \`\${y}-\${m}-\${day}\`;
    }

    function getCurrentTimeStr() {
        const d = new Date();
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return \`\${h}:\${min}\`;
    }

    function normalizeDateStr(dateStr) {
        if (!dateStr) return getTodayStr();
        let clean = String(dateStr).trim().replace(/[./]/g, '-');
        let parts = clean.split('-');
        if (parts.length === 3) {
            let y = parts[0];
            let m = parts[1].padStart(2, '0');
            let d = parts[2].padStart(2, '0');
            return \`\${y}-\${m}-\${d}\`;
        }
        return getTodayStr();
    }

    function parseDateObj(dateStr) {
        let cleanStr = normalizeDateStr(dateStr);
        let parts = cleanStr.split('-');
        return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    }

    function getDayOfWeekStr(dateStr) {
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const dObj = parseDateObj(dateStr);
        return days[dObj.getDay()];
    }

    function isFutureDate(dateStr) {
        return normalizeDateStr(dateStr) > getTodayStr();
    }

    // 🌙 양력 날짜 문자열(YYYY-MM-DD)을 받아 "음력 M.D" 형태의 짧은 문자열 반환
    function getLunarLabel(dateStr) {
        try {
            const lib = (typeof solarLunar !== 'undefined') ? (solarLunar.default || solarLunar) : null;
            if (!lib || !lib.solar2lunar) return '';
            const dObj = parseDateObj(dateStr);
            const y = dObj.getFullYear(), m = dObj.getMonth() + 1, d = dObj.getDate();
            const r = lib.solar2lunar(y, m, d);
            if (!r || !r.lMonth || !r.lDay) return '';
            return \`\${r.isLeap ? '윤' : ''}음력 \${r.lMonth}.\${r.lDay}\`;
        } catch (e) {
            return '';
        }
    }

    // 음력 공휴일: [설날 전날, 설날, 설날 다음날, 부처님오신날, 추석 전날, 추석, 추석 다음날]
    const SAJU_LUNAR_HOLIDAYS_TABLE = {
        2024: ['2024-02-09', '2024-02-10', '2024-02-11', '2024-05-15', '2024-09-16', '2024-09-17', '2024-09-18'],
        2025: ['2025-01-28', '2025-01-29', '2025-01-30', '2025-05-05', '2025-10-05', '2025-10-06', '2025-10-07'],
        2026: ['2026-02-16', '2026-02-17', '2026-02-18', '2026-05-24', '2026-09-24', '2026-09-25', '2026-09-26'],
        2027: ['2027-02-06', '2027-02-07', '2027-02-08', '2027-05-13', '2027-09-14', '2027-09-15', '2027-09-16'],
        2028: ['2028-01-26', '2028-01-27', '2028-01-28', '2028-05-02', '2028-10-02', '2028-10-03', '2028-10-04'],
        2029: ['2029-02-12', '2029-02-13', '2029-02-14', '2029-05-20', '2029-09-21', '2029-09-22', '2029-09-23'],
        2030: ['2030-02-02', '2030-02-03', '2030-02-04', '2030-05-09', '2030-09-11', '2030-09-12', '2030-09-13']
    };

    function computeKoreanHolidayInfo(year) {
        // 신정(대체공휴일 미적용), 현충일(국가추모일, 대체공휴일 미적용)
        let holidays = new Set([\`\${year}-01-01\`, \`\${year}-06-06\`]);

        // 대체공휴일이 적용되는 고정 양력 공휴일(삼일절/어린이날/광복절/개천절/한글날/성탄절)
        const substituteEligibleSolar = [
            \`\${year}-03-01\`, \`\${year}-05-05\`, \`\${year}-08-15\`,
            \`\${year}-10-03\`, \`\${year}-10-09\`, \`\${year}-12-25\`
        ];
        substituteEligibleSolar.forEach(d => holidays.add(d));

        const yearLunar = SAJU_LUNAR_HOLIDAYS_TABLE[year] || [];
        yearLunar.forEach(d => holidays.add(d));

        // ▶ 대체공휴일 자동 계산 (관공서의 공휴일에 관한 규정 기준: 토·일 겹침 + 다른 공휴일과 겹침)
        const dow = (dateStr) => new Date(dateStr + 'T00:00:00').getDay(); // 0=일 6=토
        const addDays = (dateStr, n) => {
            const d = new Date(dateStr + 'T00:00:00');
            d.setDate(d.getDate() + n);
            return \`\${d.getFullYear()}-\${String(d.getMonth() + 1).padStart(2, '0')}-\${String(d.getDate()).padStart(2, '0')}\`;
        };
        // 토/일이 아니면서 아직 공휴일이 아닌 첫 평일을 찾음
        const nextFreeWeekday = (startDateStr) => {
            let cur = startDateStr;
            while (holidays.has(cur) || dow(cur) === 0 || dow(cur) === 6) {
                cur = addDays(cur, 1);
            }
            return cur;
        };

        const substitutes = new Set();

        // 단일 공휴일(삼일절/어린이날/부처님오신날/광복절/개천절/한글날/성탄절):
        // 토·일과 겹치거나, 서로 다른 공휴일끼리 날짜가 겹치면 대체(예: 2025년 어린이날=부처님오신날)
        const eligibleSingleHolidays = [...substituteEligibleSolar];
        if (yearLunar[3]) eligibleSingleHolidays.push(yearLunar[3]); // 부처님오신날

        const dateCount = {};
        eligibleSingleHolidays.forEach(d => { dateCount[d] = (dateCount[d] || 0) + 1; });

        eligibleSingleHolidays.forEach(d => {
            const w = dow(d);
            const overlapsOtherHoliday = dateCount[d] > 1;
            if (w === 0 || w === 6 || overlapsOtherHoliday) {
                substitutes.add(nextFreeWeekday(addDays(d, 1)));
            }
        });

        // 설날/추석 연휴: 연휴 중 일요일이 포함된 경우에만 대체(토요일 겹침은 대체 없음)
        const handleLunarCluster = (days) => {
            if (!days || days.length === 0) return;
            const hasSunday = days.some(d => dow(d) === 0);
            if (hasSunday) substitutes.add(nextFreeWeekday(addDays(days[days.length - 1], 1)));
        };
        handleLunarCluster(yearLunar.slice(0, 3)); // 설날
        handleLunarCluster(yearLunar.slice(4, 7)); // 추석

        substitutes.forEach(d => holidays.add(d));

        return { holidays, substitutes };
    }

    function getKoreanHolidays(year) {
        return computeKoreanHolidayInfo(year).holidays;
    }

    function getSubstituteHolidaySet(year) {
        return computeKoreanHolidayInfo(year).substitutes;
    }

    // ----- 📆 달력 칸에 표시할 특별한 날 이름: 국경일/명절 > 24절기 > 삼복(초복·중복·말복) 순 우선순위 -----
    const SAJU_SOLAR_HOLIDAY_NAMES = {
        '01-01': '신정', '03-01': '삼일절', '05-05': '어린이날', '06-06': '현충일',
        '08-15': '광복절', '10-03': '개천절', '10-09': '한글날', '12-25': '성탄절'
    };
    const SAJU_24_TERMS = ['소한','대한','입춘','우수','경칩','춘분','청명','곡우','입하','소만','망종','하지','소서','대서','입추','처서','백로','추분','한로','상강','입동','소설','대설','동지'];

    function getLunarHolidayName(dateStr, year) {
        const arr = SAJU_LUNAR_HOLIDAYS_TABLE[year];
        if (!arr) return null;
        // 전날/다음날은 표시 안 함 - 명절 당일(설날/부처님오신날/추석)만 표시
        if (arr[1] === dateStr) return '설날';
        if (arr[3] === dateStr) return '부처님오신날';
        if (arr[5] === dateStr) return '추석';
        return null;
    }

    function getSolarTermLabel(dateStr) {
        try {
            const lib = sajuGetLib();
            const d = parseDateObj(dateStr);
            const y = d.getFullYear();
            for (let n = 1; n <= 24; n++) {
                const day = lib.getTerm(y, n);
                const month = Math.ceil(n / 2);
                if (day === d.getDate() && month === (d.getMonth() + 1)) {
                    return SAJU_24_TERMS[n - 1];
                }
            }
        } catch (e) {}
        return null;
    }

    // 초복(하지로부터 3번째 경일) / 중복(4번째 경일) / 말복(입추로부터 첫 경일) - 하지가 경일이면 그날을 1번째로 셈
    function getBokNalLabel(dateStr) {
        try {
            const lib = sajuGetLib();
            const d = parseDateObj(dateStr);
            const y = d.getFullYear();
            const hajiDay = lib.getTerm(y, 12);
            const ipchuDay = lib.getTerm(y, 15);
            const addDays = (yy, mm, dd, n) => {
                const dt = new Date(yy, mm - 1, dd);
                dt.setDate(dt.getDate() + n);
                return [dt.getFullYear(), dt.getMonth() + 1, dt.getDate()];
            };
            const fmt = (arr) => \`\${arr[0]}-\${String(arr[1]).padStart(2, '0')}-\${String(arr[2]).padStart(2, '0')}\`;

            const gyeongDays = [];
            for (let i = 0; i <= 40 && gyeongDays.length < 4; i++) {
                const [ny, nm, nd] = addDays(y, 6, hajiDay, i);
                const r = lib.solar2lunar(ny, nm, nd);
                if (r.gzDay[0] === '庚') gyeongDays.push([ny, nm, nd]);
            }
            const chobok = gyeongDays[2], jungbok = gyeongDays[3];
            let malbok = null;
            for (let i = 0; i <= 15; i++) {
                const [ny, nm, nd] = addDays(y, 8, ipchuDay, i);
                const r = lib.solar2lunar(ny, nm, nd);
                if (r.gzDay[0] === '庚') { malbok = [ny, nm, nd]; break; }
            }
            if (chobok && fmt(chobok) === dateStr) return '초복';
            if (jungbok && fmt(jungbok) === dateStr) return '중복';
            if (malbok && fmt(malbok) === dateStr) return '말복';
        } catch (e) {}
        return null;
    }

    function getSpecialDayLabel(dateStr) {
        const d = parseDateObj(dateStr);
        const year = d.getFullYear();
        const mmdd = \`\${String(d.getMonth() + 1).padStart(2, '0')}-\${String(d.getDate()).padStart(2, '0')}\`;

        if (getSubstituteHolidaySet(year).has(dateStr)) return { label: '대체공휴일', type: 'holiday' };
        if (SAJU_SOLAR_HOLIDAY_NAMES[mmdd]) return { label: SAJU_SOLAR_HOLIDAY_NAMES[mmdd], type: 'holiday' };
        const lunarName = getLunarHolidayName(dateStr, year);
        if (lunarName) return { label: lunarName, type: 'holiday' };
        const bokLabel = getBokNalLabel(dateStr);
        if (bokLabel) return { label: bokLabel, type: 'bok' };
        const termLabel = getSolarTermLabel(dateStr);
        if (termLabel) return { label: termLabel, type: 'term' };
        return null;
    }

    // 🎉 개인 기념일: 일기 항목에 저장된 기념일 메모를 날짜 기준으로 조회 (달력 칸 표시용)
    // 반복 없음: 정확히 그 날짜만 / 매년·매달 반복: 양력 또는 음력 기준으로 같은 날을 계속 찾아줌
    function sajuAnniversaryMatches(item, dateStr) {
        const anchorDate = normalizeDateStr(item.date);
        const repeat = item.annivRepeat || 'none';
        if (repeat === 'none') return anchorDate === dateStr;

        const calType = item.annivCalType || 'solar';
        const target = parseDateObj(dateStr);

        if (calType === 'solar') {
            const anchor = parseDateObj(anchorDate);
            if (repeat === 'yearly') {
                return target.getMonth() === anchor.getMonth() && target.getDate() === anchor.getDate();
            }
            if (repeat === 'monthly') {
                return target.getDate() === anchor.getDate();
            }
        } else { // 음력 기준
            try {
                const lib = sajuGetLib();
                const [ay, am, ad] = anchorDate.split('-').map(Number);
                const anchorLunar = lib.solar2lunar(ay, am, ad);
                const [ty, tm, td] = dateStr.split('-').map(Number);
                const targetLunar = lib.solar2lunar(ty, tm, td);
                if (repeat === 'yearly') {
                    return targetLunar.lMonth === anchorLunar.lMonth && targetLunar.lDay === anchorLunar.lDay;
                }
                if (repeat === 'monthly') {
                    return targetLunar.lDay === anchorLunar.lDay;
                }
            } catch (e) { return false; }
        }
        return false;
    }

    function getAnniversaryForDate(dateStr) {
        const diaries = getAllDiaries();
        const found = diaries.find(item => item.anniversary && sajuAnniversaryMatches(item, dateStr));
        return found ? found.anniversary : null;
    }

    function getAllDiaries() {
        let combinedList = [];
        let standardData = localStorage.getItem('smartDiaryList');
        if (standardData) {
            try { 
                let parsed = JSON.parse(standardData);
                if (Array.isArray(parsed)) combinedList = parsed;
            } catch (e) {
                combinedList = [];
            }
        }
        return combinedList;
    }

    // ===================== 📅 지출/수입 통계 기간 필터 =====================
    function getStatsPeriodRange() {
        let pad = n => String(n).padStart(2, '0');
        if (statsPeriodMode === 'lastmonth') {
            let y = calYear, m = calMonth - 1;
            if (m < 0) { m = 11; y -= 1; }
            let lastDay = new Date(y, m + 1, 0).getDate();
            return { start: \`\${y}-\${pad(m + 1)}-01\`, end: \`\${y}-\${pad(m + 1)}-\${pad(lastDay)}\` };
        }
        if (statsPeriodMode === 'year') {
            return { start: \`\${calYear}-01-01\`, end: \`\${calYear}-12-31\` };
        }
        if (statsPeriodMode === 'all') {
            return { start: null, end: null };
        }
        if (statsPeriodMode === 'custom') {
            return { start: statsCustomStart || null, end: statsCustomEnd || null };
        }
        // 기본: 이번 달 (달력에서 보고 있는 년/월 기준)
        let lastDay = new Date(calYear, calMonth + 1, 0).getDate();
        return { start: \`\${calYear}-\${pad(calMonth + 1)}-01\`, end: \`\${calYear}-\${pad(calMonth + 1)}-\${pad(lastDay)}\` };
    }

    function getStatsPeriodLabel() {
        if (statsPeriodMode === 'lastmonth') {
            let y = calYear, m = calMonth - 1;
            if (m < 0) { m = 11; y -= 1; }
            return \`\${y}년 \${m + 1}월\`;
        }
        if (statsPeriodMode === 'year') return \`\${calYear}년 전체\`;
        if (statsPeriodMode === 'all') return \`전체 기간\`;
        if (statsPeriodMode === 'custom') {
            if (statsCustomStart && statsCustomEnd) return \`\${statsCustomStart} ~ \${statsCustomEnd}\`;
            if (statsCustomStart) return \`\${statsCustomStart} 이후\`;
            if (statsCustomEnd) return \`\${statsCustomEnd} 이전\`;
            return \`기간 설정\`;
        }
        return \`이번 달\`;
    }

        document.querySelectorAll('#stats-period-group .view-select-btn').forEach(b => b.classList.remove('active'));
        let activeBtn = document.getElementById('stats-period-' + statsPeriodMode);

        const customBox = document.getElementById('stats-custom-period-box');
        if (customBox) customBox.style.display = (statsPeriodMode === 'custom') ? 'flex' : 'none';

    function buildCategoryStatsGroup(moneyType, groupTitle, clickable) {
        const wrapper = document.createElement('div');
        if (groupTitle) {
            const titleEl = document.createElement('div');
            titleEl.style.cssText = 'font-weight:bold; font-size:13px; color:var(--weekday-color); margin: 8px 0 4px;';
            titleEl.textContent = groupTitle;
            wrapper.appendChild(titleEl);
        }

        const diaries = getAllDiaries();
        const range = getStatsPeriodRange();

        let targetCategories = moneyType === 'expense' ? expenseCategories : incomeCategories;
        let categorySums = {};
        let categoryEntries = {};
        targetCategories.forEach(cat => categorySums[cat] = 0);
        let totalAmt = 0;

        diaries.forEach(item => {
            let d = normalizeDateStr(item.date);
            let inRange = (!range.start || d >= range.start) && (!range.end || d <= range.end);
            if (inRange && item.money && item.money.type === moneyType && !item.money.cardPending) {
                let cat = item.money.category;
                let amt = Number(item.money.amount) || 0;
                if (!categorySums[cat]) categorySums[cat] = 0;
                categorySums[cat] += amt;
                totalAmt += amt;
                if (!categoryEntries[cat]) categoryEntries[cat] = [];
                categoryEntries[cat].push({ date: item.date, text: item.text || '', amount: amt });
            }
        });

        let sortedCats = Object.keys(categorySums).map(cat => ({
            category: cat,
            amount: categorySums[cat]
        })).sort((a, b) => b.amount - a.amount).filter(item => item.amount > 0);

        let hasData = sortedCats.length > 0;
        if (!hasData) {
            const emptyEl = document.createElement('div');
            emptyEl.style.cssText = 'text-align:center; color:var(--text-sub); font-size:13px; padding:6px;';
            emptyEl.textContent = \`\${getStatsPeriodLabel()} \${moneyType === 'expense' ? '지출' : '수입'} 내역이 없습니다.\`;
            wrapper.appendChild(emptyEl);
            return wrapper;
        }

        sortedCats.forEach((item, idx) => {
            let percent = totalAmt > 0 ? ((item.amount / totalAmt) * 100).toFixed(1) : 0;
            let fillColorClass = moneyType === 'expense' ? 'expense' : 'income';
            let isSelected = clickable && selectedCategoryFilter === item.category;
            let entries = (categoryEntries[item.category] || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
            let count = entries.length;

            const catBlock = document.createElement('div');
            catBlock.dataset.category = item.category;

            const row = document.createElement('div');
            row.className = \`stat-bar-container \${isSelected ? 'active-stat' : ''}\`;
            row.innerHTML = \`
                <div class="stat-info-row">
                    <span style="font-weight:bold; color:var(--weekday-color);">👉 \${item.category}\${count > 0 ? \`(\${count})\` : ''}</span>
                    <span>\${item.amount.toLocaleString()}원 (<span style="color:var(--primary-color);">\${percent}%</span>)</span>
                </div>
                <div class="stat-bar-bg">
                    <div class="stat-bar-fill \${fillColorClass}" style="width: \${percent}%;"></div>
                </div>
            \`;
            catBlock.appendChild(row);

            if (clickable && count > 0) {
                const detailBox = document.createElement('div');
                detailBox.className = 'stat-detail-list';
                detailBox.style.cssText = \`display:\${isSelected ? 'block' : 'none'}; margin:2px 0 8px; padding:6px 8px; background:rgba(127,127,127,0.08); border-radius:6px;\`;
                entries.forEach(en => {
                    let shortDate = normalizeDateStr(en.date).slice(5).replace('-', '/');
                    let contentText = en.text ? String(en.text).replace(/\\n/g, ' ').trim() : '(내용 없음)';
                    if (contentText.length > 24) contentText = contentText.slice(0, 24) + '…';
                    const dRow = document.createElement('div');
                    dRow.style.cssText = 'display:flex; align-items:center; font-size:12.5px; padding:4px 2px; border-bottom:1px dashed var(--border-color);';
                    dRow.innerHTML = \`
                        <span style="flex:0 0 auto; color:var(--text-sub); margin-right:8px;">\${shortDate}</span>
                        <span style="flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:8px;">\${contentText}</span>
                        <span style="flex:0 0 auto; font-weight:bold;">\${en.amount.toLocaleString()}원</span>
                    \`;
                    detailBox.appendChild(dRow);
                });
                catBlock.appendChild(detailBox);
            }

            if (clickable) {
                row.style.cursor = 'pointer';
                row.onclick = () => selectCategoryFromStats(item.category);
            } else {
                row.style.cursor = 'default';
            }

            wrapper.appendChild(catBlock);
        });

        return wrapper;
    }


    // ===================== 📌 전월 이월액 (다음달로 잔액 연결) =====================
    function getCarryOverMap() {
        let map = null;
        try {
            map = JSON.parse(localStorage.getItem('smartDiaryCarryOver') || 'null');
        } catch (e) {
            map = null;
        }
        if (!map || typeof map !== 'object') map = {};
        return map;
    }

    function carryOverKey(year, month) {
        return \`\${year}-\${String(month + 1).padStart(2, '0')}\`;
    }

    function getCarryOverAmount(year, month) {
        const map = getCarryOverMap();
        return Number(map[carryOverKey(year, month)]) || 0;
    }

    function setCarryOverAmount(year, month, amount) {
        const map = getCarryOverMap();
        map[carryOverKey(year, month)] = Number(amount) || 0;
        localStorage.setItem('smartDiaryCarryOver', JSON.stringify(map));
    }

    function updateCarryOverAmount(value) {
        const rawAmount = String(value).replace(/[^0-9-]/g, '').trim();
        setCarryOverAmount(calYear, calMonth, rawAmount);
        updateMoneySummary();
    }

    function carryOverToNextMonth() {
        const summaryBalance = document.getElementById('summary-balance');
        const currentBalanceText = summaryBalance ? summaryBalance.textContent.replace(/[^0-9-]/g, '') : '0';
        const currentBalance = Number(currentBalanceText) || 0;

        let nextMonth = calMonth + 1;

        setCarryOverAmount(nextYear, nextMonth, currentBalance);

    // ===================== 💼 잔액 보관처별 분류 (지갑/은행 등 직접 입력) =====================
    function getBalanceLocations() {
        let list = null;
        try {
            list = JSON.parse(localStorage.getItem('smartDiaryBalanceLocations') || 'null');
        } catch (e) {
            list = null;
        }
        if (!list || !Array.isArray(list) || list.length === 0) {
            list = [
                { id: 'loc_wallet', name: '지갑', amount: 0 },
                { id: 'loc_bank', name: '은행', amount: 0 }
            ];
            localStorage.setItem('smartDiaryBalanceLocations', JSON.stringify(list));
        }
        return list;
    }

    function saveBalanceLocations(list) {
        localStorage.setItem('smartDiaryBalanceLocations', JSON.stringify(list));
    }

    function renderBalanceLocationsUI() {
        const statsBody = document.getElementById('balance-location-body');
        if (!statsBody) return;
        statsBody.innerHTML = '';

        let locations = getBalanceLocations();
        let total = locations.reduce((sum, loc) => sum + (Number(loc.amount) || 0), 0);

        // 전체 기간 누적 수입-지출로 계산한 실제 잔액 (보관처별 합계와 대조하기 위함)
        // ⏳ 카드 대기(미정산) 지출은 아직 실제로 계좌/지갑에서 빠져나간 게 아니므로 여기서도 제외해야 차액이 맞음
        let calcIncome = 0;
        let calcExpense = 0;
        getAllDiaries().forEach(item => {
            if (item.money && item.money.amount && !item.money.cardPending) {
                let amt = Number(item.money.amount) || 0;
                if (item.money.type === 'income') calcIncome += amt;
                else if (item.money.type === 'expense') calcExpense += amt;
            }
        });
        let calculatedBalance = calcIncome - calcExpense;
        let diff = total - calculatedBalance;
        let diffColor = diff === 0 ? '#2980b9' : (diff > 0 ? 'var(--income-color)' : 'var(--expense-color)');
        let diffText = diff === 0 ? '일치' : (diff > 0 ? \`+\${diff.toLocaleString()}원\` : \`\${diff.toLocaleString()}원\`);

        const totalRow = document.createElement('div');
        totalRow.className = 'balance-loc-total-row';
        totalRow.innerHTML = \`<span>💼 보관처별 합계(차액)</span><span style="color:#2980b9;">\${total.toLocaleString()}원</span>\`;
        statsBody.appendChild(totalRow);

        const diffRow = document.createElement('div');
        diffRow.style.cssText = 'display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-sub); padding:2px 2px 8px;';
        diffRow.innerHTML = \`<span>가계부 계산상 잔액 \${calculatedBalance.toLocaleString()}원 대비</span><span style="font-weight:bold; color:\${diffColor};">차액 \${diffText}</span>\`;
        statsBody.appendChild(diffRow);

        if (locations.length === 0) {
            const emptyEl = document.createElement('div');
            emptyEl.style.cssText = 'text-align:center; color:var(--text-sub); font-size:13px; padding:6px;';
            emptyEl.textContent = '등록된 보관처가 없습니다. 아래에서 추가해보세요.';
            statsBody.appendChild(emptyEl);
        }

        locations.forEach(loc => {
            let amt = Number(loc.amount) || 0;
            let percent = total > 0 ? ((amt / total) * 100).toFixed(1) : 0;

            const row = document.createElement('div');
            row.className = 'balance-loc-row';
            row.innerHTML = \`
                <span class="balance-loc-name">👉 \${loc.name}</span>
                <input type="text" inputmode="numeric" class="balance-loc-amount-input" value="\${amt.toLocaleString()}" onchange="updateBalanceLocationAmount('\${loc.id}', this.value)">
                <span style="font-size:12px; color:var(--text-sub);">원</span>
                <button class="delete-btn" style="font-size:12px;" onclick="removeBalanceLocation('\${loc.id}')">삭제</button>
            \`;
            statsBody.appendChild(row);

            const barBg = document.createElement('div');
            barBg.className = 'stat-bar-bg';
            barBg.style.marginBottom = '8px';
            barBg.innerHTML = \`<div class="stat-bar-fill balance" style="width:\${percent}%;"></div>\`;
            statsBody.appendChild(barBg);
        });

        const addRow = document.createElement('div');
        addRow.className = 'balance-loc-add-row';
        addRow.innerHTML = \`
            <input type="text" id="new-balance-loc-name" placeholder="보관처명 (예: 신한은행)" style="flex:1 1 auto; min-width:0; max-width:150px; padding:6px; border:1px solid var(--border-color); border-radius:6px; font-size:16px;">
            <input type="text" inputmode="numeric" id="new-balance-loc-amount" placeholder="금액" style="flex:0 1 100px; width:100px; max-width:100px; box-sizing:border-box; padding:6px; border:1px solid var(--border-color); border-radius:6px; font-size:16px;">
            <button class="action-btn" style="flex:0 0 auto; padding:6px 10px; font-size:13px;" onclick="addBalanceLocation()">추가</button>
        \`;
        statsBody.appendChild(addRow);
    }

    function addBalanceLocation() {
        const nameInput = document.getElementById('new-balance-loc-name');
        const amountInput = document.getElementById('new-balance-loc-amount');
        const name = nameInput ? nameInput.value.trim() : '';
        const amountRaw = amountInput ? amountInput.value.replace(/[^0-9]/g, '') : '';
        if (!name) {
            alert('보관처 이름을 입력해주세요. (예: 지갑, 은행)');
            return;
        }

        let locations = getBalanceLocations();
        if (locations.some(loc => loc.name === name)) {
            alert('이미 존재하는 보관처입니다.');
            return;
        }

        locations.push({
            id: 'loc_' + Date.now(),
            name: name,
            amount: Number(amountRaw) || 0
        });
        saveBalanceLocations(locations);
        renderBalanceLocationsUI();
    }

    function updateBalanceLocationAmount(id, rawValue) {
        let cleaned = String(rawValue).replace(/[^0-9]/g, '');
        let locations = getBalanceLocations();
        let target = locations.find(loc => loc.id === id);
        if (target) target.amount = Number(cleaned) || 0;
        saveBalanceLocations(locations);
        renderBalanceLocationsUI();
    }

    function removeBalanceLocation(id) {
        if (!confirm('이 보관처를 삭제하시겠습니까?')) return;
        let locations = getBalanceLocations();
        locations = locations.filter(loc => loc.id !== id);
        saveBalanceLocations(locations);
        renderBalanceLocationsUI();
    }

            const m = String(now.getMonth() + 1).padStart(2, '0');
            const lastDay = new Date(y, now.getMonth() + 1, 0).getDate();
            
            const startInput = document.getElementById('custom-start-date');
            const endInput = document.getElementById('custom-end-date');
            if (startInput && !startInput.value) startInput.value = \`\${y}-\${m}-01\`;
            if (endInput && !endInput.value) endInput.value = \`\${y}-\${m}-\${lastDay}\`;
        } else {
            if (customBox) customBox.style.display = 'none';
        }

    }

    function resetSearchFilter() {
        selectedCategoryFilter = '';

    function filterCustomList() {
        const resultListContainer = document.getElementById('search-result-list');
        const statsTotalAmount = document.getElementById('stats-total-amount');
        if (!resultListContainer) return;
        resultListContainer.innerHTML = '';

        // 잔액 통계는 위쪽 분류만 제공하고, 하단 상세 내역 리스트는 표시하지 않음 (다이어리 탭에 별도 존재)
        if (currentStatsType === 'balance') {
            if (searchFilterCard) searchFilterCard.style.display = 'none';
            return;
        }

        let diaries = getAllDiaries();
        let keyword = selectedCategoryFilter.toLowerCase();
        const todayStr = getTodayStr();
        const tObj = parseDateObj(todayStr);

        let customStart = document.getElementById('custom-start-date')?.value || '';
        let customEnd = document.getElementById('custom-end-date')?.value || '';

        let filtered = diaries.filter(item => {
            if (currentStatsType === 'expense') {
                if (!item.money || item.money.type !== 'expense') return false;
            } else if (currentStatsType === 'income') {
                if (!item.money || item.money.type !== 'income') return false;
            } else if (currentStatsType === 'memo') {
                if (item.money && item.money.amount) return false;
                if (!item.text && !item.photo && !item.health && !item.anniversary) return false;
            }

            let itemDateStr = normalizeDateStr(item.date);
            let itemDate = parseDateObj(itemDateStr);
            let diffTime = tObj - itemDate;
            let diffDays = diffTime / (1000 * 60 * 60 * 24);

            if (currentPeriodFilter === 'today-around') {
                if (diffDays < -1 || diffDays > 1) return false;
            } else if (currentPeriodFilter === 'week') {
                if (diffDays < 0 || diffDays > 7) return false;
            } else if (currentPeriodFilter === 'month') {
                let prefix = \`\${calYear}-\${String(calMonth + 1).padStart(2, '0')}\`;
                if (!itemDateStr.startsWith(prefix)) return false;
            } else if (currentPeriodFilter === 'all') {
                if (customStart && itemDateStr < customStart) return false;
                if (customEnd && itemDateStr > customEnd) return false;
            }

            if (keyword !== '') {
                let textMatch = item.text && item.text.toLowerCase().includes(keyword);
                let catMatch = item.money && item.money.category && item.money.category.toLowerCase().includes(keyword);
                let amtMatch = item.money && String(item.money.amount).includes(keyword);
                if (!textMatch && !catMatch && !amtMatch) return false;
            }

            return true;
        });

        let listTotalAmt = filtered.reduce((sum, item) => {
            if (item.money && item.money.cardPending) return sum;
            return sum + (item.money ? (Number(item.money.amount) || 0) : 0);
        }, 0);

        if (statsTotalAmount) {
            statsTotalAmount.textContent = currentStatsType === 'memo' ? \`\${filtered.length}건\` : listTotalAmt.toLocaleString() + '원';
            statsTotalAmount.style.color = currentStatsType === 'expense' ? 'var(--expense-color)' : (currentStatsType === 'income' ? 'var(--income-color)' : 'var(--memo-color)');
        }

        if (listCardMainTitle) {
            let modeName = currentStatsType === 'expense' ? '지출' : (currentStatsType === 'income' ? '수입' : '메모(일기)');
            let catText = selectedCategoryFilter ? \` [\${selectedCategoryFilter}]\` : '';
            listCardMainTitle.textContent = \`🔍 \${modeName}\${catText} 상세 내역 리스트\`;
        }

        if (filtered.length === 0) {
            let typeName = currentStatsType === 'expense' ? '지출' : (currentStatsType === 'income' ? '수입' : '메모(일기)');
            resultListContainer.innerHTML = \`<div style="text-align:center; color:var(--text-sub); font-size:13px; padding:10px;">조건에 일치하는 \${typeName} 내역이 없습니다.</div>\`;
            return;
        }

        filtered.sort((a, b) => {
            const dateCompare = normalizeDateStr(b.date).localeCompare(normalizeDateStr(a.date));
            if (dateCompare !== 0) return dateCompare;
            return (b.time || '').localeCompare(a.time || ''); // 같은 날짜 안에서는 시간 늦은 순으로 정렬
        });

        filtered.forEach(item => {
            let dateStr = normalizeDateStr(item.date);
            let isReserved = isFutureDate(dateStr);

            // 📅 같은 일자끼리는 대표 날짜 헤더 하나만 표시
            if (dateStr !== lastGroupDate) {
                let dayOfWeek = getDayOfWeekStr(dateStr);
                let displayDateStr = \`\${dateStr}(\${dayOfWeek})\`;
                let groupReservedBadge = isReserved ? \`<span style="background:var(--primary-color); color:white; padding:1px 5px; border-radius:4px; font-size:11px; margin-right:4px; font-weight:bold;">[예약]</span>\` : '';
                const groupHeader = document.createElement('div');
                groupHeader.className = 'date-group-header';
                groupHeader.innerHTML = \`📅 \${groupReservedBadge}\${displayDateStr}\`;
                resultListContainer.appendChild(groupHeader);
                lastGroupDate = dateStr;
            }

            const subItem = document.createElement('div');
            subItem.className = 'sub-memo-item';
            
            if (isReserved) {
                subItem.classList.add('is-reserved');
            }

            let headerHTML = '';
            if (item.money) {
                let isExp = item.money.type === 'expense';
                subItem.classList.add('money-item-box');
                if (isExp) subItem.classList.add('is-expense');

                let colorStyle = isExp ? 'color: var(--expense-color);' : 'color: var(--income-color);';
                let typeSign = isExp ? '-' : '+';
                let amountStr = Number(item.money.amount).toLocaleString() + '원';
                let pendingBadge = item.money.cardPending
                    ? \`<span style="background:#f39c12; color:#fff; padding:1px 5px; border-radius:4px; font-size:11px; margin-left:6px; font-weight:bold; vertical-align:middle;">⏳ 카드대기\${item.money.cardName ? ' · ' + item.money.cardName : ''}</span>\`
                    : '';

                headerHTML = \`<div style="font-weight: bold; margin-bottom: 4px; \${colorStyle}">
                    💰 \${typeSign}\${amountStr}\${pendingBadge}
                </div>\`;
            } else {
                subItem.classList.add('memo-only-box');
                headerHTML = \`<div style="font-weight: bold; margin-bottom: 4px; color: var(--memo-color);">
                    📝 메모
                </div>\`;
            }

            let timeBadgeInline = item.time ? \`⏰ \${item.time}\` : '';
            let textContentHTML = item.text ? \`<div class="diary-text">\${item.text}</div>\` : '';
            let photoHTML = renderPhotoHTML(item);
            let healthHTML = renderHealthBadgeHTML(item);
            subItem.classList.add(item.photo ? 'has-photo' : 'no-photo');

            subItem.innerHTML = \`
                <div class="item-top-row">
                    <span class="time-badge-inline">\${timeBadgeInline}</span>
                    <div class="memo-action-btns">
                        
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteDiary('\${item.id}')">삭제</button>
                    </div>
                </div>
                \${headerHTML}
                \${healthHTML}
                \${textContentHTML}
                \${photoHTML}
            \`;
            subItem.addEventListener('click', () => openDiaryForm(dateStr, item));
            resultListContainer.appendChild(subItem);
        });
    }

    function filterDiaryCustomList() {
        const resultListContainer = document.getElementById('diary-search-result-list');
        const diaryStatsTotalAmount = document.getElementById('diary-stats-total-amount');
        if (!resultListContainer) return;
        resultListContainer.innerHTML = '';

        let diaries = getAllDiaries();
        let keyword = diaryKeywordFilter.toLowerCase();
        const todayStr = getTodayStr();
        const tObj = parseDateObj(todayStr);

        let customStart = document.getElementById('diary-custom-start-date')?.value || '';
        let customEnd = document.getElementById('diary-custom-end-date')?.value || '';

        let filtered = diaries.filter(item => {
            // 다이어리(메모) 항목만 대상: 금액이 있는 가계부 항목은 제외
            if (item.money && item.money.amount) return false;
            if (!item.text && !item.photo && !item.health && !item.anniversary) return false;

            let itemDateStr = normalizeDateStr(item.date);
            let itemDate = parseDateObj(itemDateStr);
            let diffDays = (tObj - itemDate) / (1000 * 60 * 60 * 24);

            if (currentDiaryPeriodFilter === 'today-around') {
                if (diffDays < -1 || diffDays > 1) return false;
            } else if (currentDiaryPeriodFilter === 'week') {
                if (diffDays < 0 || diffDays > 7) return false;
            } else if (currentDiaryPeriodFilter === 'month') {
                let prefix = \`\${calYear}-\${String(calMonth + 1).padStart(2, '0')}\`;
                if (!itemDateStr.startsWith(prefix)) return false;
            } else if (currentDiaryPeriodFilter === 'all') {
                if (customStart && itemDateStr < customStart) return false;
                if (customEnd && itemDateStr > customEnd) return false;
            }

            if (keyword !== '') {
                let textMatch = item.text && item.text.toLowerCase().includes(keyword);
                if (!textMatch) return false;
            }

            return true;
        });

        if (diaryStatsTotalAmount) {
            diaryStatsTotalAmount.textContent = \`\${filtered.length}건\`;
        }

        if (diaryListCardMainTitle) {
            let catText = diaryKeywordFilter ? \` [\${diaryKeywordFilter}]\` : '';

        }

        if (filtered.length === 0) {
            resultListContainer.innerHTML = \`<div style="text-align:center; color:var(--text-sub); font-size:13px; padding:10px;">조건에 일치하는 다이어리 내역이 없습니다.</div>\`;
            return;
        }

        filtered.sort((a, b) => {
            const dateCompare = normalizeDateStr(b.date).localeCompare(normalizeDateStr(a.date));
            if (dateCompare !== 0) return dateCompare;
            return (b.time || '').localeCompare(a.time || ''); // 같은 날짜 안에서는 시간 늦은 순으로 정렬
        });

        let lastDiaryGroupDate = null;

        filtered.forEach(item => {
            let dateStr = normalizeDateStr(item.date);
            let isReserved = isFutureDate(dateStr);

            // 📅 같은 일자끼리는 대표 날짜 헤더 하나만 표시
            if (dateStr !== lastDiaryGroupDate) {
                let dayOfWeek = getDayOfWeekStr(dateStr);
                let displayDateStr = \`\${dateStr}(\${dayOfWeek})\`;
                let groupReservedBadge = isReserved ? \`<span style="background:var(--primary-color); color:white; padding:1px 5px; border-radius:4px; font-size:11px; margin-right:4px; font-weight:bold;">[예약]</span>\` : '';
                const groupHeader = document.createElement('div');
                groupHeader.className = 'date-group-header';
                groupHeader.innerHTML = \`📅 \${groupReservedBadge}\${displayDateStr}\`;
                resultListContainer.appendChild(groupHeader);
                lastDiaryGroupDate = dateStr;
            }

            const subItem = document.createElement('div');
            subItem.className = 'sub-memo-item memo-only-box';

            if (isReserved) {
                subItem.classList.add('is-reserved');
            }

            let headerHTML = \`<div style="font-weight: bold; margin-bottom: 4px; color: var(--memo-color);">
                📝 메모
            </div>\`;

            let timeBadgeInline = item.time ? \`⏰ \${item.time}\` : '';
            let textContentHTML = item.text ? \`<div class="diary-text">\${item.text}</div>\` : '';
            let photoHTML = renderPhotoHTML(item);
            let healthHTML = renderHealthBadgeHTML(item);
            subItem.classList.add(item.photo ? 'has-photo' : 'no-photo');

            subItem.innerHTML = \`
                <div class="item-top-row">
                    <span class="time-badge-inline">\${timeBadgeInline}</span>
                    <div class="memo-action-btns">
                        
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteDiary('\${item.id}')">삭제</button>
                    </div>
                </div>
                \${headerHTML}
                \${healthHTML}
                \${textContentHTML}
                \${photoHTML}
            \`;
            subItem.addEventListener('click', () => openDiaryForm(dateStr, item));
            resultListContainer.appendChild(subItem);
        });
    }

    function updateMoneySummary() {
        const diaries = getAllDiaries();
        const prefix = \`\${calYear}-\${String(calMonth + 1).padStart(2, '0')}\`;
        
        const summaryTitle = document.getElementById('money-summary-title');
        const summaryGridBox = document.getElementById('money-summary-grid-box');
        const summarySubHint = document.getElementById('summary-sub-hint');
        const summaryCard = document.getElementById('money-summary-card');

        if (!summaryCard) return;

        if (!isMoneySummaryVisible) {
            summaryCard.style.display = 'block';
            if (summaryTitle) summaryTitle.textContent = \`📝 \${calYear}년 \${calMonth + 1}월 메모(일기) 현황\`;
            if (summarySubHint) summarySubHint.textContent = '현황 정보';
            const carryOverRowHidden = document.getElementById('carry-over-row');
            if (carryOverRowHidden) carryOverRowHidden.style.display = 'none';

            let memoCount = 0;
            let photoOnlyCount = 0;
            let totalEntries = 0;

            diaries.forEach(item => {
                if (normalizeDateStr(item.date).startsWith(prefix)) {
                    let isMemoOnly = (!item.money || !item.money.amount) && (item.text || item.photo);
                    if (isMemoOnly) {
                        totalEntries++;
                        if (item.text) memoCount++;
                        if (item.photo) photoOnlyCount++;
                    }
                }
            });

            if (summaryGridBox) {
                summaryGridBox.innerHTML = \`
                    <div class="money-box memo-stat">
                        <div class="m-label">전체 메모</div>
                        <div class="m-value">\${totalEntries}건</div>
                    </div>
                    <div class="money-box memo-stat">
                        <div class="m-label">글 작성</div>
                        <div class="m-value">\${memoCount}건</div>
                    </div>
                    <div class="money-box memo-stat">
                        <div class="m-label">사진 첨부</div>
                        <div class="m-value">\${photoOnlyCount}건</div>
                    </div>
                \`;
            }

            if (currentStatsType !== 'memo') {
                currentStatsType = 'memo';
            }
            updateCardStatementVisibility();
            if (isSearchFilterOpen) filterCustomList();
            return;
        }

        summaryCard.style.display = 'block';
        if (summaryTitle) summaryTitle.textContent = \`💵 \${calYear}년 \${calMonth + 1}월 가계부 현황\`;
        if (summarySubHint) summarySubHint.textContent = '현황 정보';

        if (summaryGridBox && !summaryGridBox.querySelector('.money-box.income')) {
            summaryGridBox.innerHTML = \`
                <div class="money-box income" onclick="selectMoneySummaryStat('income')">
                    <span class="tap-hint">👆</span>
                    <div class="m-label">총 수입</div>
                    <div class="m-value" id="summary-income">0원</div>
                </div>
                <div class="money-box expense" onclick="selectMoneySummaryStat('expense')">
                    <span class="tap-hint">👆</span>
                    <div class="m-label">총 지출</div>
                    <div class="m-value" id="summary-expense">0원</div>
                </div>
                <div class="money-box balance" onclick="selectMoneySummaryStat('balance')">
                    <span class="tap-hint">👆</span>
                    <div class="m-label">잔액/카드</div>
                    <div class="m-value" id="summary-balance">0원</div>
                </div>
            \`;
        }

        let totalIncome = 0;
        let totalExpense = 0;

        diaries.forEach(item => {
            if (normalizeDateStr(item.date).startsWith(prefix) && item.money && item.money.amount && !item.money.cardPending) {
                let amt = Number(item.money.amount) || 0;
                if (item.money.type === 'income') totalIncome += amt;
                else if (item.money.type === 'expense') totalExpense += amt;
            }
        });

        const carryOverAmount = getCarryOverAmount(calYear, calMonth);
        let balance = carryOverAmount + totalIncome - totalExpense;

        const summaryIncome = document.getElementById('summary-income');
        const summaryExpense = document.getElementById('summary-expense');
        const summaryBalance = document.getElementById('summary-balance');
        const carryOverInput = document.getElementById('carry-over-input');

        if (carryOverInput && document.activeElement !== carryOverInput) {
            carryOverInput.value = carryOverAmount ? carryOverAmount.toLocaleString() : '';
        }

        if (summaryIncome) summaryIncome.textContent = totalIncome.toLocaleString() + '원';
        if (summaryExpense) summaryExpense.textContent = totalExpense.toLocaleString() + '원';
        if (summaryBalance) {
            summaryBalance.textContent = balance.toLocaleString() + '원';
            summaryBalance.style.color = balance < 0 ? 'var(--expense-color)' : '#2980b9';
        }

        if (currentStatsType !== 'memo') renderCategoryStats();
        updateMoneySearchDividerVisibility();

        if (currentStatsType === 'balance') {
            if (searchFilterCard) searchFilterCard.style.display = 'none';
        } else {
            if (searchFilterCard && isSearchFilterOpen) searchFilterCard.style.display = 'block';
            if (isSearchFilterOpen) filterCustomList();
        }
        highlightMoneySummaryBox(currentStatsType);
    }

    function switchMainTab(tabName) {
        const panels = { diary: diaryPanel, money: moneyPanel };
        Object.keys(panels).forEach(key => {
            if (panels[key]) panels[key].classList.toggle('active', key === tabName);
        });
        currentMainTab = tabName;
        const topBtn = document.getElementById('top-toggle-btn');
        if(topBtn){
            if(tabName === 'diary'){
                topBtn.innerHTML = '💰';
                topBtn.title = '가계부로 이동';
            } else {
                topBtn.innerHTML = '📔';
                topBtn.title = '다이어리로 이동';
            }
        }
        if (tabName === 'money') {
            updateMoneySummary();
            renderMoneyAroundToday();
        }
        if (tabName === 'diary') {
            renderDiaryAroundToday();
            if (isDiarySearchFilterOpen) filterDiaryCustomList();
        }
        localStorage.setItem('smartDiaryMainTab', tabName);
    }
    function toggleMainTab(){
        if(currentMainTab === 'diary') switchMainTab('money');
        else switchMainTab('diary');
    }

    function openSettingsModal() {
        renderCategorySettingsList();
        populateSajuSettingsFields();

    function sajuGetLib() {
        return window.solarLunar.default || window.solarLunar;
    }

    function sajuElementOfGan(ch) { return SAJU_ELEM_GAN[ch]; }
    function sajuElementOfZhi(ch) { return SAJU_ELEM_ZHI[ch]; }

    // 일간(day) 오행 기준으로 today 오행과의 관계(십성 단순화)를 반환
    function sajuRelationOf(day, today) {
        if (today === day) return '비겁';
        if (SAJU_GENERATES[day] === today) return '식상';
        if (SAJU_CONTROLS[day] === today) return '재성';
        if (SAJU_CONTROLS[today] === day) return '관성';
        if (SAJU_GENERATES[today] === day) return '인성';
        return '비겁';
    }

    function sajuComputePillars(info) {
        const [y, m, d] = info.date.split('-').map(Number);
        const lib = sajuGetLib();
        const lunar = lib.solar2lunar(y, m, d);
        const yearGz = lunar.gzYear, monthGz = lunar.gzMonth, dayGz = lunar.gzDay;

        let hourGz = null;
        if (info.time) {
            const hour = parseInt(info.time.split(':')[0], 10);
            const dayGanIndex = lib.gan.indexOf(dayGz[0]);
            hourGz = lib.getShiChen(hour, dayGanIndex);
        }
        return {
            year:  { gan: yearGz[0],  zhi: yearGz[1] },
            month: { gan: monthGz[0], zhi: monthGz[1] },
            day:   { gan: dayGz[0],   zhi: dayGz[1] },
            hour:  hourGz ? { gan: hourGz[0], zhi: hourGz[1] } : null
        };
    }

    function sajuComputeElemCounts(pillars) {
        const counts = { 목:0, 화:0, 토:0, 금:0, 수:0 };
        const list = [pillars.year, pillars.month, pillars.day];
        if (pillars.hour) list.push(pillars.hour);
        list.forEach(p => {
            counts[sajuElementOfGan(p.gan)]++;
            counts[sajuElementOfZhi(p.zhi)]++;
        });
        return counts;
    }

    function addBucketListItem() {
        const input = document.getElementById('bl-new-input');

    function moveBucketListItem(id, direction) {
        const idx = bucketListItems.findIndex(item => item.id === id);
        if (idx === -1) return;
        const targetIdx = idx + direction;
        if (targetIdx < 0 || targetIdx >= bucketListItems.length) return;
        [bucketListItems[idx], bucketListItems[targetIdx]] = [bucketListItems[targetIdx], bucketListItems[idx]];
        saveBucketList();
        renderBucketList();
    }

    let bucketEditingId = null; // 지금 수정 중인 항목 id (없으면 null)

    function startEditBucketListItem(id) {
        bucketEditingId = id;
        renderBucketList();
        const inputEl = document.getElementById(\`bl-edit-input-\${id}\`);
        if (inputEl) { inputEl.focus(); inputEl.select(); }
    }

    function saveEditBucketListItem(id) {
        const inputEl = document.getElementById(\`bl-edit-input-\${id}\`);
        if (!inputEl) return;
        const trimmed = inputEl.value.trim();
        const item = bucketListItems.find(i => i.id === id);
        if (item && trimmed) item.text = trimmed;
        bucketEditingId = null;
        saveBucketList();
        renderBucketList();
    }

    function cancelEditBucketListItem() {
        bucketEditingId = null;
        renderBucketList();
    }

    function completeBucketListItem(id) {
        if (!confirm('이 목표를 완료 처리하고 목록에서 지울까요? 🎉')) return;
        bucketListItems = bucketListItems.filter(item => item.id !== id);
        saveBucketList();
        renderBucketList();
    }

        const listEl = document.getElementById('bl-list-area');
        if (!listEl) return;
        if (bucketListItems.length === 0) {
            listEl.innerHTML = \`<div class="bl-empty">🎯 이루고 싶은 목표를 자유롭게 적어보세요!</div>\`;

        listEl.innerHTML = bucketListItems.map((item, idx) => {

            const textAreaHTML = isEditing
                ? \`<input type="text" class="bl-edit-input" id="bl-edit-input-\${item.id}" value="\${item.text.replace(/"/g, '&quot;')}"

                : \`<div class="bl-text" onclick="startEditBucketListItem('\${item.id}')">\${item.text} <span class="bl-edit-hint">✏️</span></div>\`;
            return \`

                <div class="bl-rank">\${idx + 1}</div>

                <div class="bl-actions">
                    <div class="bl-arrow-row">
                        <button class="bl-btn" onclick="moveBucketListItem('\${item.id}', -1)" \${idx === 0 ? 'disabled' : ''}>▲</button>
                        <button class="bl-btn" onclick="moveBucketListItem('\${item.id}', 1)" \${idx === bucketListItems.length - 1 ? 'disabled' : ''}>▼</button>

    function getHealthEntriesInPeriod(days) {
        const all = getAllDiaries();
        const cutoff = new Date();
        cutoff.setHours(0, 0, 0, 0);
        cutoff.setDate(cutoff.getDate() - (days - 1));
        return all
            .filter(item => item.health && normalizeDateStr(item.date))
            .filter(item => {
                const d = parseDateObj(normalizeDateStr(item.date));
                return d >= cutoff;
            })
            .sort((a, b) => normalizeDateStr(a.date).localeCompare(normalizeDateStr(b.date)));
    }

    function hsBuildLineChart(points, opts) {
        // points: [{x: dateStr, y: number}], opts: {color, unit, title}
        if (points.length === 0) {
            return \`<div class="hs-chart-block"><div class="hs-chart-title">\${opts.title}</div><div class="hs-chart-empty">아직 기록이 없어요</div></div>\`;
        }
        const W = 300, H = 110, PAD = 10;
        const values = points.map(p => p.y);
        const min = Math.min(...values), max = Math.max(...values);
        const range = Math.max(1, max - min);
        const stepX = points.length > 1 ? (W - PAD * 2) / (points.length - 1) : 0;
        const coords = points.map((p, i) => ({
            x: PAD + i * stepX,
            y: PAD + (1 - (p.y - min) / range) * (H - PAD * 2)
        }));
        let path = \`M \${coords[0].x} \${coords[0].y}\`;
        for (let i = 1; i < coords.length; i++) path += \` L \${coords[i].x} \${coords[i].y}\`;
        const dots = coords.map(c => \`<circle cx="\${c.x}" cy="\${c.y}" r="3" fill="\${opts.color}" />\`).join('');
        const last = points[points.length - 1];
        return \`
            <div class="hs-chart-block">
                <div class="hs-chart-title">\${opts.title} <span style="color:\${opts.color}; font-weight:800;">최근 \${last.y}\${opts.unit}</span></div>
                <svg viewBox="0 0 \${W} \${H}" width="100%" style="display:block;">

    function renderHealthStats() {

        const chartArea = document.getElementById('hs-chart-area');
        const medArea = document.getElementById('hs-med-summary');
        const listArea = document.getElementById('hs-list-area');
        if (!chartArea || !medArea || !listArea) return;

        // 혈압(수축기 기준 추이) 차트
        const bpPoints = entries.filter(e => e.health.systolic).map(e => ({
            x: normalizeDateStr(e.date), y: e.health.systolic
        }));
        // 혈당 추이 차트
        const glucosePoints = entries.filter(e => e.health.glucose).map(e => ({
            x: normalizeDateStr(e.date), y: e.health.glucose
        }));

        chartArea.innerHTML =
            hsBuildLineChart(bpPoints, { color: '#c2455a', unit: '', title: '🩺 혈압 추이(수축기)' }) +
            hsBuildLineChart(glucosePoints, { color: '#4C7FD1', unit: '', title: '🩸 혈당 추이' });

        // 복약률
        const medEntries = entries.filter(e => e.health.medMorning || e.health.medEvening || 'medMorning' in e.health || 'medEvening' in e.health);
        const totalDays = entries.length;
        const morningCount = entries.filter(e => e.health.medMorning).length;
        const eveningCount = entries.filter(e => e.health.medEvening).length;
        if (totalDays > 0 && (morningCount > 0 || eveningCount > 0)) {
            const morningRate = Math.round((morningCount / totalDays) * 100);
            const eveningRate = Math.round((eveningCount / totalDays) * 100);
            medArea.innerHTML = \`
                <div class="hs-med-summary-box">
                    <div class="hs-med-item"><div class="hs-med-rate">\${morningRate}%</div><div class="hs-med-label">아침약 복용률</div></div>

                </div>\`;
        } else {
            medArea.innerHTML = '';
        }

        // 최근 기록 리스트 (최신순)
        if (entries.length === 0) {
            listArea.innerHTML = \`<div class="hs-chart-empty">이 기간에는 기록이 없어요</div>\`;

            listArea.innerHTML = entries.slice().reverse().slice(0, 30).map(e => {
                const d = parseDateObj(normalizeDateStr(e.date));
                const dateLabel = \`\${d.getMonth() + 1}/\${d.getDate()}\`;

                return \`<div class="hs-list-row"><div class="hs-list-date">\${dateLabel}</div><div class="hs-list-vals">\${badges}</div></div>\`;

    function ldtValidateInputs() {
        const errorEl = document.getElementById('ldt-error-msg');
        const drawBtn = document.getElementById('ldt-draw-btn');
        const inputs = Array.from({ length: 6 }, (_, i) => document.getElementById(\`ldt-fav\${i + 1}\`));

        let vals = [];
        let hasError = false, msg = '';
        inputs.forEach(input => input.classList.remove('ldt-error'));

        for (let i = 0; i < inputs.length; i++) {
            const valStr = inputs[i].value.trim();
            if (valStr === '') continue;
            const val = parseInt(valStr);
            if (val < 1 || val > 45) {
                hasError = true; inputs[i].classList.add('ldt-error');
                msg = '⚠️ 1~45 사이 숫자만 가능해요!'; break;
            }
            if (vals.includes(val)) {
                hasError = true; inputs[i].classList.add('ldt-error');
                inputs[vals.indexOf(val)].classList.add('ldt-error');
                msg = '⚠️ 중복된 숫자가 있어요!'; break;
            }
            vals.push(val);
        }

        if (hasError) {
            errorEl.textContent = msg; errorEl.style.display = 'block';
            drawBtn.disabled = true;
        } else {
            errorEl.style.display = 'none';
            if (ldtGames.length < 5) drawBtn.disabled = false;
        }
        return !hasError;
    }

    function ldtGetFavoriteNumbers() {
        const favs = [];
        for (let i = 1; i <= 6; i++) {
            const val = parseInt(document.getElementById(\`ldt-fav\${i}\`).value);
            if (!isNaN(val) && val >= 1 && val <= 45 && !favs.includes(val)) favs.push(val);
        }
        return favs;
    }

        function ldtDrawNumbers(favs) {
        try{
            const best = sajuGetBestGwainForLotto();
            return sajuGenerateWithFixedGuaranteed(favs||[], best, Math.floor(Math.random()*1000));
        }catch(e){
            const nums = [...(favs||[])];
            while (nums.length < 6) {
                const n = Math.floor(Math.random() * 45) + 1;
                if (!nums.includes(n)) nums.push(n);
            }
            return nums.sort((a, b) => a - b);
        }
    }

    function ldtAddGames() {
        if (!ldtValidateInputs()) return;
        let requestCount = parseInt(document.getElementById('ldt-game-count').value);
        const favs = ldtGetFavoriteNumbers();
        const remainingSlots = 5 - ldtGames.length;
        if (remainingSlots <= 0) { alert('5게임이 모두 찼어요. 초기화 후 다시 시도해주세요.'); return; }
        if (requestCount > remainingSlots) requestCount = remainingSlots;

        for (let i = 0; i < requestCount; i++) ldtGames.push(ldtDrawNumbers(favs));
        ldtFavs = favs;

        const keys = ldtStorageKeys();
        localStorage.setItem(keys.games, JSON.stringify(ldtGames));
        localStorage.setItem(keys.favs, JSON.stringify(ldtFavs));
        ldtRenderResults();
    }
